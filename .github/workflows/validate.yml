name: "CI: Validate"

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрые проверки: CRLF и RSI не требуют схем движка — только дерево репо
  # и Rust-инструменты. Джоба намеренно без submodule-dependent шагов, чтобы
  # бежать параллельно с validate-schemas.
  validate-fast:
    name: Validate (fast)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      # RobustToolbox/Schemas/rsi.json нужен валидатору RSI.
      run: git submodule update --init

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: Tools/mini-rs

    - name: Build Rust tools
      run: cargo build --release --workspace
      working-directory: Tools/mini-rs

    - name: Check for CRLF
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
      run: Tools/mini-rs/target/release/mini-check-crlf

    - name: Validate RSIs
      run: Tools/mini-rs/target/release/mini-validate-rsi --schema RobustToolbox/Schemas/rsi.json Resources/

  # Схемные проверки карт и attributions: Rust-валидатор yamale-схем
  # (Tools/mini-rs/crates/validate-yamale) вместо PaulRitter/yaml-schema-validator.
  # Валидируются только изменённые файлы: 360 МБ всех карт pyyaml шёл ~8 минут,
  # Rust-порт проверяет диф за секунды. Структурные поломки карт всё равно
  # ловит загрузка карт в MapTests.
  validate-schemas:
    name: Validate (schemas)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        # Нужны обе стороны merge-коммита PR, чтобы посчитать изменённые файлы.
        fetch-depth: 2

    - name: Detect changed files
      id: changes
      run: |
        git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" || true
        grep -E '^Resources/Maps/.*\.yml$' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/maps.txt" || true
        grep -E 'attributions\.ya?ml$' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/attributions.txt" || true
        echo "maps=$(wc -l < "$RUNNER_TEMP/maps.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
        echo "attributions=$(wc -l < "$RUNNER_TEMP/attributions.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

    - name: Setup Submodule
      # Схемы mapfile.yml и rga.yml живут в движке (RobustToolbox/Schemas).
      run: git submodule update --init

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: Tools/mini-rs

    - name: Build Rust tools
      run: cargo build --release --workspace
      working-directory: Tools/mini-rs

    - name: Validate changed map files
      if: ${{ steps.changes.outputs.maps != '0' }}
      run: xargs -a "$RUNNER_TEMP/maps.txt" Tools/mini-rs/target/release/mini-validate-yamale --schema RobustToolbox/Schemas/mapfile.yml

    - name: Validate changed attributions
      if: ${{ steps.changes.outputs.attributions != '0' }}
      run: xargs -a "$RUNNER_TEMP/attributions.txt" Tools/mini-rs/target/release/mini-validate-yamale --schema RobustToolbox/Schemas/rga.yml
