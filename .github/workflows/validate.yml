name: "CI: Validate"

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрые проверки: CRLF и RSI не требуют схем движка — только дерево репо
  # и Rust-инструменты. Джоба намеренно без submodule-dependent шагов, чтобы
  # бежать параллельно с validate-schemas.
  validate-fast:
    name: Validate (fast)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      # RobustToolbox/Schemas/rsi.json нужен валидатору RSI.
      run: git submodule update --init

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: Tools/mini-rs

    - name: Build Rust tools
      run: cargo build --release --workspace
      working-directory: Tools/mini-rs

    - name: Check for CRLF
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
      run: Tools/mini-rs/target/release/mini-check-crlf

    - name: Validate RSIs
      run: Tools/mini-rs/target/release/mini-validate-rsi --schema RobustToolbox/Schemas/rsi.json Resources/

  # Схемные проверки карт и attributions: схемы и валидаторы живут в движке.
  validate-schemas:
    name: Validate (schemas)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        # Нужны обе стороны merge-коммита PR, чтобы посчитать изменённые файлы.
        fetch-depth: 2

    - name: Detect changed paths
      id: changes
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
        if grep -qE '^(Resources/Maps/|Resources/Prototypes/Maps/)' "$RUNNER_TEMP/changed.txt"; then
          echo "maps=true" >> "$GITHUB_OUTPUT"
        fi
        if grep -qE 'attributions\.ya?ml$' "$RUNNER_TEMP/changed.txt"; then
          echo "attributions=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Submodule
      run: git submodule update --init

    - name: Pull engine updates
      id: engine
      uses: space-wizards/submodule-dependency@v0.1.5

    # Схемная проверка всех карт идёт ~7 минут и нужна только если PR трогает карты.
    # Сломанную карту всё равно поймают тесты загрузки карт (MapTests).
    - name: Validate map files
      if: ${{ !cancelled() && steps.engine.outcome == 'success' && github.event.pull_request.draft == false && steps.changes.outputs.maps == 'true' }}
      uses: PaulRitter/yaml-schema-validator@v1
      with:
        schema: RobustToolbox/Schemas/mapfile.yml
        path_pattern: .*Resources/Maps/.*
        validators_path: RobustToolbox/Schemas/mapfile_validators.py
        validators_requirements: .github/Schemas/mapfile_requirements.txt

    - name: Validate RGAs
      if: ${{ !cancelled() && steps.engine.outcome == 'success' && github.event.pull_request.draft == false && (github.event_name != 'pull_request' || steps.changes.outputs.attributions == 'true') }}
      uses: PaulRitter/yaml-schema-validator@v1
      with:
        schema: .github/Schemas/rga.yml
        path_pattern: .*attributions.ya?ml$
        validators_path: RobustToolbox/Schemas/rga_validators.py
        validators_requirements: .github/Schemas/rga_requirements.txt
