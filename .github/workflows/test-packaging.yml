name: "CI: Test Packaging"

on:
  push:
    branches: [ master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - 'Directory.Build.*'
      - 'Content.Packaging/**'
      - '.github/workflows/test-packaging.yml'
      # no docs on which one of these is supposed to work, so
      # why not just do both
      - 'RobustToolbox'
      - 'RobustToolbox/**'
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - 'Directory.Build.*'
      - 'Content.Packaging/**'
      - '.github/workflows/test-packaging.yml'
      - 'RobustToolbox'
      - 'RobustToolbox/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test Packaging (${{ matrix.target.name }})
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Windows/macOS серверные пакеты никто не использует, а ночная Publish
      # всё равно собирает все платформы, поэтому на PR проверяем только то,
      # что реально деплоится: linux-сервер и клиент.
      matrix:
        target:
          - name: linux
            args: server --platform linux-x64 --platform linux-arm64
          - name: client
            args: client

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Detect engine revision
        id: rtsha
        run: echo "sha=$(git rev-parse HEAD:RobustToolbox)" >> "$GITHUB_OUTPUT"

      - name: Cache RobustToolbox build
        uses: actions/cache@v4
        with:
          path: |
            RobustToolbox/bin
            RobustToolbox/*/obj
          key: rt-build-ubuntu-Release-${{ steps.rtsha.outputs.sha }}-${{ hashFiles('**/nuget.config', '**/*.props') }}
          restore-keys: |
            rt-build-ubuntu-Release-${{ steps.rtsha.outputs.sha }}-
            rt-build-ubuntu-Release-

      - name: Install dependencies
        run: dotnet restore

      - name: Touch cached engine outputs
        run: |
          find RobustToolbox/bin RobustToolbox/*/obj -type f -exec touch {} + 2>/dev/null || true

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package ${{ matrix.target.name }}
        run: dotnet run --project Content.Packaging ${{ matrix.target.args }}

  success:
    name: Test Packaging
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && github.actor != 'PJBot' && github.event.pull_request.draft == false
    steps:
      - name: Packaging succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Packaging failed!"
            exit 1
          fi
