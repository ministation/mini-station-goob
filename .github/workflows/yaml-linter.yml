name: "CI: YAML Linter"

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: YAML Linter
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup submodule
        run: |
          git submodule update --init --recursive
      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5
      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.403
      # Собираем только линтер, а не весь solution: так шаг короче и не тянет
      # Content.MapRenderer, который в CI больше не нужен.
      # Карты рендерил MapRenderer, но их загрузку и так проверяют тесты (MapTests).
      - name: Install dependencies
        run: dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj
      - name: Build
        run: dotnet build Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-restore /p:WarningsAsErrors= /m
      - name: Run Linter
        run: dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-build
