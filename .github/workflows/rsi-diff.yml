name: Diff RSIs

on:
  pull_request_target:
    paths:
      - '**.rsi/**.png'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diff:
    name: Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Ana06/get-changed-files uses the Compare API, which fails on large PRs with:
      # "Sorry, this diff is taking too long to generate" / not_available.
      # Paginated PR files API scales; also avoids the Node 20 action deprecation.
      - name: Get changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t rows < <(
            gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv'
          )

          added=()
          modified=()
          removed=()

          is_rsi_path() {
            # RSIDiffBot only cares about files inside *.rsi/ (png/meta/etc).
            case "$1" in
              *.rsi|*.rsi/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          for row in "${rows[@]+"${rows[@]}"}"; do
            IFS=$'\t' read -r status filename previous <<< "$row"

            if ! is_rsi_path "$filename"; then
              # Renames out of RSI still need the previous path as removed.
              if [[ "$status" == "renamed" ]] && is_rsi_path "$previous"; then
                removed+=("$previous")
              fi
              continue
            fi

            case "$status" in
              added)
                added+=("$filename")
                ;;
              removed)
                removed+=("$filename")
                ;;
              modified|changed)
                modified+=("$filename")
                ;;
              renamed)
                if is_rsi_path "$previous"; then
                  removed+=("$previous")
                fi
                added+=("$filename")
                ;;
            esac
          done

          join_space() {
            local IFS=' '
            echo "$*"
          }

          {
            echo "added=$(join_space "${added[@]+"${added[@]}"}")"
            echo "modified=$(join_space "${modified[@]+"${modified[@]}"}")"
            echo "removed=$(join_space "${removed[@]+"${removed[@]}"}")"
          } >> "$GITHUB_OUTPUT"

      - name: Diff changed RSIs
        id: diff
        uses: space-wizards/RSIDiffBot@v1.1
        with:
          modified: ${{ steps.files.outputs.modified }}
          removed: ${{ steps.files.outputs.removed }}
          added: ${{ steps.files.outputs.added }}
          basename: ${{ github.event.pull_request.base.repo.full_name }}
          basesha: ${{ github.event.pull_request.base.sha }}
          headname: ${{ github.event.pull_request.head.repo.full_name }}
          headsha: ${{ github.event.pull_request.head.sha }}

      - name: Potentially find comment
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        uses: peter-evans/find-comment@v1
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: RSI Diff Bot

      - name: Create comment if it doesn't exist
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v1
        with:
          issue-number: ${{ github.event.number }}
          body: |
            ${{ steps.diff.outputs.summary-details }}

      - name: Update comment if it exists
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v1
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            ${{ steps.diff.outputs.summary-details }}

      - name: Update comment to read that it has been edited
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v1
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: append
          body: |
            Edit: diff updated after ${{ github.event.pull_request.head.sha }}
