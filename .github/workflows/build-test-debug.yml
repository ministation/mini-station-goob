name: "CI: Build & Test Debug"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    # Раньше здесь был 12G swap-файл, и restore периодически падал с
    # "No space left on device" (run 41893971226). Сборке на 16G раннере swap
    # не нужен: он остался только в test-integration, где реально нужна память.
    # Освобождаем место, которое на ubuntu-раннере занимают Android SDK, GHC,
    # CodeQL и Swift: сборке .NET они не нужны, а запас под NuGet и bin лишним не будет.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
        df -h /

    - &checkout
      name: Checkout Master
      uses: actions/checkout@v4.2.2
      with:
        # история репозитория не нужна ни одному шагу - экономит 1-3 минуты
        fetch-depth: 1

    - name: Setup Submodule
      run: git submodule update --init --recursive

    - &submodule_pull
      name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - &dotnet
      name: Setup .NET Core
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.403

    - &nuget_cache
      name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-ubuntu-${{ hashFiles('**/nuget.config', '**/*.props') }}
        restore-keys: |
          nuget-ubuntu-

    # Кэш сборки движка: сабмодуль меняется редко, а пересобирается каждым PR.
    # Ключ по точному SHA гитлинка — content-addressed, протухание исключено.
    - name: Detect engine revision
      id: rtsha
      run: echo "sha=$(git rev-parse HEAD:RobustToolbox)" >> "$GITHUB_OUTPUT"

    - &rt_build_cache
      name: Cache RobustToolbox build
      uses: actions/cache@v4
      with:
        path: |
          RobustToolbox/bin
          RobustToolbox/*/obj
        key: rt-build-ubuntu-DebugOpt-${{ steps.rtsha.outputs.sha }}-${{ hashFiles('**/nuget.config', '**/*.props') }}
        restore-keys: |
          rt-build-ubuntu-DebugOpt-${{ steps.rtsha.outputs.sha }}-
          rt-build-ubuntu-DebugOpt-

    - name: Install dependencies
      run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    # Свежий checkout пишет исходники с новым mtime; выровняем метки кэша,
    # иначе up-to-date проверки MSBuild пересоберут движок целиком.
    - name: Touch cached engine outputs
      run: |
        find RobustToolbox/bin RobustToolbox/*/obj -type f -exec touch {} + 2>/dev/null || true

    - name: Build Project
      run: dotnet build Content.IntegrationTests/Content.IntegrationTests.csproj --configuration DebugOpt --no-restore /m -clp:ErrorsOnly

    - name: Save build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          bin/Content.*/*.json
          bin/Content.IntegrationTests/*.dll
          bin/Content.IntegrationTests/*.pdb
          bin/Content.IntegrationTests/runtimes/linux-x64/**
          bin/Content.Tests/*.dll
        retention-days: 1

  test-unit:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - *checkout
    - &submodule
      name: Setup Submodule
      run: git submodule update --init
    - *submodule_pull
    - *dotnet
    - &download_build
      name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: bin/

    - name: Link runtimes
      run: ln -s $(pwd)/bin/Content.IntegrationTests/runtimes bin/Content.Tests/

    - name: Run Content.Tests
      run: dotnet test bin/Content.Tests/Content.Tests.dll -- NUnit.ConsoleOut=0

  test-integration:
    name: test-integration (${{ matrix.shard.name }})
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # В Content.IntegrationTests параллелятся фикстуры (классы), а тесты
      # внутри фикстуры идут последовательно: AssemblyInfo.cs задаёт
      # ParallelScope.Children + LevelOfParallelism(2). Поэтому режем не только
      # по категориям, но и по методам: PostMapInitTest (309.5с целиком) разбит
      # на две части по ~155с, а EntityTest.SpawnAndDeleteEntityCountTest
      # (159.5с) идёт отдельно, в паре с лёгкой другой фикстурой.
      # Замеры по trx прогона 41888601359; было два шарда: prototype-sweep
      # 407с wall и main 135с. Ожидаемые wall: map-slow 154.8с, map-rest
      # 154.7с, entity-big 159.5с (PrototypeSaveTest 29.8с параллельно),
      # rules ~154с (256.4с CPU на двух полосах). Фильтры взаимно исключающие:
      # в объединении дают ровно старый sweep-шард (42 теста) плюс main (507).
      matrix:
        shard:
          - name: main
            filter: cat != MapTests && cat != GameRuleTests && cat != PrototypeSweepTests
          - name: map-slow
            filter: cat == MapTests && (test == 'Content.IntegrationTests.Tests.PostMapInitTest.NoSavedPostMapInitTest' || test == 'Content.IntegrationTests.Tests.PostMapInitTest.NonGameMapsLoadableTest')
          - name: map-rest
            filter: cat == MapTests && class != 'Content.IntegrationTests.Tests.SaveLoadSaveTest' && class != 'Content.IntegrationTests.Tests.SaveLoadMapTest' && test != 'Content.IntegrationTests.Tests.PostMapInitTest.NoSavedPostMapInitTest' && test != 'Content.IntegrationTests.Tests.PostMapInitTest.NonGameMapsLoadableTest'
          - name: entity-big
            filter: (class == 'Content.IntegrationTests.Tests.EntityTest' && test == 'Content.IntegrationTests.Tests.EntityTest.SpawnAndDeleteEntityCountTest') || (cat == PrototypeSweepTests && class == 'Content.IntegrationTests.Tests.PrototypeSaveTest')
          - name: rules
            filter: cat == GameRuleTests || (cat == MapTests && (class == 'Content.IntegrationTests.Tests.SaveLoadSaveTest' || class == 'Content.IntegrationTests.Tests.SaveLoadMapTest')) || (cat == PrototypeSweepTests && class == 'Content.IntegrationTests.Tests.PrototypeTests.PrototypeTests') || (cat == PrototypeSweepTests && class == 'Content.IntegrationTests.Tests.EntityTest' && test != 'Content.IntegrationTests.Tests.EntityTest.SpawnAndDeleteEntityCountTest')

    env:
      DOTNET_gcServer: 1
      DOTNET_TieredPGO: 0

    steps:
    # Swap нужен только тестам (две параллельные пары server+client); сборке
    # на 16G раннере он не нужен, а 12G файла на диске роняли restore.
    # 12G оставляем без изменений: уменьшать вслепую нельзя.
    - name: Enlarge swap
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h
    - *checkout
    - *submodule
    - *submodule_pull
    - *dotnet
    - *download_build

    - name: Run Content.IntegrationTests (${{ matrix.shard.name }})
      timeout-minutes: 25
      run: |
        dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll \
          --logger "trx;LogFileName=${{ matrix.shard.name }}.trx" --results-directory TestResults -- \
          NUnit.Where="${{ matrix.shard.filter }}" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

    # Опечатка в NUnit.Where не должна пройти незамеченной: пустой шард
    # валит job. Точное число тестов не сверяем, иначе любой PR с новым
    # тестом краснел бы на этом шаге.
    - name: Verify shard selected tests
      run: |
        python3 - "${{ matrix.shard.name }}" TestResults/${{ matrix.shard.name }}.trx <<'PY'
        import sys
        import xml.etree.ElementTree as ET
        name, path = sys.argv[1], sys.argv[2]
        ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
        count = len(ET.parse(path).getroot().findall("t:Results/t:UnitTestResult", ns))
        print(f"{name}: {count} tests")
        sys.exit(0 if count > 0 else 1)
        PY

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.shard.name }}
        path: TestResults/*.trx
        retention-days: 7
        if-no-files-found: ignore

  ci-success:
    name: Build & Test Debug
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: CI succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ||
                "${{ needs.test-unit.result }}" != "success" ||
                "${{ needs.test-integration.result }}" != "success" ]]; then
            echo "Not all tests succeeded!"
            exit 1
          fi
          exit 0
