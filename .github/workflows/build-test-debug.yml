name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: |
        dotnet build --configuration DebugOpt --no-restore /m
        test -f bin/Content.IntegrationTests/Content.IntegrationTests.dll

    - name: Run Content.Tests
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --filter "FullyQualifiedName!~Content.Tests.Client.Stylesheets.StyleGlassStylesheetTests" -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive build output
      run: |
        rm -rf test_results
        tar czf /tmp/build.tar.gz --exclude='.git' --exclude='./test_results' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: /tmp/build.tar.gz
        retention-days: 1
        compression-level: 0

    - name: Archive unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-unit-results
        path: test_results/*
        retention-days: 7
        if-no-files-found: ignore

  integration-tests:
    if: github.event.pull_request.draft == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [fast, heavy]

    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Extract build
      run: tar xzf build.tar.gz && rm build.tar.gz

    - name: Verify integration build output
      run: |
        ls -la bin/Content.IntegrationTests/
        test -f bin/Content.IntegrationTests/Content.IntegrationTests.dll

    - name: Run Content.IntegrationTests
      shell: bash
      env:
        DOTNET_gcServer: 1
        SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        RESULTS_DIR="$GITHUB_WORKSPACE/integration_test_results"
        rm -rf "$RESULTS_DIR" test_results
        mkdir -p "$RESULTS_DIR"

        if [ "$SHARD" = "heavy" ]; then
          FILTER='FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest|FullyQualifiedName~Content.IntegrationTests.Tests.PostMapInitTest|FullyQualifiedName~Content.IntegrationTests.Tests.Power.StationPowerTests|FullyQualifiedName~Content.IntegrationTests.Tests.Power.PowerTest|FullyQualifiedName~Content.IntegrationTests.Tests.Atmos.AirtightTest|FullyQualifiedName~Content.IntegrationTests.Tests.ClickableTest'
        else
          FILTER='FullyQualifiedName!~Content.IntegrationTests.Tests.EntityTest&FullyQualifiedName!~Content.IntegrationTests.Tests.PostMapInitTest&FullyQualifiedName!~Content.IntegrationTests.Tests.Power.StationPowerTests&FullyQualifiedName!~Content.IntegrationTests.Tests.Power.PowerTest&FullyQualifiedName!~Content.IntegrationTests.Tests.Atmos.AirtightTest&FullyQualifiedName!~Content.IntegrationTests.Tests.ClickableTest'
        fi

        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj \
          --filter "$FILTER" \
          --results-directory "$RESULTS_DIR" \
          --logger "trx;LogFileName=IntegrationTests_${SHARD}.trx" \
          --logger "console;verbosity=normal" \
          -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml=logs NUnit.WorkDirectory="$RESULTS_DIR"

        find "$RESULTS_DIR" -type f | head -50

        TRX=$(find "$RESULTS_DIR" -name "IntegrationTests_${SHARD}.trx" | head -1)
        if [ -z "$TRX" ]; then
          echo "No TRX file under $RESULTS_DIR"
          exit 1
        fi

        TOTAL=$(grep -oE 'total="[0-9]+"' "$TRX" | head -1 | grep -oE '[0-9]+')
        PASSED=$(grep -oE 'passed="[0-9]+"' "$TRX" | head -1 | grep -oE '[0-9]+')
        FAILED=$(grep -oE 'failed="[0-9]+"' "$TRX" | head -1 | grep -oE '[0-9]+')
        echo "Shard $SHARD trx=$TRX total=$TOTAL passed=$PASSED failed=$FAILED"

        MIN_TESTS=100
        if [ "$SHARD" = "heavy" ]; then MIN_TESTS=30; fi
        if [ -z "$TOTAL" ] || [ "$TOTAL" -lt "$MIN_TESTS" ]; then
          echo "Expected at least $MIN_TESTS integration tests, got '${TOTAL:-0}'"
          exit 1
        fi
        if [ -n "$FAILED" ] && [ "$FAILED" -gt 0 ]; then
          echo "$FAILED test(s) failed"
          exit 1
        fi

    - name: Archive integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-integration-results-${{ matrix.shard }}
        path: integration_test_results/**
        retention-days: 7
        if-no-files-found: ignore

  ci-success:
    name: Build & Test Debug
    needs:
      - build
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
