name: "Labels: PR"

on:
- pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Labeling is non-critical: don't fail CI on transient GitHub 5xx ("Unicorn") errors.
    continue-on-error: true
    steps:
    - uses: actions/labeler@v6
