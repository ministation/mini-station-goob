# Network profiling preset — enable Prometheus and verbose net logging for baseline KPI capture.
# Usage: run server with --config-file pointing at this preset (optionally merged with your server config).

[metrics]
enabled = true
host = "127.0.0.1"
port = 44880

[net]
log_late_msg = true

# Key Prometheus histograms to watch:
# - robust_game_state_update_usage{area="Serialize States"}
# - robust_game_state_update_usage{area="Send States"}
# - robust_game_state_update_usage{area="Process Leave"}
# - npc_active_count
#
# Client baseline: enable netgraph overlay (Options > Network) and set:
#   net.buffer_size = 2-3
#   net.pvs_enter_budget = 150-250
#
# Related Mini presets:
#   mini-highpop.toml     — combined production high-pop (preferred)
#   mini-network.toml     — PVS / AEAD thread / Lidgren log hygiene (not TLS)
#   mini-server-perf.toml — physics 1 substep + NPC budget + cheap atmos
#   mini-client.toml      — docs: put outline.enabled = false in *client* config.toml
#
# Load high-pop: config.presets=_Mini/mini-highpop
# Ops: Tools/highpop_server_env.sh + Tools/measure_highpop_load.sh
#
# Smoke checklist (perf deploy):
#   1) Server tick/FPS under load (histograms above)
#   2) Physics clipping (doors/projectiles) after target_minimum_tickrate = 30
#   3) Client: outlines off, FPS in busy rooms