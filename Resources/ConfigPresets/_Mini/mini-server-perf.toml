# Cheap server CPU wins for Mini Station (pair with mini-network.toml).
# Prefer the combined preset: config.presets=_Mini/mini-highpop
# Or merge with mini-network.toml into instance config.toml.
#
# Smoke after deploy:
# - Server FPS / tick time under peak (Prometheus or metrics from network-baseline.toml)
# - Late round: footprints stay off (decals used to accumulate hard)
# - Do NOT set physics.target_minimum_tickrate = 30 (REPLICATED; kills VSync lock feel)

[footprints]
# Bloody footprints / drag marks. Off by default in GoobCVars; pin explicitly for Mini.
enabled = false
minimum_puddle_size = 6

[npc]
# Soft cap under dense awake HTN populations (engine default 128).
max_updates = 96

[debug]
# Never disable Pow3r parallelism in production.
pow3r_disable_parallel = false

[atmos]
mmos_expensive_airflow = false
superconduction = false
space_wind = false

[midi]
max_events_per_second = 400
max_events_per_batch = 40

# Keep engine default physics.target_minimum_tickrate = 60 (2 substeps @ tickrate 30).
# Matching tickrate (30) saves CPU but tanks perceived smoothness / VSync lock feel.
