# middle setting: supposed to be a "normal round" baseline setting
- type: entity
  id: SecretPlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    # Mini: fewer free (non-token) antags — lower chaos => fewer roundstarts + midrounds
    minStartingChaos: 6
    maxStartingChaos: 12
    livingChaosChange: -0.010
    deadChaosChange: 0.022
    # chance for greenshift as well as evilshift
    chaosChangeVariationMin: 0.55
    chaosChangeVariationMax: 1.15
    eventIntervalMin: 450
    eventIntervalMax: 900
    # there's some misc variables in the comp if you want to try tweaking those
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

# the Setting that Kills You
- type: entity
  id: SecretPlusAdmeme
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 40
    maxStartingChaos: 40 # ling-blob-nukeops is fun
    livingChaosChange: -0.03
    deadChaosChange: 0.03
    chaosExponent: 1
    eventIntervalMin: 60
    eventIntervalMax: 200 # hell
    primaryAntagsWeightTable: SecretPlusChaos
    ignoreIncompatible: true
    ignoreTimings: true # would run out of events otherwise

# greenshift setting
- type: entity
  id: SecretPlusLow
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 3
    maxStartingChaos: 6
    noRoundstartAntags: false # CorvaxGoob-Balance Changes: set true to false
    livingChaosChange: -0.004
    deadChaosChange: 0.015
    chaosExponent: 1.2
    eventIntervalMin: 700
    eventIntervalMax: 1100

# survival+
# "baseline" ramping setting
- type: entity
  id: SecretPlusRampingMid
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 0
    maxStartingChaos: 0
    noRoundstartAntags: true
    speedRamping: 0.0003 # ramps to 2x in about an hour, to 3x in ~2

#Low pop gamemode stuff taliored for the early hours of goob in the us
- type: entityTable
  id: SecretPlusTableLowpop
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: SpaceTrafficControlTable
      - !type:NestedSelector
        tableId: BasicGameRulesTableLowpop

- type: entity
  id: SecretPlusLowpop
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 4
    maxStartingChaos: 8
    eventIntervalMin: 180
    eventIntervalMax: 540
    # Mini: lowpop must not roll Heretic from SecretPlusPrimary
    primaryAntagsWeightTable: SecretPlusLowpop
    roundStartAntagsWeightTable: SecretPlusLowpop
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTableLowpop

# only spawns tots and theives allowing an antag to spawn in low pop- thus keeping the server entertained with gruel
# like the tot gamemode but (slightly?) more advanced.
- type: weightedRandom
  id: SecretPlusLowpop
  weights:
    # subgamemodes
    Thief: 0.2
    # normal
    Traitor: 1
