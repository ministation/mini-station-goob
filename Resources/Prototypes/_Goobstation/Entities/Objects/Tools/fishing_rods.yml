# Normal fishing lure (the float thrown into the water)
- type: entity
  id: FishingLure
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Objects/Specific/Fishing/fishing_equipment.rsi
    state: float
  - type: Item
    sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
    size: Normal
  - type: FishingLure

- type: entity
  id: FishingLureMakeshift
  parent: FishingLure
  categories: [ HideSpawnMenu ]