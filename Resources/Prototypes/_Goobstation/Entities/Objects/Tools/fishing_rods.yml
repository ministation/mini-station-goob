# Advanced rod with endless synthetic bait
- type: entity
  id: FishingRodScience
  parent: FishingRod
  components:
  - type: Sprite
    layers:
    - state: fishing_rod_science
    - state: reel_science
      map: [ "reel" ]
    - state: line_overlay
      visible: false
      map: [ "line" ]
    - state: hook_overlay
      visible: false
      map: [ "hook" ]
    - state: worm_overlay
      visible: false
      map: [ "bait" ]
  - type: FishingRod
    frameState: frame_science
    inhandState: rod_science
    completionSpeedMultiplier: 1.1
    baitSpeedMultiplier: 1.1
    decelerationMultiplier: 1.1
    gravityMultiplier: 1.2
  - type: ItemSlots
    slots:
      line:
        name: fishing-rod-slot-line
        startingItem: FishingLine
        whitelist:
          tags:
          - FishingLine
      hook:
        name: fishing-rod-slot-hook
        startingItem: FishingHook
        whitelist:
          tags:
          - FishingHook
      bait:
        name: fishing-rod-slot-bait
        startingItem: FishingBaitSynthetic
        whitelist:
          tags:
          - FishingBait

