# Basic rod
- type: entity
  id: FishingRod
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fishing_equipment.rsi
    layers:
    - state: fishing_rod
    - state: reel_overlay
      map: [ "reel" ]
    - state: line_overlay
      visible: false
      map: [ "line" ]
    - state: hook_overlay
      visible: false
      map: [ "hook" ]
    - state: worm_overlay
      visible: false
      map: [ "bait" ]
  - type: Item
    sprite: _Goobstation/Objects/Specific/Fishing/fishing_rod_inhand.rsi
    heldPrefix: rod
    size: Normal
    inhandVisuals:
      left:
      - state: rod-inhand-left
        map: ["rod-inhand-left"]
      - state: reel_overlay-inhand-left
        map: ["reel_overlay-inhand-left"]
      - state: line_overlay-inhand-left
        visible: false
        map: ["line_overlay-inhand-left"]
      - state: hook_overlay-inhand-left
        visible: false
        map: ["hook_overlay-inhand-left"]
      right:
      - state: rod-inhand-right
        map: ["rod-inhand-right"]
      - state: reel_overlay-inhand-right
        map: ["reel_overlay-inhand-right"]
      - state: line_overlay-inhand-right
        visible: false
        map: ["line_overlay-inhand-right"]
      - state: hook_overlay-inhand-right
        visible: false
        map: ["hook_overlay-inhand-right"]
  - type: UseDelay # Just for visuals and to prevent autoclickers
    delay: 0.08 # 12,5 CPS at max
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Piercing: 4
  - type: FishingRod
  - type: Tag
    tags:
    - FishingRod
  - type: ItemSlots
    slots:
      line:
        name: fishing-rod-slot-line
        startingItem: FishingLine
        whitelist:
          tags:
          - FishingLine
      hook:
        name: fishing-rod-slot-hook
        startingItem: FishingHook
        whitelist:
          tags:
          - FishingHook
      bait:
        name: fishing-rod-slot-bait
        whitelist:
          tags:
          - FishingBait
          components:
          - Edible
          - Fish
  - type: ContainerContainer
    containers:
      line: !type:ContainerSlot
      hook: !type:ContainerSlot
      bait: !type:ContainerSlot
  - type: UserInterface
    interfaces:
      enum.FishingRodEquipmentUiKey.Key:
        type: FishingRodEquipmentBoundUserInterface

# Variation of a normal rod
- type: entity
  id: FishingRodGoon
  suffix: Goon
  parent: FishingRod
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/goon_rod.rsi
    layers:
    - state: icon
  - type: FishingRod
    inhandState: rod_goon

# Makeshift rod
- type: entity
  id: FishingRodMakeshift
  parent: FishingRod
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/makeshift_rod.rsi
    layers:
    - state: icon
  - type: FishingRod
    floatPrototype: FishingLureMakeshift
    efficiency: 0.8
    difficultyModifier: 5
    inhandState: rod_makeshift
  - type: Construction
    graph: FishingRodMakeshift
    node: makeshiftRod

# Golden rod
- type: entity
  id: FishingRodGolden
  parent: FishingRod
