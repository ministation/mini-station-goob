- type: entity
  id: ContractorBaton
  parent: [BaseSyndicateContraband, TelescopicBaton]
  name: contractor baton
  description: A compact, specialised baton assigned to Syndicate contractors. Applies light electrical shocks to targets.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
    layers:
    - state: icon-off
      map: [ "enum.ItemToggleVisuals.Layer" ]
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/contractor_baton.rsi
  #- type: TelescopicBaton #FUCK OFF
  #  alwaysDropItems: true #FUCK THE FUCK OFF
  # mini-station: оружие из рук не выбивать вообще — в том числе в первые 1.8 с после раскрытия
  # (унаследованный KnockdownOnHit с dropItems: true выбивал предметы при ударе сразу после активации)
  - type: KnockdownOnHit
    dropItems: false
  - type: UseDelay
    delays:
      default:
        length: 1
      telebaton:
        length: 1
  - type: ItemToggle
    soundActivate:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonextend.ogg
    soundDeactivate:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonextend.ogg
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Goobstation/Weapons/Baton/contractorbatonhit.ogg
      params:
        variation: 0.250
    activatedDamage:
      types:
        Shock: 5
        Ion: 35
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
  - type: StaminaDamageOnHit
    # mini-station: 3×30=90 < 100 ≤ 4×30 — стаминакрит ровно с 4-го удара (при 85 крит приходил со 2-го)
    damage: 30
  - type: StunBorgsOnHit
  - type: TogglePreventStaminaDamage
