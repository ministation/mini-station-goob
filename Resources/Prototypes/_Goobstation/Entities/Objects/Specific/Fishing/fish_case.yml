- type: entity
  parent: BaseStorageItem
  id: FishCase
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fishcase.rsi
    state: fishbox
  - type: Item
    size: Large
  - type: Storage
    grid:
    - 0,0,9,9
    maxItemSize: Ginormous
    whitelist:
      components:
      - Fish
  - type: FishCase
  - type: StaticPrice
    price: 200

- type: entity
  parent: FishCase
  id: FishCaseFreshwater
  components:
  - type: FishCase
    fluid: Freshwater

- type: entity
  parent: FishCase
  id: FishCaseSaltwater
  components:
  - type: FishCase
    fluid: Saltwater

- type: entity
  parent: FishCase
  id: FishCaseSyndicate
  components:
