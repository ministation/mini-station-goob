#
# The fishing treasure chest and its pirate themed loot. Items that have no SS14
# counterpart are replaced with the closest station item, so the list stays useful.

- type: entityTable
  id: FishingTreasureChestLoot
  table: !type:GroupSelector
    children:
    - id: SpaceCash1000
      weight: 6
    - id: CannonBall
      weight: 6
    - id: CannonBallGrapeshot
      weight: 4
    - id: ClothingHeadHatPirate
      weight: 6
    - id: ClothingHeadHatPirateTricord
      weight: 3
    - id: ClothingUniformJumpsuitPirate
      weight: 5
    - id: ClothingOuterCoatPirate
      weight: 4
    - id: ClothingNeckCloakPirateCap
      weight: 2
    - id: DrinkRumBottleFull
      weight: 6
    - id: Cutlass
      weight: 4
    - id: Musket
      weight: 2
    - id: BaitCanSuper
      weight: 3
    - id: FishingLineBluespace
      weight: 1
    - id: FishingHookJaws
      weight: 2
    - id: FishingHookAnomaly
      weight: 2
    - id: FishingRodGolden
      weight: 1
    - id: FishingRodMaster
      weight: 1
    - id: FishingRodTelescopic
      weight: 2
    - id: FishingRodScience
      weight: 1
    - id: FishAnalyzer
      weight: 3
    - id: AquariumKit
      weight: 2
    - id: FishingGeneGun
      weight: 1
    - id: PlushieCarp
      weight: 2

- type: entity
  id: FishingTreasureChest
  parent: BaseStructureDynamic
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/treasure_chest.rsi
    offset: 0, 0.25
    layers:
    - state: treasure
      map: [ "base" ]
  - type: Icon
    sprite: _Goobstation/Objects/Specific/Fishing/treasure_chest.rsi
    state: treasure
  - type: FishingTreasureChest
    table: FishingTreasureChestLoot

- type: entity
  id: FishingTreasureChestPrize
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _Goobstation/Objects/Specific/Fishing/treasure_chest.rsi
    state: treasure
  - type: FishingTreasureChestPrize
