# Ported from tgstation/tgstation (code/modules/fishing, AGPL-3.0-or-later).

- type: entity
  id: FishFryish
  parent: BaseFish
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fish.rsi
    state: fryish
  - type: Fish
    fish: FishFryish
  - type: FishGrowth
    result: FishFryishFritterish
    growthTime: 210
  - type: Tag
    tags:
    - FishingBait

- type: entity
  id: FishFryishFritterish
  parent: BaseFish
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fish.rsi
    state: fritterish
  - type: Fish
    fish: FishFryishFritterish
  # tg randomizes one of three cosmetic forms on spawn.
  - type: FishVariant
    variants:
    - spriteState: fritterish
    - spriteState: bernardfish
      name: fish-variant-fritterish-bernard-name
      description: fish-variant-fritterish-bernard-desc
    - spriteState: matthewfish
      name: fish-variant-fritterish-matthew-name
      description: fish-variant-fritterish-matthew-desc

- type: entity
  id: FishFryishNessie
  parent: BaseFish
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fish_wide.rsi
    state: nessiefish
  - type: Fish
    fish: FishFryishNessie
  - type: Item
    size: Huge

