- type: entity
  id: MaterialSilo
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: material silo
  description: Bluespace storage connected to most lathes on the station.
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/silo.rsi
    layers:
    - state: ore_silo
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSource
    range: 1000
    ports:
      - MaterialSilo
  - type: Machine
    board: MaterialSiloMachineCircuitboard
  - type: Appearance
  - type: MaterialStorage
    ignoreColor: true
  - type: Silo
  # Mini: у прежнего хранилища материалов было окно (список материалов, выдача листов,
  # подключение лат вручную). Возвращаем его, чтобы сило можно было нормально использовать.
  - type: OreSilo
    range: 3000
  - type: ActivatableUI
    key: enum.OreSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreSiloUiKey.Key:
        type: OreSiloBoundUserInterface
  - type: DeviceLinkSink
    ports:
      - FillbotAnyItem

- type: entity
  id: BaseSiloUtilizer
  abstract: true
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 1000
  - type: DeviceLinkSink
    ports:
      - FillbotAnyItem
      - MaterialSiloUtilizer
  - type: SiloUtilizer
  - type: MaterialStorage
    connectToSilo: true
