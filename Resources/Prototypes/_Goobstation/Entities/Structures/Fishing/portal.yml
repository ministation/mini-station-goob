# Ported from tgstation/tgstation (code/modules/fishing, AGPL-3.0-or-later).

- type: entity
  id: FishingPortalGenerator
  parent: BaseMachine
  name: fish-porter 3000
  description: Fishing anywhere, anytime... anyway, what was I talking about?
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Fishing/fishing_equipment.rsi
    state: portal
    layers:
    - state: portal
    - state: portal_on
      map: [ "active" ]
      visible: false
    - state: portal_emissive
      map: [ "emissive" ]
      visible: false
      shader: unshaded
  - type: Machine
    board: FishingPortalMachineCircuitboard
  # BaseMachine (unlike ConstructibleMachine) does not declare the machine board
  # containers; without this the entity gains a ContainerContainer on spawn and
  # fails UninitializedSaveTest.
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: FishingPortal
  - type: ActivatableUI
    key: enum.FishingPortalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FishingPortalUiKey.Key:
        type: FishingPortalBoundUserInterface

- type: entity
  id: FishingPortalMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: fish-porter machine board
  description: A machine printed circuit board for a fish-porter 3000.
  components:
  - type: MachineBoard
    prototype: FishingPortalGenerator
    partRequirements: # Mini: Orion MachineParts
      Servo: 2
      Capacitor: 2
