# Ported from tgstation/tgstation (code/modules/fishing, AGPL-3.0-or-later).
#
# The dimensions of the fish-porter 3000. In tg these sources exist only inside the
# fishing portal generator and have no water turf of their own. Loot that has no SS14
# counterpart (message in a bottle, survival capsule, bluespace ore) is omitted, so the
# remaining entries are slightly more likely than in tg.

- type: fishingSource
  id: FishingSourcePortal
  radialState: fish_tank
  radialName: fishing-portal-source-aquarium
  catalogDescription: fishing-source-portal-aquarium
  table: !type:GroupSelector
    children:
    - !type:NoneSelector
      weight: 7
    - id: FishGoldfish
      weight: 10
    - id: FishGuppy
      weight: 10
    - id: FishAngelfish
      weight: 10
    - id: FishPerch
      weight: 5
    - id: FishGoldfishThreeEyes
      weight: 3
    - id: FishPlasmatetra
      weight: 3

