# The randomizer catches the union of every other portal and never rolls a dud, as in tg.
# tg rolls a fresh weight between 1 and 4 for every entry when the source is first used,
# a fixed weight of 2, the middle of that range, keeps the catch pool identical without
# touching prototype data at runtime.
- type: fishingSource
  id: FishingSourcePortalRandom
  radialState: misaligned_question_mark
  radialName: fishing-portal-source-random
  table: !type:GroupSelector
    children:
    - id: FishHoloCheckered
      weight: 1
    - id: FishGoldfish
      weight: 2
