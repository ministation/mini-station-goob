# Ported from tgstation/tgstation (code/modules/fishing, AGPL-3.0-or-later).
#
# Weights are taken from the DM fish tables. A dud roll is a NoneSelector entry.
# Items that have no SS14 counterpart are omitted, so the relative chance of the
# remaining entries is slightly higher than in tg. Dynamic sources (aquarium,
# vending machine, hydroponics tray) build their loot from the host they are attached
# to, so their table is a dud only fallback. Deep fryer and surgery have no matching
# host in SS14, they use static tables instead.

