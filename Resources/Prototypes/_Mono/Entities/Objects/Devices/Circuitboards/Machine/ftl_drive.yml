- type: entity
  id: MachineFTLDriveCircuitboard
  parent: BaseMachineCircuitboard
  name: FSS-512 bluespace drive board
  description: A machine board for a bluespace drive.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: MachineFTLDrive
    partRequirements: # Mini: Orion MachineParts
      Servo: 5 # Mini: Orion Manipulator->Servo
    stackRequirements:
      Steel: 5

- type: entity
  id: MachineFTLDriveHighCircuitboard
