  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: MachineFTLDriveHigh
    partRequirements: # Mini: Orion MachineParts
      Servo: 5 # Mini: Orion Manipulator->Servo
    stackRequirements:
      Steel: 15
