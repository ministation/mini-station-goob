# Нейроигроки: бегство от опасности и визиты точек интереса.
# Точку (NeuroPoint) выбирает NeuroPlayerSystem в коде.
- type: htnCompound
  id: NeuroFleeCompound
  branches:
    # Убежать в точку, которую выбрал NeuroPlayerSystem (в сторону от опасности).
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:NeuroPointOperator
            pointKey: NeuroPoint
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
        - !type:HTNPrimitiveTask
          operator: !type:SetFloatOperator
            targetKey: IdleTime
            amount: 5
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

    # Мини: точка бегства может оказаться недостижимой (за стеной, в космосе, на другом гриде) —
    # тогда MoveToOperator падает ещё на планировании, ветка отменяется целиком, и бот стоял на
    # месте, пока его били: реакции не было вообще. Запасная ветка даёт движение всегда —
    # PickAccessibleOperator подбирает тайл, до которого путь реально существует.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickAccessibleOperator
            rangeKey: FleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
        - !type:HTNPrimitiveTask
          operator: !type:SetFloatOperator
            targetKey: IdleTime
            amount: 3
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

- type: htnCompound
  id: NeuroVisitCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:NeuroPointOperator
            pointKey: NeuroPoint
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
        - !type:HTNPrimitiveTask
          operator: !type:SetFloatOperator
            targetKey: IdleTime
            amount: 70
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
