- type: entityCondition
  id: IsHumanoid
  condition: !type:WhitelistCondition
    whitelist:
      components:
      - HumanoidAppearance

- type: entityCondition
  id: IsAwake
  condition: !type:WhitelistCondition
    inverted: true
    whitelist:
      components:
      - Sleeping
