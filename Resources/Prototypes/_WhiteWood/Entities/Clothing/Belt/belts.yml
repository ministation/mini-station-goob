  components:
  - type: Sprite
    sprite: _WhiteWood/Clothing/Belt/sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _WhiteWood/Clothing/Belt/sheath.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: Rapier
        insertVerbText: sheath-insert-verb
