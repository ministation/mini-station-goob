# German -----------------------------------------------------
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitGeneralBlack
  name: немецкая черная генеральская форма
  suffix: OldWar
  description: Черная немецкая генеральская форма. На петлицах изображены 3 золотых дубовых листа, а погоны выполнены из плетеного шнура, внутренний ряд которого серебристый, а боковые - золотистые.
  components:
    - type: Sprite
      sprite: _WhiteWood/Fractions/Clothing/OldWar/Uniforms/Jumpsuit/German/general_black.rsi
    - type: Clothing
      sprite: _WhiteWood/Fractions/Clothing/OldWar/Uniforms/Jumpsuit/German/general_black.rsi

- type: entity
  parent: ClothingUniformBase
  id: CClothingUniformGeneralGreen
  name: немецкая полевая генеральская форма
  suffix: OldWar
  description: Полевая немецкая генеральская форма. Петлицы богато орнаментированы золотыми, вышитыми на суконном клапане алого цвета с стилизованным дубовым листом. Вот так! И запомните, что голова у солдата, чтобы думать, а мозги чтобы соображать.
  components:
    - type: Sprite
      sprite: _WhiteWood/Fractions/Clothing/OldWar/Uniforms/Jumpsuit/German/general_green.rsi
    - type: Clothing
      sprite: _WhiteWood/Fractions/Clothing/OldWar/Uniforms/Jumpsuit/German/general_green.rsi

