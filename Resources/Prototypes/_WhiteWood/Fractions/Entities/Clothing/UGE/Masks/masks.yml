- type: entity
  parent: ClothingMaskPullableBase
  id: CMMaskGas
  name: противогаз
  suffix: ОПЗ
  description: Закрывающая лицо маска, которую можно подключить к системе подачи воздуха. Очищает воздух от вредных газов.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Clothing/UGE/Masks/gas.rsi
  - type: Clothing
    sprite: _WhiteWood/Fractions/Clothing/UGE/Masks/gas.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
    - HamsterWearable
    - WhitelistChameleon
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: true
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95

