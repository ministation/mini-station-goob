- type: entity
  name: MP-40
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunMP38
  suffix: Пистолет-пулемёт
  description: Пистолет-пулемёт, разработанный в Германии и использовавшийся Вермахтом во время Второй мировой войны. Использует автоматические патроны 35-го калибра.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/German/SMGs/mp38/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/German/SMGs/mp38/tiny.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/German/SMGs/mp38/tiny.rsi
  - type: GunWieldBonus
    minAngle: -22
    maxAngle: -40
  - type: Gun
    minAngle: 24
    maxAngle: 45
    fireRate: 5
    soundGunshot:
      path: /Audio/_WhiteWood/Fractions/Weapons/Guns/SMGs/mp38/mp38_shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/_WhiteWood/Fractions/Weapons/Guns/SMGs/mp38/mp38_reload.ogg
        ejectSound: /Audio/_WhiteWood/Fractions/Weapons/Guns/SMGs/mp38/mp38_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistolSubMachineGun
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
