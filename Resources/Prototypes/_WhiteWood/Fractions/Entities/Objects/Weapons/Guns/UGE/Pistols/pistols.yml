- type: entity
  name: Пистолет VP78
  parent: BaseWeaponPistol
  id: WeaponPistol88M4
  suffix: ОПЗ, Пистолет
  description: Стандартное огнестрельное оружие. Стреляет пулями 35-го калибра, пробивающими броню, и может стрелять в автоматическом режиме.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/UGE/Pistols/m77.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/UGE/Pistols/m77.rsi
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol88M4
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol88M4
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol45GAP
        priority: 1
        whitelist:
          tags:
            - CartridgePistol45GAP

