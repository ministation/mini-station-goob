- type: entity
  name: com-15
  parent: BaseWeaponPistol
  id: WeaponPistolCom-15
  suffix: Пистолет
  description: Непритязательный пистолет. Он компактный, надежный и маломощный. Неплохой пистолет, но он не идет ни в какое сравнение с другим базовым оборудованием. Использует патроны 9×19mm.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/SCP Foundation/Pistols/com-15.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _WhiteWood/Fractions/Objects/Weapons/Guns/SCP Foundation/Pistols/com-15.rsi
  - type: Gun
    minAngle: 4
    fireRate: 5
    maxAngle: 21
    angleIncrease: 9
    angleDecay: 10
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg

