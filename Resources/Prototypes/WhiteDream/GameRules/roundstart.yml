- type: entity
  id: BloodCult
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 15
    chaosScore: 1000
  - type: BloodCultRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodCultist ]
      max: 4
      min: 2
      playerRatio: 15
      useAntagCountScale: false # Mini: культу нужен полный стартовый состав, множитель антагов его не трогает
      briefing:
        text: blood-cult-role-greeting
        color: Red
        sound: "/Audio/WhiteDream/BloodCult/blood_cult_greeting.ogg"
      startingGear: BloodCultistGear
      components:
      - type: BloodCultist
      - type: BloodCultSpellsHolder
      mindRoles:
      - MindRoleBloodCultist
