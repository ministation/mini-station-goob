- type: entity
  id: BaseFloorWaterEntity
  abstract: true
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999 #.inf seems to break the whole yaml file, but would definitely be preferable.
        reagents:
        - ReagentId: Water
          Quantity: 9999999
#CorvaxGoob-errorfix-start ахуенное решение было избежать - обработки, но наплодить столько же ошибок
  - type: SolutionRegeneration
    duration: 99999
    solution: tank
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
#CorvaxGoob-errorfix-end
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
      # Goobstation - fishing
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
      # Goobstation - fishing
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
  # Goobstation - fishing
  - type: FishingSource
    source: FishingSourceOceanBeach
  # Goobstation - fishing
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay

# Mini: спрайт и угловое сглаживание из апстрима SS14 (CC-BY-SA-4.0, vladimir.s).
# Сглаживание живёт здесь, а не в BaseFloorWaterEntity, потому что у FloorAzureWaterEntity (Corvax) своя RSI без угловых состояний.
- type: entity
  parent: BaseFloorWaterEntity
  id: FloorWaterEntity
  components:
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-water.rsi
    drawdepth: BelowFloor
  - type: IconSmooth
    key: water
    additionalKeys:
    - walls
    base: water
