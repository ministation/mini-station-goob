- type: entity
  id: FloorLavaEntity
  name: lava
  description: Don't jump in. It's not worth it, no matter how funny it is.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#FF4500"
  # Mini: лава гудит и потрескивает. Fireplace - тот же луп, что у костров/каминов,
  # но тише и с меньшим радиусом: на лавовом озере тайлов много и звуки складываются.
  - type: AmbientSound
    volume: -14
    range: 3
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
    triggerGroups: # Goobstation
      types:
        - Lava
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 2.5 # Lavaland Change
      multiplierOnExisting: 0.75
    - !type:Ignite
  # Lavaland Change start
    - !type:AdjustTemperature
      amount: 10000 # thermal energy, not temperature!
    - !type:MovementSpeedModifier
      walkSpeedModifier: 0.6
      sprintSpeedModifier: 0.6
  # Lavaland Change end
  # Goobstation - fishing
  - type: FishingSource
    source: FishingSourceLava
  # Goobstation - fishing
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  # Mini: upstream SS14 liquid lava sprites (CC-BY-SA-4.0, vladimir.s) with corner smoothing.
  # ВАЖНО: стейты water1<->water4 и water3<->water6 в liquid-lava.rsi переставлены относительно апстрима master —
  # они приведены к дорефакторной нумерации под наш (старый) IconSmooth. Подробности: docs/_Mini/liquid-smoothing-port.md
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-lava.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-lava.rsi
    state: full
  - type: IconSmooth
    key: floor
    additionalKeys:
    - walls
    base: water # liquid-lava.rsi state names are water0..7 (pre-refactor order, see docs/_Mini/liquid-smoothing-port.md)
    shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
    # Goobstation - fishing
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
    # Goobstation - fishing
  - type: Tag
    tags:
      - HideContextMenu
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: FloorCosmicDecay
