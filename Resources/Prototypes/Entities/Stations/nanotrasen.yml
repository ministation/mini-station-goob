- type: entity
  abstract: true
  id: BaseStationNanotrasen
  components:
    - type: NpcFactionMember
      factions:
        - NanoTrasen

- type: entity
  id: StandardNanotrasenStation
  parent:
    - BaseStation
    - BaseStationGoal # CorvaxGoob
    - BaseStationNews
    - BaseStationCargo
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationNtrTasks
    - BaseStationArrivals
    - BaseStationGateway
    - BaseStationShuttles
    - BaseStationCentcomm
    - BaseStationEvacuation
    - BaseStationAlertLevels
    - BaseStationMagnet
    - BaseStationExpeditions
    - BaseStationSalvageJobs
    - BaseStationSiliconLawCrewsimov
    - BaseStationAllEventsEligible
    - BaseStationNanotrasen
    - BaseStationDeliveries
    - BaseStationWizardTarget # Goobstation
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform

- type: entity
  id: NanotrasenCentralCommand
  parent:
    - BaseStation
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationAlertLevels
    - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
    # Roundstart/latejoin jobs live only on CentComm (grid loaded via StationCentcomm).
    - type: StationJobs
      availableJobs:
        CentralCommandOfficial: [ 1, 1 ]
        CentralCommandAssistant: [ 1, 1 ]
    # Same dedicated-station pattern as Typan — AssignRoundstartHandledJobs + forced spawn points.
    - type: TTStationHandleJob
      jobs:
      - CentralCommandOfficial
      - CentralCommandAssistant

- type: entity
  id: StandardStationArena
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
