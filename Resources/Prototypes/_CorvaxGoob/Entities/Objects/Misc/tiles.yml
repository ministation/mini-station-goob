- type: entity
  parent: FloorTileItemBase
  id: FloorTileItemAstroChromite
  name: astro-chromite
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Tiles/tile.rsi
    state: chromite
  - type: Item
    sprite: _CorvaxGoob/Objects/Tiles/tile.rsi
    heldPrefix: chromite
  - type: FloorTile
    outputs:
    - Plating
    - FauxAstroChromite
  - type: Stack
    stackType: FauxTileAstroChromite

- type: entity
  parent: FloorTileItemBase
  id: FloorTileItemAstroSnowDug
