    sprite: _CorvaxGoob/Objects/Tiles/tile.rsi
    state: snow-dug
  - type: Item
    sprite: _CorvaxGoob/Objects/Tiles/tile.rsi
    heldPrefix: snow-dug
  - type: FloorTile
    outputs:
    - Plating
    - FauxAstroSnowDug
  - type: Stack
    stackType: FauxTileAstroSnowDug
