- type: entity
  parent: Holoprojector
  id: RadiationBlockingProjector
  name: radiation barrier projector
  description: Stop the deadly radiation from a delamination or meltdown, at least for a little while.
  components:
  - type: HolosignProjector
    signProto: HolosignRadiationBlocking
    chargeUse: 60
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Devices/Holoprojectors/radiation.rsi
    state: icon
  - type: Tag
    tags:
      - HolofanProjector
  # Override Holoprojector recycle yield so hyper-lathe (0.5x) material cost stays non-arbitrage.
  - type: PhysicalComposition
    materialComposition:
      Steel: 75
      Plastic: 12
      Glass: 12

- type: entity
  parent: Holoprojector
  id: HoloprojectorCrate
  name: holocrate holoprojector
  description: A projector that creates a temporary hard light crate.
  components:
  - type: HolosignProjector
    signProto: CrateHolographic
    chargeUse: 300
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Devices/Holoprojectors/cargo.rsi
    state: icon
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Tag
    tags:
    - HolofanProjector

- type: entity
  parent: HoloprojectorCrate
  id: HoloprojectorCrateEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
