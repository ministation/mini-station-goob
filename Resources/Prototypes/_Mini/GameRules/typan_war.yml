    tradeZoneSwapScoreThreshold: 50
    minRespawnSeconds: 10
    maxRespawnSeconds: 120
    deathPenaltyStepSeconds: 110
    dropShuttleRespawnDelaySeconds: 120
    stationSeparationTiles: 300
    tradePostMaxDistanceTiles: 500
    warParallax: TypanWarParallax
    surfaceParallax: Water
    dropShuttlePath: /Maps/_Mini/Shuttles/typan_drop_shuttle.yml
    ntDropShuttlePath: /Maps/_Mini/Shuttles/nt_drop_shuttle.yml

- type: gamePreset
  id: TypanStationWar
  alias:
  - typanwar
  - typan-station-war
  name: game-presets-typan-station-war
  showInVote: true
  minPlayers: 20
  description: game-presets-typan-station-war-description
  rules:
  - TypanStationWar
  - SpaceTrafficControlFriendlyEventScheduler
  - BasicRoundstartVariation
