# Временные тестовые значения — вернуть продакшн-лимиты перед релизом.
- type: entity
  id: TypanStationWar
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 0
    chaosScore: 900
  - type: Tag
    tags:
    - LoneRunRule
  - type: TypanStationWarRule
    announcementDelaySeconds: 5
    warStartDelaySeconds: 10
    warDurationSeconds: 300
    warMusicDelaySeconds: 30
    warMusicDurationSeconds: 90
    warMusicTracks:
    - /Audio/_Mini/TypanWar/station_war.ogg
    - /Audio/_Mini/TypanWar/desolation.ogg
    warMusicTrackDurations:
    - 90
    - 90
    roundEndDelaySeconds: 30
    minNtAlive: 0
    minTypanAlive: 0
    maxFactionRatio: 0
    prepInsufficientCheckIntervalSeconds: 10
    warIntelEventDelaySeconds: 120
    captureZoneActivationDelaySeconds: 0
    capturePointsToWin: 30
    capturePointIntervalSeconds: 30
    minRespawnSeconds: 5
    maxRespawnSeconds: 15
    dropShuttleRespawnDelaySeconds: 60
    stationSeparationTiles: 300
    tradePostMaxDistanceTiles: 500
    warParallax: TypanWarParallax
    dropShuttlePath: /Maps/_Mini/Shuttles/typan_drop_shuttle.yml
    ntDropShuttlePath: /Maps/_Mini/Shuttles/nt_drop_shuttle.yml

- type: gamePreset
  id: TypanStationWar
  alias:
  - typanwar
  - typan-station-war
  name: game-presets-typan-station-war
  showInVote: true
  minPlayers: 0
  description: game-presets-typan-station-war-description
  rules:
  - TypanStationWar
  - SpaceTrafficControlFriendlyEventScheduler
  - BasicRoundstartVariation
