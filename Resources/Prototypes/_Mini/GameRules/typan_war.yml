    - 90
    roundEndDelaySeconds: 120
    minNtAlive: 5
    minTypanAlive: 5
    maxFactionRatio: 2
    prepInsufficientCheckIntervalSeconds: 30
    warIntelEventDelaySeconds: 900
    captureZoneActivationDelaySeconds: 0
