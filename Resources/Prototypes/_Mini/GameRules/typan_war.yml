- type: entity
  id: TypanStationWar
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 20
    chaosScore: 900
  - type: Tag
    tags:
    - LoneRunRule
  - type: TypanStationWarRule
    announcementDelaySeconds: 15
    warStartDelaySeconds: 300
    warDurationSeconds: 2700
    warMusicDelaySeconds: 90
    warMusicDurationSeconds: 90
    warMusicTracks:
    - /Audio/_Mini/TypanWar/station_war.ogg
    - /Audio/_Mini/TypanWar/desolation.ogg
    warMusicTrackDurations:
