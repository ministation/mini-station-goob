# Рыбалка: мирный режим без антагонистов. Каждый игрок получает удочку и приманку,
# на покрытии в технических туннелях появляется вода, а худ показывает трёх лидеров.
- type: entity
  id: FishingModeRule
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 1
    chaosScore: 0
  - type: FishingModeRule
    waterPools: 8
    rod: FishingRod
    baits:
    - BaitWorm
    - BaitWormPremium
    - BaitDoughball
    - BaitDoughballBlue
    - BaitDoughballSuper
    - FishingBaitSynthetic

- type: gamePreset
  id: FishingMode
  alias:
  - fishing
  - fishingmode
  - rybalka
  name: game-presets-fishing-mode
  showInVote: true
  minPlayers: 1
  description: game-presets-fishing-mode-description
  rules:
  - FishingModeRule
  - BasicStationEventSchedulerNoAntag
  - SpaceTrafficControlFriendlyEventScheduler
  - BasicRoundstartVariation
