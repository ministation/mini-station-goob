# Ножны для энергокатаны ниндзя. Порт из Dead Space 14 (только YAML-данные прототипа, без кода).

- type: entity
  parent: [ ClothingBeltBase, ClothingSlotBase ]
  id: ClothingBeltNinjaSheath
  components:
  - type: Sprite
    sprite: _Mini/Ninja/Clothing/Belt/sheath_ninja.rsi
    state: sheath
  - type: Clothing
    sprite: _Mini/Ninja/Clothing/Belt/sheath_ninja.rsi
  - type: ItemSlots
    slots:
      item:
        name: clothing-belt-ninja-sheath-slot
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          components:
          - EnergyKatana
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          components:
          - EnergyKatana
  - type: Appearance
  - type: ContainerFill
    containers:
      item:
      - EnergyKatana
  - type: NinjaAppearanceItem
  - type: Armor # Mini: полный комплект ниндзя даёт броню на всю экипировку, видно в examine
    coverage:
    - Groin
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
  - type: StaticPrice
    price: 500
