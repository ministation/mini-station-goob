- type: entity
  name: cyborg carbine
  parent: BaseWeaponBattery
  id: WeaponLaserCarbineBorg
  description: Pew-pew. It's all fun and games, of course. But can we stop killing the clown?
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BatteryAmmoProvider
    proto: RedLaser
    fireCost: 62.5
  - type: StaticPrice
    price: 300
  - type: BatterySelfRecharger
    autoRechargeRate: 10

- type: entity
  name: security cyborg stunner-laser
  parent: BaseWeaponBattery
  id: WeaponLaserStunnerBorg
  description: A cyborg security laser platform with switchable lethal and stun firing modes.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.ToggleableVisuals.Layer"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 62.5
  - type: AmmoSelector
    prototypes:
    - BulletDisabler
    - BulletEnergyGunLaser
  - type: UserInterface
    interfaces:
      enum.AmmoSelectorUiKey.Key:
        type: AmmoSelectorMenuBoundUserInterface
  - type: ActivatableUI
    altVerb: true
    verbOnly: true
    verbText: mode-select-verb-text
    key: enum.AmmoSelectorUiKey.Key
  - type: ItemToggle
    activated: true
    onActivate: false
    onUse: false
    wieldToggle: false
  - type: ItemToggleColor
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: enum.ToggleableVisuals.Layer
  - type: BatterySelfRecharger
    autoRechargeRate: 20

- type: entity
  name: cyborg MK58
  id: WeaponPistolMk58Borg
  parent: BaseItem
  description: A cyborg-adapted MK58 sidearm with an internal self-charging ammunition fabricator.
  components:
  - type: Gun
    fireRate: 5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BatteryAmmoProvider
    proto: BulletPistol
    fireCost: 100
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRechargeRate: 20
  - type: AmmoCounter

- type: entity
  id: WeaponDerozer
  parent: [BaseWeaponBatterySmall, BaseCentcommContraband]
  name: derozer
  description: "A versatile submachine gun with four firing modes. The craftsmanship is of the highest quality. It features depictions of the OSO and the Syndicate: the Syndicate lies dead, while an OSO member strikes a heroic pose."
  components:
  - type: Sprite
    sprite: _Mini/Objects/Weapons/Guns/Battery/derozer.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Mini/Objects/Weapons/Guns/Battery/derozer.rsi
  - type: Gun
    availableModes:
    - Burst
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisablerDerozer
    fireCost: 50
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisablerDerozer
      fireCost: 62.5
    - proto: BulletLetalDerozer
      fireCost: 125
    - proto: XrayHitscanDerozer
      fireCost: 125
    - proto: BulletTaserDerozer
      fireCost: 250
  - type: BatterySelfRecharger
    autoRechargeRate: 40
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: BioCode
    autoRecordDNA: true
    delay: 1
    itemBioCode: true
  - type: TimerTrigger
    delay: 1
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    deleteAfterExplosion: false
    explosionType: PowerSink
    maxIntensity: 8
    intensitySlope: 5
    totalIntensity: 5
    canCreateVacuum: false
    repeatable: true
  - type: Tag
    tags:
    - HighRiskItem
    - Sidearm
