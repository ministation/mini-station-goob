- type: entity
  name: lightsaber
  parent: EnergySword
  abstract: true
  id: BaseLightsaber
  description: A special weapon designed for elegant combat as well as for ceremonies, its work is connected with the kyber-crystal inside.
  components:
  - type: EmitSoundOnThrow
    sound:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
  - type: EnergySword
    colorOptions:
      - DodgerBlue
      - Aqua
      - MediumSpringGreen
      - MediumOrchid
  - type: Reflect
    reflectProb: 0.50
    spread: 90
    reflects:
      - Energy
  - type: Damageable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 20
        mask:
        - ItemMask
        layer:
        - FlyingMobLayer
        restitution: 0.3
        friction: 0.2
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 0
  - type: DamageContacts
    damage:
      types:
        Structural: 0
