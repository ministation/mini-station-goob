- type: entity
  name: blue lightsaber
  parent: BaseLightsaber
  id: LightsaberBlue
  suffix: Blue
  components:
  - type: EnergySword
    colorOptions:
    - DodgerBlue

- type: entity
  name: lightsaber with side blades
  parent: BaseLightsaber
  id: LightsaberCrossguard
  suffix: Random color
  components:
  - type: Item
    size: Small
    sprite: _Mini/Objects/Weapons/Melee/e_sword_kylo_inhand.rsi
  - type: Sprite
    sprite: _Mini/Objects/Weapons/Melee/e_sword_kylo.rsi
    layers:
      - state: e_sword
      - state: e_sword_blade
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]

- type: entity
  name: double-bladed lightsaber
  parent: BaseLightsaber
  id: LightsaberDouble
  suffix: Random color
  description: A lightsaber variant, that feature is blades, emitted from both sides of the hilt.
  components:
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/ebladehum.ogg
      params:
        volume: 3
  - type: Item
    size: Small
    sprite: _Mini/Objects/Weapons/Melee/e_sword_double-inhands.rsi
  - type: Sprite
    sprite: Objects/Weapons/Melee/e_sword_double.rsi
    layers:
      - state: e_sword_double
      - state: e_sword_double_blade
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]

