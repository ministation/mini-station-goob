- type: entity
  parent: DeathRattleImplant
  id: DeathRattleImplantDSO
  name: DSO death rattle implant
  description: This implant will inform the DSO radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: DSO

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantDSO
  name: radio implant DSO
  description: This implant grants access to the DSO channel without a headset.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - DSO

- type: entity
  parent: BaseSubdermalImplant
  id: AdrenocorImplant
  name: adrenocor implant
  description: Injects a solution of combat stimulants and medical drugs into the body.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateAdrenocorImplant
  - type: TriggerOnActivateImplant
  - type: AddSolutionOnTrigger
    addedSolution:
      maxVol: 30
      reagents:
      - ReagentId: Desoxyephedrine
        Quantity: 15
      - ReagentId: Omnizine
        Quantity: 15
    solution: bloodstream
    targetUser: true
