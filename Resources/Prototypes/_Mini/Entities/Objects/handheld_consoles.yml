- type: entity
  parent: BaseItem
  id: HandheldStationsControlConsole
  categories: [ DoNotMap ]
  name: asset control tablet
  description: Allows for the control of any corporate asset.
  suffix: DON'T MAP
  components:
  - type: Sprite
    sprite: _Mini/Objects/Devices/handheld_stations_control_console.rsi
    state: icon
  - type: Item
    size: Normal
  - type: UserInterface
    interfaces:
      enum.StationsControlConsoleUiKey.Key:
        type: StationsControlConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.StationsControlConsoleUiKey.Key
  - type: StationsControlConsole
    allowedAlertLevels:
    - green
    - blue
    - violet
    - yellow
    - red
    - gamma
    - delta
