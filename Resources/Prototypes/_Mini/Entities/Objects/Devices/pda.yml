- type: entity
  parent: BaseSecurityPDA
  id: ChiefCentcomPDA
  name: PDA of the head of the centcom
  description: Light green sign of walking bureaucracy.
  suffix: CCCC
  components:
  - type: Pda
    id: ChiefCentcomIDCard
    penSlot:
      startingItem: PenCentcom
      priority: -1
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-chief-centcom
  - type: Sprite
    sprite: _Mini/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _Mini/Objects/Devices/pda.rsi
    state: pda-chief-centcom
  - type: PdaBorderColor
    borderColor: "#00842e"
    accentHColor: "#20b2aa"
    accentVColor: "#20b2aa"
  - type: EntityTableContainerFill
    containers:
      program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: LogProbeCartridge
        - id: WantedListCartridge
        - id: MedTekCartridge
        - id: AstroNavCartridge

