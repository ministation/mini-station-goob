# ERT shoulder holster — same capacity as syndie holster (large guns), NT sprites.

- type: entity
  parent: [ClothingBeltStorageBase, BaseCentcommContraband]
  id: ClothingBeltHolsterERT
  name: плечевая кобура ОБР
  description: Углублённая плечевая кобура отряда ОБР. Вмещает крупное огнестрельное оружие и боеприпасы.
  components:
  - type: Sprite
    sprite: Clothing/Belt/holster.rsi
  - type: Clothing
    sprite: Clothing/Belt/holster.rsi
    slots:
    - belt
    - neck
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,3
    whitelist:
      components:
      - Gun
      - BallisticAmmoProvider
      - CartridgeAmmo
      tags:
      - EnergySpeedloader
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
      storagebase: !type:Container
        ents: []
  - type: ItemSlots
    slots:
      item:
        name: Gun
        whitelist:
          components:
          - Gun
  - type: StaticPrice
    price: 500
