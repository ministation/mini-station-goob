- type: entity
  parent: [ClothingHeadsetAlt, BaseSyndicateContraband]
  id: ClothingHeadsetAltTypan
  name: typan over-ear headset
  description: An updated, modular Typan intercom that fits over the head and takes encryption keys (there are 5 key slots.).
  components:
  - type: EncryptionKeyHolder
    keySlots: 5
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyTypan
  - type: Sprite
    sprite: _Mini/Clothing/Ears/Headsets/hs_typan.rsi
  - type: Clothing
    sprite: _Mini/Clothing/Ears/Headsets/hs_typan.rsi
  - type: Headset
    color: "#c45eb8"

- type: entity
  parent: ClothingHeadsetAlt
  id: ClothingHeadsetGuardianNtAlt
  name: blade guardian's over-ear headset
  description: Finally, there is a command frequency here.
  components:
    - type: Tag
      tags:
        - ForceRecallEquipment
        - WhitelistChameleon
    - type: ContainerFill
      containers:
        key_slots:
          - EncryptionKeyCommon
          - EncryptionKeySecurity
          - EncryptionKeyCommand
    - type: Sprite
      sprite: _Mini/Clothing/Ears/Headsets/guardian_nt.rsi
    - type: Clothing
      sprite: _Mini/Clothing/Ears/Headsets/guardian_nt.rsi
