# Blue ERT "field" hardsuits — olive-graphite RSI recolors of stock ERT suits.
# Helmets keep stock visuals (glass unchanged). Armor weaker than stock ERT.

- type: entity
  parent: ClothingOuterHardsuitERTLeader
  id: ClothingOuterHardsuitERTLeaderBlue
  name: скафандр командира ОБР (полевой)
  description: Облегчённый полевой скафандр командира синего отряда ОБР. Защита слабее стандартного комплекта.
  suffix: Blue Field
  components:
  - type: Sprite
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader_field.rsi
  - type: Clothing
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader_field.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitERTLeaderBlue
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.65
        Heat: 0.7
        Radiation: 0.75
        Caustic: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: StaminaResistance
    damageCoefficient: 0.7

