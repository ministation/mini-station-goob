# OP (Blue) field hardsuits — olive-graphite RSI recolors of stock ERT suits.
# Helmets keep stock visuals (glass unchanged). Slightly below stock ERT armor;
# commander suit is a step above officer/medic.

- type: entity
  parent: ClothingOuterHardsuitERTLeader
  id: ClothingOuterHardsuitERTLeaderBlue
  name: скафандр командира ОП
  description: Полевой скафандр командира отряда поддержки. Усиленная защита по сравнению с остальным комплектом ОП.
  suffix: Blue Field
  components:
  - type: Sprite
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader_field.rsi
  - type: Clothing
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader_field.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitERTLeaderBlue
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.55
        Heat: 0.6
        Radiation: 0.65
        Caustic: 0.65
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: StaminaResistance
    damageCoefficient: 0.6

