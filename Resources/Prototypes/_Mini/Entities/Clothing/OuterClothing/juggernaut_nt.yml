- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitERTJuggernaut
  name: NanoTrasen juggernaut hardsuit
  description: A heavy, heavily armored hardsuit built for frontline combat and strategic operations. Manufactured by NanoTrasen for Central Command elite forces.
  components:
  - type: Sprite
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/jaggernaut_suit.rsi
  - type: Clothing
    sprite: _Mini/Clothing/OuterClothing/Hardsuits/jaggernaut_suit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: StaminaResistance # Goobstation uncommented
    damageCoefficient: 0.8
  - type: DNALocker
  - type: Armor
    traumaDeductions: # prevents traumas at all (kinda)
      Dismemberment: 1
      OrganDamage: 1
      BoneDamage: 1
      VeinsDamage: 1
      NerveDamage: 1
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitERTJuggernaut
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 1
    knockdownTimeDelta: -1
  - type: Tag
    tags:
    - MonkeyWearable
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon
  - type: StaticPrice
    price: 0

