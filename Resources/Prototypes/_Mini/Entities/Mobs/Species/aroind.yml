    thresholds:
      0: Alive
      100: Alive
      200: Dead


- type: entity
  save: false
  parent: BaseSpeciesDummy
  id: MobAroindDummy
  categories: [ HideSpawnMenu ]
  description: A dummy aroind meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: Aroind
  - type: Icon
    sprite: _Mini/Mobs/Species/Aroind/parts.rsi
    state: full

- type: entity
  save: false
  parent: BaseMobAroind
  id: MobAroind
  components:
    - type: CombatMode
    - type: InteractionPopup
      successChance: 1
      interactSuccessString: hugging-success-generic
      interactSuccessSound: /Audio/Effects/thudswoosh.ogg
      messagePerceivedByOthers: hugging-success-generic-others
    - type: MindContainer
    - type: MindExaminable
    - type: Input
      context: "human"
    - type: MobMover
    - type: InputMover
    - type: Alerts
    - type: Eye
    - type: CameraRecoil
    - type: Examiner
    - type: CanHostGuardian
    - type: NpcFactionMember
      factions:
        - NanoTrasen
    - type: Respirator
      damage:
       types:
        Asphyxiation: 1.0
      damageRecovery:
        types:
          Asphyxiation: -1.0
