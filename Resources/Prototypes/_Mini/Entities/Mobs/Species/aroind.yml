- type: entity
  save: false
  parent: BaseMobSpeciesOrganic
  id: BaseMobAroind
  name: Urist McAroind
  abstract: true
  components:
  - type: Hunger
  - type: Icon
    sprite: _Mini/Mobs/Species/Aroind/parts.rsi
    state: full
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    understands:
    - TauCetiBasic
    - SolCommon
  - type: HumanoidAppearance
    species: Aroind
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Body
    prototype: Human
    requiredLegs: 2
  - type: Inventory
    speciesId: Aroind
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.Groin" ]
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
