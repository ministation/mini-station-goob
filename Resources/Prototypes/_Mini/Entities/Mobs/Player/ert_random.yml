# randomHumanoidSettings CBURNAgent is defined in Prototypes/Entities/Mobs/Player/humanoid.yml

- type: randomHumanoidSettings
  id: CBURNAgent
  parent: CentcommHumanoid
  components:
    - type: AutoImplant
      implants: [ FreedomImplant, RadioImplantCentcomm, NutrimentPumpImplant, StypticStimulatorImplant ]
    - type: Loadout
      prototypes: [ CBURNAgentGear ]
      roleLoadout: [ RoleSurvivalEVA ]
    - type: GhostRole
      name: ghost-role-information-cburn-agent-name
      description: ghost-role-information-cburn-agent-description
      rules: ghost-role-information-nonantagonist-rules
      skills: # CorvaxGoob-Skills
      - All
      raffle:
        settings: short
      job: CBURNAgent
    - type: RandomMetadata
      nameSegments:
      - NamesMilitaryLast
      nameFormat: name-format-ert-officer
