- type: borgType
  id: typan-security
  showInGlobalSelection: false
  dummyPrototype: BorgChassisTypanSecurity
  extraModuleCount: 6
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity
    - BorgModuleSyndicate
    - BorgModuleSyndicateAssault
  defaultModules:
  - BorgModuleTool
  - BorgModuleSecurityStandard
  - BorgModuleSyndicateWeapon
  radioChannels:
  - Typan
  inventoryTemplateId: borgTall
  # Mini: spriteBodyMovementState убран — sec_moving в RSI нарисован другим дизайном,
  # при повороте/движении визуал борга «менялся». Борг всегда в статичном sec.
  spriteBodyState: sec
  spriteHasMindState: sec_e
  spriteNoMindState: sec_e_r
  spriteToggleLightState: sec_l
  petSuccessString: petting-success-syndicate-cyborg
  petFailureString: petting-failure-syndicate-cyborg
  footstepCollection:
    collection: FootstepBorg
