- type: entity
  parent: CryogenicSleepUnit
  id: BaseERTCryostorage
  name: ERT cryostorage
  components:
  - type: UserInterface
    interfaces:
      enum.ERTCryostorageUiKey.Key:
        type: ERTCryostorageBoundUserInterface
  - type: ActivatableUI
    key: enum.ERTCryostorageUiKey.Key
  - type: ERTCryostorage
    titleName: ert-cryostorage-ert-title
    containerId: storage
    options:
    - name: ert-cryostorage-ert-security
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: ERTSecurity }
      settings: ERTSecurityEmpty
    - name: ert-cryostorage-ert-medical
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: ERTMedical }
      settings: ERTMedicalEmpty
    - name: ert-cryostorage-ert-chaplain
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: ERTChaplain }
      settings: ERTChaplainEmpty
    - name: ert-cryostorage-ert-engineer
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: ERTEngineer }
      settings: ERTEngineerEmpty
    - name: ert-cryostorage-ert-janitor
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: ERTJanitor }
      settings: ERTJanitorEmpty
  - type: Cryostorage
    noMindGracePeriod: 300
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["DSO"]]

- type: entity
  parent: BaseERTCryostorage
  id: ERTCBURNCryostorage
  name: CBURN cryostorage
  components:
  - type: ERTCryostorage
    titleName: ert-cryostorage-cburn-title
    containerId: storage
    options:
    - name: ert-cryostorage-cburn-agent
      sprite: { sprite: Interface/Misc/job_icons.rsi, state: CBURN }
      settings: CBURNAgentEmpty

- type: entity
  parent: BaseERTCryostorage
  id: ERTLeaderCryostorage
  name: ERT leader cryostorage
  components:
  - type: ERTCryostorage
    titleName: ert-cryostorage-officer-title
    containerId: storage
    useOnce: false
    options:
    - name: ert-cryostorage-ert-leader
      sprite: { sprite: _Mini/Interface/Misc/job_icons.rsi, state: ERTLeader }
      settings: ERTLeaderEmpty
      requiresAdminAllow: true

- type: entity
  parent: BaseERTCryostorage
  id: ERTCBURNCommanderCryostorage
  name: CBURN commander cryostorage
  components:
  - type: ERTCryostorage
    titleName: ert-cryostorage-officer-title
    containerId: storage
    useOnce: false
    options:
    - name: ert-cryostorage-cburn-commander
      sprite: { sprite: _Mini/Interface/Misc/job_icons.rsi, state: ERTLeader }
      settings: CBURNCommanderEmpty
      requiresAdminAllow: true
