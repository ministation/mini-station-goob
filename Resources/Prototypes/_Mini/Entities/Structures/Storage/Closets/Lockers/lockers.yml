  suffix: Тайпан
  components:
  - type: Sprite
    noRot: true
    sprite: _Mini/Structures/Storage/suit_storage.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: open
