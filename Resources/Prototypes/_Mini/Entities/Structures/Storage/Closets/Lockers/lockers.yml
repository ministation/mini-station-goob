- type: entity
  id: SuitStorageTypanBase
  parent: SuitStorageBase
  name: хранилище скафандра
  description: Необычное высокотехнологичное хранилище Синдиката, предназначенное для хранения космических скафандров.
  suffix: Тайпан
  components:
  - type: Sprite
    noRot: true
    sprite: _Mini/Structures/Storage/suit_storage.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: open
      shader: unshaded
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: EntityStorage
    closeSound:
      path: /Audio/Machines/blastdoor.ogg
      params:
        volume: -7
    openSound:
      path: /Audio/Machines/blastdoor.ogg
      params:
        volume: -7
  #  - type: Lock
  #    lockingSound:
  #      path: /Audio/Machines/quickbeep.ogg
  #      params:
  #        volume: -3
  #    unlockingSound:
  #      path: /Audio/Machines/quickbeep.ogg
  #      params:
  #        volume: -3

