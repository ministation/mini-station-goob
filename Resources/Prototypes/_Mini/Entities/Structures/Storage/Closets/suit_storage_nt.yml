# NT-branded suit storage (state nt instead of base) for high-ranking NanoTrasen roles.

- type: entity
  id: SuitStorageNT
  parent: SuitStorageBase
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Storage/suit_storage.rsi
    layers:
    - state: nt
    - state: door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: EntityStorageVisuals
    stateBaseClosed: nt
    stateDoorOpen: nt
    stateDoorClosed: door

# ERT suit storages
- type: entity
  id: SuitStorageERTLeader
  parent: SuitStorageNT
  suffix: ERT Leader
  components:
  - type: StorageFill
    contents:
    - id: OxygenTankFilled
    - id: NitrogenTankFilled
    - id: ClothingOuterHardsuitERTLeader
    - id: ClothingMaskGasERT
    - id: ClothingShoesBootsMagEmergencyResponseTeam
  - type: AccessReader
    access: [["CentralCommand"]]

