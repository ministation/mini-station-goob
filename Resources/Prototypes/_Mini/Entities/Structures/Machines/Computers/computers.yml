- type: entity
  parent: BaseComputer
  id: MiniSyndieComputerId
  name: Консоль ID карт
  description: Консоль для кодирования пропускных карт агентов Синдиката.
  components:
  - type: IdCardConsole
    privilegedIdSlot:
      name: id-card-console-privileged-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    targetIdSlot:
      name: id-card-console-target-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    accessLevels: [
      "TypanArmory",
      "TypanAtmospherics",
      "TypanCargo",
      "TypanCommand",
      "TypanCommunicationsOfficer",
      "TypanEngineering",
      "TypanMaint",
      "TypanMedical",
      "TypanProtection",
      "TypanResearchDirector",
      "TypanScience",
      "TypanService",
      "TypanVault",
      "TypanExternal",
      "SyndicateAgent",
      "NuclearOperative",]

  - type: ActivatableUI
    key: enum.IdCardConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IdCardConsoleUiKey.Key:
        type: IdCardConsoleBoundUserInterface
  - type: CrewManifestViewer
    ownerKey: enum.IdCardConsoleUiKey.Key
  - type: Sprite
    sprite: _Mini/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_uplink
    - map: ["computerLayerScreen"]
      state: comm_syndie
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: IDComputerCircuitboardTypan
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#D3D3D3"
  - type: Tag
    tags:
    - EmagImmune
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      IdCardConsole-privilegedId: !type:ContainerSlot
      IdCardConsole-targetId: !type:ContainerSlot

