- type: entity
  id: MachineMaterialSiloTypan
  parent: MaterialSilo
  name: хранилище материалов
  description: Продвинутая машина, способная использовать редспейс технологию для передачи материалов ближайшим машинам.
  suffix: Тайпан
  components:
  - type: Sprite
    sprite: _Mini/Structures/Machines/Typan/silo.rsi
  - type: OreSilo
  - type: ActivatableUI
    key: enum.OreSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreSiloUiKey.Key:
        type: OreSiloBoundUserInterface
  - type: MaterialStorage
    ignoreColor: true
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Machine
    board: MaterialSiloMachineCircuitboardTypan
