# Typan random food/drink vending machine spawners.

- type: entity
  id: RandomVendingDrinksTypan
  name: random vending machine spawner
  suffix: Тайпан, Напитки
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Machines/VendingMachines/random.rsi
      state: drink
  - type: RandomSpawner
    prototypes:
    - VendingMachineCoffeeTypan
    - VendingMachineColaTypan
    - VendingMachineColaBlackTypan
    - VendingMachineColaRedTypan
    - VendingMachineDrGibbTypan
    - VendingMachinePwrGameTypan
    - VendingMachineShamblersJuiceTypan
    - VendingMachineSmiteTypan
    - VendingMachineSodaTypan
    - VendingMachineSovietSodaTypan
    - VendingMachineSpaceUpTypan
    - VendingMachineStarkistTypan
    chance: 1

