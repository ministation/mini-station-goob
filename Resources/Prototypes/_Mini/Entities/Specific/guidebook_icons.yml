# Mini - иконки-эмбеды для гайдбука (приёмы боевых искусств, интенты и т.п.).
# Раньше они жили в _Goobstation/Changeling, выпиленном на мини-стации, из-за чего
# все GuideEntityEmbed в гайдбуке падали в Parser Error (SpawnEntity не находил прототип).

- type: entity
  id: GuidebookHelp
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Interface/Misc/intents.rsi
    state: help

- type: entity
  id: GuidebookHarm
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Interface/Misc/intents.rsi
    state: harm

- type: entity
  id: GuidebookDisarm
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Interface/Misc/intents.rsi
    state: disarm

- type: entity
  id: GuidebookGrab
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Interface/Misc/intents.rsi
    state: grab

- type: entity
  id: GuidebookDragonPower
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_Goobstation/Interface/Alerts/dragonpower.rsi
    state: icon

- type: entity
  id: GuidebookLossOfSurprise
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Structures/Storage/closet.rsi
    state: cardboard_special

- type: entity
  id: GuidebookChangelingFluff
  name: guidebook changeling
  description: you shouldn't be seeing this normally.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Changeling/Guidebook/guidebook_changeling.rsi
    state: icon
