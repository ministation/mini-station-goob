- type: entity
  name: DNA disk box
  parent: BoxCardboard
  id: BoxDnaFisk
  description: A box of DNA-modifier disk.
  components:
  - type: StorageFill
    contents:
      - id: DnaModifierDisk
        amount: 3
  - type: Sprite
    layers:
      - state: box_science
      - state: disk

# Lazy dispenser like BoxMouthSwab — use-in-hand cycles out injectors
- type: entity
  parent: BaseAmmoProvider
  id: BoxDnaInjector
  name: DNA injector dispenser
  description: Dispenses blank DNA injectors for the DNA modifier console.
  components:
  - type: Sprite
    layers:
    - state: box_science
    - state: syringe
  - type: BallisticAmmoProvider
    whitelist:
      components:
      - DnaModifierInjector
    proto: DnaInjector
    capacity: 10
  - type: GuideHelp
    guides:
    - Genetics
