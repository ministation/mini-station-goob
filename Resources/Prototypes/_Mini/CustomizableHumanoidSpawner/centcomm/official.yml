  suffix: ПЦК, Кастомизируемый персонаж
  components:
    - type: Sprite
      layers:
      - sprite: Markers/jobs.rsi
        state: centcom
    - type: RandomMetadata
      nameSegments:
      - NamesFirstERTOfficial
      - NamesFirstOfficial
      nameFormat: name-format-ert
    - type: RandomHumanoidSpawner
      settings: CentralCommandOfficial

- type: randomHumanoidSettings
