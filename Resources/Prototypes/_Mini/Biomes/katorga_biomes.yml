# Биом астероида вокруг каторги. По мотивам gulag_biomes.yml сервера Amour
# (frosty-dev/ss14-amour), адаптирован под прототипы Mini Station.
- type: biomeTemplate
  id: KatorgaBiome
  layers:
    - !type:BiomeEntityLayer
      threshold: 0.85
      noise:
        seed: 2
        noiseType: OpenSimplex2
        fractalType: PingPong
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - CrystalGreen
        - CrystalPink
        - CrystalOrange
        - CrystalBlue
        - CrystalCyan
    - !type:BiomeEntityLayer
      threshold: -0.5
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - KatorgaWallRock
    - !type:BiomeDummyLayer
      id: Loot
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: FloorAsteroidSand
      variants:
        - 0
    - !type:BiomeTileLayer
      threshold: 0.5
      noise:
        seed: 1
        noiseType: OpenSimplex2
        frequency: 2
      tile: FloorAsteroidSand

- type: entity
  id: KatorgaWallRock
  parent: WallRock
  name: rock
  suffix: planetmap
  components:
    - type: OreVein
      oreChance: 0.25
      oreRarityPrototypeId: RandomKatorgaOreDistributionStandard

# Камни, расставленные на станционном гриде каторги: руда прямо у выхода на двор.
- type: entity
  id: KatorgaMineRock
  parent: KatorgaWallRock
  components:
    - type: OreVein
      oreChance: 0.5
      oreRarityPrototypeId: RandomKatorgaOreDistributionStandard

- type: weightedRandomOre
  id: RandomKatorgaOreDistributionStandard
  weights:
    OreSteel: 10
    OreCoal: 10
    OreSpaceQuartz: 8
    OreGold: 2
    OrePlasma: 4
    OreSilver: 1
    OreUranium: 1
    OreBananium: 0.5

# Фауна каторги: мобы живут на астероиде вокруг лагерей. Убийство моба
# сокращает срок заключённому на rewardMinutes минут (KatorgaFaunaSystem).
- type: katorgaFaunaSpawner
  id: KatorgaFauna
  initialCount: 14
  initialBatchSize: 4
  softCap: 80
  hardCap: 110
  spawnInterval: 75
  spawnBatchMin: 2
  spawnBatchMax: 4
  minPlayerDistance: 18
  minBaseDistance: 20
  maxBaseDistance: 100
  spawns:
  - prototype: MobWatcherLavaland
    weight: 30
    maxCount: 30
    rewardMinutes: 1
  - prototype: MobWatcherMagmawing
    weight: 12
    maxCount: 20
    rewardMinutes: 2
  - prototype: MobBasilisk
    weight: 18
    maxCount: 20
    rewardMinutes: 2
  - prototype: MobHivelord
    weight: 15
    maxCount: 15
    rewardMinutes: 2
  - prototype: MobLavalandGoliath
    weight: 12
    maxCount: 12
    rewardMinutes: 3
  - prototype: MobLegion
    weight: 4
    maxCount: 6
    rewardMinutes: 5
