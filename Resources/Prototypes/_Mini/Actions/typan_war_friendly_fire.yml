- type: entity
  parent: BaseAction
  id: ActionTypanWarFriendlyFire
  name: Ally protection
  description: Do not harm allies with ranged weapons.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -10
    useDelay: 0.5
    icon:
      sprite: ADT/Interface/Actions/friendly_fire.rsi
      state: off
    iconOn:
      sprite: ADT/Interface/Actions/friendly_fire.rsi
      state: on
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseAction
  id: ActionTypanWarMinimap
  name: typan-war-minimap-action-name
  description: typan-war-minimap-action-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -9
    useDelay: 0.25
    icon:
      sprite: _Mini/Interface/Actions/map.rsi
      state: map
  - type: InstantAction
    event: !type:TypanWarMinimapActionEvent
