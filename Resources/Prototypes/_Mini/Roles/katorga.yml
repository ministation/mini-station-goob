# Снаряжение заключённого каторги: комплект утилизатора и набор выживания,
# чтобы на каторгу не попадали голыми и без медикаментов.
- type: startingGear
  id: KatorgaInmateGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
    outerClothing: ClothingOuterHardsuitSalvage
    shoes: ClothingShoesBootsSalvage
    belt: OreBag
    back: ClothingBackpackDuffelSalvage
    suitstorage: OxygenTankFilled
    pocket1: KatorgaMineralScanner
  inhand:
    - KatorgaProtoKineticAccelerator
    - Pickaxe
  storage:
    back:
    - BoxSurvival
    - FlashlightLantern
    - FoodSnackNutribrick
    - DrinkWaterBottleFull
    - Brutepack
    - Ointment
    - Gauze
    # Снасти: рыба на каторге и еда, и способ сократить срок.
    - FishingRod
    - BaitCanWorm

# Фракционное снаряжение каторжников: выдаётся поверх базового комплекта.
# Астероид за периметром в вакууме, поэтому скафандр остаётся у всех,
# фракции различаются полезным снаряжением.
- type: startingGear
  id: KatorgaMinersGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorOrange
    neck: ClothingNeckScarfStripedBrown
    eyes: ClothingEyesGlassesMeson
  storage:
    back:
    - HandheldGPSBasic

- type: startingGear
  id: KatorgaFreemenGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorMaroon
    neck: ClothingNeckScarfStripedBlack
  storage:
    back:
    - SurvivalKnife
    - FlashlightLantern

# Должность заключённого: единственная роль в late join у временно забаненных.
# Слоты без лимита выдаются сервером на каждой станции (KatorgaSystem.OnStationInitialized).
- type: playTimeTracker
  id: JobPrisoner

- type: job
  id: Prisoner
  name: job-name-prisoner
  playTimeTracker: JobPrisoner
  icon: "JobIconPrisoner"
  setPreference: false
  canBeAntag: false

# Должности фракций: заключённому меняют прежнюю работу на фракционную,
# чтобы в манифесте станции и телепорте призраков не висела старая должность.
- type: playTimeTracker
  id: JobKatorgaMiner

- type: job
  id: KatorgaMiner
  name: job-name-katorga-miner
  playTimeTracker: JobKatorgaMiner
  icon: JobIconKatorgaMiners
  setPreference: false
  canBeAntag: false

- type: playTimeTracker
  id: JobKatorgaFreeman

- type: job
  id: KatorgaFreeman
  name: job-name-katorga-freemen
  playTimeTracker: JobKatorgaFreeman
  icon: JobIconKatorgaFreemen
  setPreference: false
  canBeAntag: false
