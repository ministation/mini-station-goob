# Хэллоуинское наигранное время: тикает только когда игрок жив и участвует в раунде
# (лобби, призраки и AFK не считаются). См. HalloweenPlaytimeSystem.
# Выключено до праздника через cvar mini.halloween.enabled (по умолчанию false),
# прототип лежит на будущее.
- type: playTimeTracker
  id: Halloween
