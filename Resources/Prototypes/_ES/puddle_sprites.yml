# Mini: все сеты ведут на классический спрайт луж Fluids/puddle.rsi (splata/splatb/splat0),
# как до реворка рендера. Система спрайт-сетов, перекраска по цвету раствора и объёмные
# тиры (small/medium/large) работают как раньше — изменён только арт.
# splat1-15 не используем: это уголковые варианты для сглаживания соседних плиток,
# которого в новом рендере нет.
# Common
- type: esPuddleSpriteSet
  id: Default # Generic sprite set. Opaque and dull; useful for medicines or other viscous things
  baseColor: "#FFFFFF"
  smallSprites:
  - sprite: Fluids/puddle.rsi
    state: splata
  mediumSprites:
  - sprite: Fluids/puddle.rsi
    state: splatb
  largeSprites:
  - sprite: Fluids/puddle.rsi
    state: splat0

- type: esPuddleSpriteSet
  id: Blood # Messy and natural, small puddles are droplets.
