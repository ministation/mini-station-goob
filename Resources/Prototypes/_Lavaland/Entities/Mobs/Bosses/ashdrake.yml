# Ash drake, port of TG's megafauna: fire breath cone, lava pools, swoop slams,
# and a phase two firestorm of counter-rotating flame spirals.
- type: entity
  name: ash drake
  id: LavalandBossAshDrake
  parent: LavalandMobBase
  description: Guardian of the Necropolis.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: MegafaunaStage
    maxStage: 2 # phase 2 at half health, see MobPhases below
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: dragon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 50
        Heat: 15
      armorPenetration: 0.35 # TG's drake has 40% melee armor piercing, 35% here
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4
  - type: MobThresholds
    thresholds:
      0: Alive
      3000: Dead
  # TG butcher results. TG also yields 5 sinew; the repo has no sinew material,
  # so those 5 are folded into the bone stack.
  - type: Butcherable
    spawned:
    - id: LavalandAshDrakeHide1
      amount: 10
    - id: MaterialDiamond1
      amount: 5
    - id: MaterialBones1
      amount: 35
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: BossMusic
    soundId: AshDrake
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  # Megafauna AI wiring, same driver as Hierophant. Normal movement keeps the
  # drake smooth when a player takes control of it (no TileMovement).
  - type: MobMover
  - type: LagCompensation
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionDrakeFireCone
    - ActionDrakeLavaPools
    - ActionDrakeSlam
    - ActionDrakeMeteors
    - ActionDrakeMassFire
    - ActionDrakeEruption
    - ActionDrakeFirestorm
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: RequireProjectileTarget
    active: False
  - type: GPS
    gpsName: Fiery Signal
    enabled: true
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.7
    selector: !type:NestedMegafaunaSelector
      id: AshDrake
  - type: Anger
    totalHp: 3000
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MobPhases
    phaseThresholds:
      0: 1
      1500: 2 # below half health the drake enrages and unlocks the firestorm
  - type: BossEnrage
    healthFraction: 0.5
    speedMultiplier: 1.25
    attackRateMultiplier: 1.15
    actionDelay: 0.55
    sound:
      path: /Audio/Effects/demon_attack1.ogg
  - type: MegafaunaBlink
    spawnOnTarget: LavalandDrakeSlamBurst
    spawnOnUsed: LavalandDrakeSlamBurst
  # Every swoop dash leaves burning ground along the path it crossed.
  - type: MegafaunaFireTrail
    trail: LavalandDrakeFireTrail
    step: 1
  - type: MegafaunaRejuvenate
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandCrateDragon
    specialTable: !type:AllSelector
      children:
      - id: LavalandDrakeTailSpike
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    # TG keeps the corpse so the butcher results (hide, diamonds, bones) are reachable.
