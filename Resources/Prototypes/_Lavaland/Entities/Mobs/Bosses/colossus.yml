# Colossus, port of TG's megafauna: armor-piercing death bolts in spirals, rings and spreads.
- type: entity
  name: Colossus
  id: LavalandBossColossus
  parent: LavalandMobBase
  description: A monstrous creature protected by heavy shielding.
  components:
  - type: MegafaunaDevour
  - type: ExplosionResistance
    worn: false
    damageCoefficient: 0.1
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-2,1,1"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: MegafaunaStage
    maxStage: 1 # no stage counter on the HUD, MobPhases still gates the AI attacks
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: eva
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Blunt: 40
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2750: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  # Regenerating armor pool, the grey segment on the boss HUD. Breaks for good once depleted.
  - type: MegafaunaArmor
    maxArmor: 600
    regenDelay: 8
    regenRate: 40
  - type: Advertise
    pack: ColossusWords
    minimumWait: 15
    maximumWait: 40
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Lavaland/Effects/meteorimpact.ogg
      params:
        volume: 5
  - type: BossMusic
    soundId: Colossus
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  # Megafauna AI wiring, same driver as Hierophant
  - type: MobMover
  - type: LagCompensation
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionColossusBoltsSpread
    - ActionColossusBoltsRing
    - ActionColossusBoltsSpiral
    - ActionColossusCounterSpiral
    - ActionColossusFinale
    - ActionColossusBoltRain
    - ActionColossusBoulderToss
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: RequireProjectileTarget
    active: False
  - type: GPS
    gpsName: Angelic Signal
    enabled: true
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.8
    selector: !type:NestedMegafaunaSelector
      id: Colossus
  - type: Anger
    totalHp: 2750
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MobPhases
    phaseThresholds:
      0:    1
      1815: 2 # below 33% HP: double counter-spiral
      2475: 3 # below 10% HP: final judgement
  - type: BossEnrage
    healthFraction: 0.33
    speedMultiplier: 1.25
    attackRateMultiplier: 1.2
    actionDelay: 0.6
    sound:
      path: /Audio/Effects/demon_attack1.ogg
  - type: MegafaunaAnchor
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandCrateColossus
    specialTable: !type:AllSelector
      children:
      - id: LavalandBlasterTubes
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    deleteOnDeath: true
