# Port of TG's Legion megafauna: the boss splits into smaller legions on death.
# The big one uses the data-driven megafauna AI, smaller tiers are plain HTN minions.

- type: entity
  name: Legion
  id: LavalandBossMegaLegion
  parent: LavalandMobBase
  description: One of many. For now.
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Lavaland/Mobs/legion_spawn.ogg
      params:
          volume: 5
          maxDistance: 30
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/96x96.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mega_legion
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
        types:
          Blunt: 35
          Structural: 200
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 25 # times more dangerous than a crew-member
  # Megafauna AI wiring, same driver as Hierophant
  - type: InputMover
  - type: Input
    context: "human"
  - type: MobMover
  - type: LagCompensation
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionLegionSkulls
    - ActionLegionCharge
    - ActionLegionSentinel
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: RequireProjectileTarget
    active: False
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.8
    selector: !type:NestedMegafaunaSelector
      id: Legion
  - type: Anger
    totalHp: 700
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MegafaunaBlink
    spawnOnTarget: LavalandLegionChargeBurst
    spawnOnUsed: LavalandLegionChargeBurst
  - type: MegafaunaRejuvenate
  # Death split chain: boss -> medium left/eye/right -> small x3 each
  - type: LegionSplit
    spawnOnDeathList:
    - LavalandBossLegionMedium
    - LavalandBossLegionMediumRight
    - LavalandBossLegionMediumEye
    splitsRemaining: 2
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandStaffOfStorms
      - id: MaterialBones1
      - id: MaterialBones1
      - id: MaterialBones1
    deleteOnDeath: true

# Mid tier: spawns from the boss split, splits once more.
- type: entity
  name: Legion
  id: LavalandBossLegionMedium
  parent: LavalandMobBase
  description: One of many.
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Lavaland/Mobs/legion_spawn.ogg
      params:
          volume: 0
          maxDistance: 30
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 500
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/64x64.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: mega_legion_left
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
        types:
          Blunt: 20
          Structural: 120
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4.5
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: TileMovement
  - type: Aggressive
    forgiveRange: 20.0
  - type: CombatPower
    factor: 15
  - type: LegionSplit
    spawnOnDeath: LavalandBossLegionSmall
    spawnCount: 3
    splitsRemaining: 1
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: MaterialBones1
    deleteOnDeath: true

# Mid tier right half, spawned by the boss split next to the left one.
- type: entity
  name: Legion
  id: LavalandBossLegionMediumRight
