# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  id: MobHierophant
  name: hierophant
  description: A massive metal club that hangs in the air as though waiting. It'll make you dance to its beat.
  components:
  # Basic stuff
  - type: MegafaunaDevour
  - type: ExplosionResistance
    worn: false
    damageCoefficient: 0.1
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 10000 # 10 tons. Can't really push this thing
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bosses/hierophant.rsi
    state: hierophant
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: NoSlip
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2850: Dead
  - type: Tag
    tags:
    - CannotSuicide
  # Actual boss from here
  - type: MeleeWeapon # TG: melee 15 brute, every hit is followed by a burst
    altDisarm: false
    angle: 0
    animation: WeaponArcThrust
    damage:
      types:
        Blunt: 15
  - type: ActionGrant
    actions:
    - ActionHierophantBox
    - ActionHierophantCrosses
    - ActionHierophantChasers
    - ActionHierophantChaserSwarm
    - ActionHierophantBlink
    - ActionHierophantCrossesEnraged
    - ActionHierophantBlinkSpam
    - ActionHierophantBlinkSlam
  - type: Fauna
  - type: Anger
    totalHp: 2850
  - type: Aggressive
    forgiveRange: 25
  - type: GPS
    gpsName: Zealous Signal
    enabled: true
  - type: MobPhases
    phaseThresholds:
      0:    1
      1425: 2 # below 50% HP: enraged crosses and blink spam
      2280: 3
  - type: BossEnrage
    healthFraction: 0.5
    speedMultiplier: 1.2
    attackRateMultiplier: 1.15
    actionDelay: 0.35
    sound:
      path: /Audio/Effects/demon_attack1.ogg
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: MegafaunaStage
    maxStage: 3 # MobPhases stages, phase 2 is the enrage
  - type: MegafaunaDodge
  - type: BossMusic
    soundId: Hierophant
  # Smooth movement, like the drake (no TileMovement): grid steps on a 10 ton boss lag the arena.
  - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandHierophantClub
      - id: CrusherUpgradeMainRudeBuster
    specialTable: !type:AllSelector
      children:
      - id: LavalandVortexTalisman
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    deleteOnDeath: true
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.5
    selector: !type:NestedMegafaunaSelector
      id: Hierophant
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MegafaunaFieldGenerator
    wallId: WallHierophantArenaTemporary
    wallShape: !type:NestedEntityShape
      id: BoxHollow
      size: 11 # Radius of the arena
  - type: MegafaunaAnchor
  - type: MegafaunaBlink
    spawnOnTarget: HierophantShapeBlinkStrong
    spawnOnUsed: HierophantShapeBlinkStrong
  # TG parity: every melee hit releases a burst.
  - type: HierophantMeleeBurst
  # TG parity: every twenty seconds the arena is recreated around the fleeing target.
  - type: HierophantArenaTrap
  # The blink slam action lands on a random tile near the target and blasts it on arrival.
  - type: HierophantBlinkSlam
    slam: HierophantShapeBlinkSlam
    radius: 2.5
    slamDelay: 0.9
  - type: MegafaunaBlinkInactive
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate
