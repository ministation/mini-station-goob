- type: entity
  name: Bubblegum
  id: LavalandBossBubblegum
  parent: LavalandMobBase
  description: In what passes for a hierarchy among slaughter demons, this one is king.
  components:
  - type: MegafaunaDevour
    spawnOnDevour: FoodBubblegum
  - type: ExplosionResistance
    worn: false
    damageCoefficient: 0.05
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 320
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bubblegum.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bubblegum
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/_Lavaland/Mobs/Bosses/Bubblegum/demon_attack1.ogg
    animation: WeaponArcBite
    attackRate: 1.0
    damage:
      types:
        Slash: 45
        Structural: 45
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      3000: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1000000
      behaviors:
      - !type:GibBehavior { }
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BossImpactFootstep
      params:
        volume: -5
  - type: TileMovement
  - type: PreventChasmFalling
    deleteOnUse: false
  - type: MegafaunaStage
    maxStage: 2
    nextStageHealthFraction: 0.5 # enrages at half health
  - type: BossMusic
    soundId: Bubblegum
  - type: Aggressive
    autoAddOnDamage: false
    forgiveRange: 40.0
  - type: Anger
    totalHp: 3000
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: CombatPower
    factor: 25
  - type: Bubblegum
  - type: GPS
    gpsName: Bloody Signal
    enabled: true
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandCrateSarcophagus
      - id: OrganSlaughterHeart # Goobstation reward, kept alongside the TG sarcophagus
    specialTable: !type:AllSelector
      children:
      - id: LavalandDemonClaws
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    deleteOnDeath: true
  - type: NoSlip
  - type: RequireProjectileTarget

# Blood cloud left behind by an enraged Bubblegum. Damages and knocks back whoever steps into it.
- type: entity
  id: LavalandBubblegumEnrageCloud
  name: blood cloud
  description: A cloud of boiling blood. Touching it hurts and throws you around.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        layer:
        - LowImpassable
  - type: Sprite
    noRot: true
    drawdepth: FloorObjects
    sprite: Effects/spookysmoke.rsi
    layers:
    - state: spookysmoke
      color: "#8c1116"
  - type: PointLight
    color: "#8c1116"
    radius: 2
    energy: 2
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    stepOn: true
  - type: BubblegumEnrageCloud
  - type: TimedDespawn
    lifetime: 3
