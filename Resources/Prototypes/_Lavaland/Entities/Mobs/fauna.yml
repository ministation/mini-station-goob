# Regular lavaland fauna from TG: hivelord, gutlunch, basilisk, lobstrosity.

# Floating acid blob: fast melee attacker, splits into broods on death.
- type: entity
  name: hivelord
  id: MobLavalandHivelord
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  suffix: Lavaland
  description: A truly vile creature that spews from tendril nests and carpet mines alike.
  components:
  - type: WeatherImmune # Lavaland change
  - type: Fauna # Lavaland change
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/hivelord.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: hivelord
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: hivelord
      Dead:
        Base: hivelord_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.2
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 0 # TG: the hivelord only weakly tackles, it has no melee damage
  - type: LegionSplit # Lavaland: hivelord death spawns a swarm of broods
    spawnOnDeath: MobLavalandHivelordBrood
    spawnCount: 3
    splitsRemaining: 1
  - type: SpawnLootOnDeath # TG: regenerative core death drop, FoodHivelordRemains is our equivalent
    table: !type:AllSelector
      children:
      - id: FoodHivelordRemains

# Weak fast offspring of a dead hivelord.
- type: entity
  name: hivelord brood
  id: MobLavalandHivelordBrood
  parent: MobLavalandHivelord
  suffix: Lavaland
  description: A fresh spawn of the hivelord, still weak but quick and angry.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/hivelord.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: hivelord_brood
  - type: DamageStateVisuals
    states:
      Alive:
        Base: hivelord_brood
      Dead:
        Base: hivelord_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead # TG: a brood dies to a single hit
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.0
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 2 # TG brood melee damage
  - type: TimedDespawn # TG: broods live for ten seconds
    lifetime: 10
  - type: LegionSplit # TG: broods do not split again
    splitsRemaining: 0
  - type: SpawnLootOnDeath # no core from a brood, override the hivelord drop
    table: null

# Harmless scavenger bird, a snack for a hungry miner.
- type: entity
  name: gutlunch
  id: MobLavalandGutlunch
  parent: SimpleSpaceMobBase
  suffix: Lavaland
  description: Named by the first miner to witness one of them gobble down a goliath's exposed guts.
  components:
  - type: Fauna # Lavaland change
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/gutlunch.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gutlunch
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gutlunch
      Dead:
        Base: gutlunch
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.0
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-gutlunch
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
  - type: TroughFeeder # TG: gutlunches eat raw ore straight out of food troughs
  - type: Gutlunch
  - type: Butcherable
    spawned:
    - id: FoodMeatGutshank

# Milk gutlunch. TG: gubbuck — a pink hen whose udder turns eaten ore into
# miner's salve; milk it with any cup.
- type: entity
  name: gubbuck
  id: MobLavalandGutlunchMilk
  parent: MobLavalandGutlunch
  suffix: Lavaland
  description: A plump pink gutlunch. Fill a trough with ore nearby and its udder will slowly fill with miner's salve.
  components:
  - type: Sprite
    color: "#ff9ec2"
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/gutlunch.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gutlunch
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: Gutlunch
    isMother: true
  # TG: /datum/component/udder, mine salve. Mini: the wizden cow udder system
  # stands in for TG's ore-gated udder (5 units / 50s matches TG's average
  # 5% per 2s tick production rate); the trough still matters for breeding.
  - type: Udder
    reagentId: MinersSalve
    quantityPerUpdate: 5
    growthDelay: 50
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 50

# Warrior gutlunch. TG: gunther — a bold grey hunter that hangs around troughs.
- type: entity
  name: gunther
  id: MobLavalandGutlunchWarrior
  parent: MobLavalandGutlunch
  suffix: Lavaland
  description: A warrior gutlunch with a taste for pepper. Fearless enough to pick fights it cannot win.
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        10
    rootTask:
      task: SimpleHostileCompound
  - type: CombatMode
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 2.9
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    angle: 0
    damage:
      types:
        Slash: 8
  - type: Butcherable
    spawned:
    - id: FoodMeatGutshank
      amount: 2

# Baby gutlunch. TG: grublunch — grows into a warrior or a milk gubbuck after
# three minutes.
- type: entity
  name: grublunch
  id: MobLavalandGutlunchGrub
  parent: MobLavalandGutlunch
  suffix: Lavaland
  description: A freshly hatched gutlunch. It will grow into a gunther or a gubbuck before long.
  components:
  - type: Sprite
    scale: 0.6, 0.6
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/gutlunch.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gutlunch
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Dead
  - type: FaunaGrowth
    growthTime: 180
    growInto:
    - MobLavalandGutlunchWarrior
    - MobLavalandGutlunchMilk

# Ranged floater whose petrifying stare chills its prey to the bone.
- type: entity
  name: basilisk
  id: MobLavalandBasilisk
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  suffix: Lavaland
  description: A territorial creature that keeps its victims frozen in place.
  components:
  - type: WeatherImmune # Lavaland change
  - type: Fauna # Lavaland change
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/basilisk.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: basilisk
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: basilisk
      Dead:
        Base: basilisk_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      140: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.65
    baseSprintSpeed: 1.65
  - type: BatteryAmmoProvider
    proto: BasiliskGaze
    fireCost: 50
  - type: BatterySelfRecharger
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    projectileSpeed: 10
    fireRate: 0.2
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: CombatMode
  - type: LaserAbsorb # Lavaland: shooting it with lasers just chills it further
  - type: BasiliskOverheat # Mini: TG parity, touching something hot turns it into a fast, hot-shooting form
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BasiliskOverheatVisuals.Overheated:
        enum.DamageStateVisualLayers.Base:
          True: { state: basilisk_alert }
          False: { state: basilisk }
  - type: Butcherable
    spawned:
    - id: MaterialBones1
      amount: 1
    - id: DiamondOre1
      amount: 2

# Aggressive armored lobster of the lava fields.
- type: entity
  name: lobstrosity
  id: MobLavalandLobstrosity
  parent: LavalandMobBase
  suffix: Lavaland
  description: A monstrous lobster corrupted by lava and radiation, always hungry.
  components:
  # Mini: crusher trophy, TG gates it on the killing blow being a crusher hit.
  - type: SpawnLootOnDeath
    specialTable: !type:AllSelector
      children:
      - id: LavalandCrusherTrophyLobsterClaw
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: Fauna # Lavaland change
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/lobstrosity.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: lobstrosity
  - type: DamageStateVisuals
    states:
      Alive:
        Base: lobstrosity
      Dead:
        Base: lobstrosity_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 2.6
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    angle: 0
    damage:
      types:
        Slash: 20
  - type: Butcherable
    spawned:
    - id: FoodMeatLobster
      maxAmount: 2
  # Mini: TG lobster rush, a dash that knocks the victim down and leaves the lobster tired.
  - type: LavalandRush
  # TG juvenile lobstrosity: tame_chance 35, bonus_tame_chance 20, eats meat from your hand.
  # The adult is not tameable in TG, we map the juvenile numbers onto our only lobstrosity.
  - type: TameableMob
    tameChance: 35
    bonusTameChance: 20
    foodTags:
    - Meat

# Juvenile lobstrosity. TG: a 65 HP swarm lobster that grows into a full adult
# after roughly seven minutes.
- type: entity
  name: juvenile lobstrosity
  id: MobLavalandLobstrosityJuvenile
  parent: LavalandMobBase
  suffix: Lavaland
  description: A young lobstrosity, not yet grown into its full armored menace. It has the same bad attitude, though.
  components:
  - type: Fauna # Lavaland change
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    scale: 0.65, 0.65
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/lobstrosity.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: lobstrosity
  - type: DamageStateVisuals
    states:
      Alive:
        Base: lobstrosity
      Dead:
        Base: lobstrosity_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.0
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    angle: 0
    damage:
      types:
        Slash: 7
  - type: CombatMode
  - type: LavalandRush # Mini: weaker TG shrimp rush for the juvenile
    range: 4
    knockdownSeconds: 1.8
    rushDamage:
      types:
        Slash: 10
  - type: TameableMob # TG juvenile lobstrosity: tame_chance 35, bonus 20
    tameChance: 35
    bonusTameChance: 20
    foodTags:
    - Meat
  - type: FaunaGrowth
    growthTime: 420
    growInto:
    - MobLavalandLobstrosity
  - type: Butcherable
    spawned:
    - id: FoodMeatLobster
