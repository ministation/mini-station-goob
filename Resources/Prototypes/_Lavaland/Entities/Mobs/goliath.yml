- type: entity
  id: MobLavalandGoliath
  parent: MobGoliath
  suffix: Lavaland
  components:
  # Mini: crusher trophy, TG gates it on the killing blow being a crusher hit.
  - type: SpawnLootOnDeath
    specialTable: !type:AllSelector
      children:
      - id: LavalandCrusherTrophyGoliathTentacle
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: Sprite
    sprite: _Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: HTN
    blackboard:
      VisionRadius: !type:Single # Highly aggressive
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  # TG goliath.dm: tame_chance 10, bonus_tame_chance 5, food = ash flora grown produce.
  - type: TameableMob
    foods:
    - FoodAshFireBlossom
    - FoodAshGlowgrowthSheet
    - FoodAshInozhakustMash
    - FoodAshPlasmaFlower
    - FoodAshPodsneyzkaBunch
    - FoodAshVahrezjiaStalks
    - FoodAshDrakeBeet
    - FoodAshStarCactus
    - FoodAshMushroomShavings
    - FoodAshMushroomLeaf
    - FoodAshMushroomCap
    - FoodAshMushroomStem
    - FoodAshSerakaCap
    - FoodAshFonarstolbe
  # TG goliath.dm: /obj/item/goliath_saddle, 5.5 s to affix. Riding uses the fork's Vehicle.
  - type: MountableMob
    saddleItems:
    - LavalandGoliathSaddle
  # Buckling is gated by LavalandTamingSystem until the mob is saddled.
  - type: Strap
    position: Stand
    blockMovement: false

- type: entity
  id: MobLavalandGoliathAncient
  parent: MobGoliath
  name: ancient goliath
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath_ancient
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath_ancient
      Dead:
        Base: goliath_ancient_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 10
        Slash: 15
  #- type: MobThresholds
  #  thresholds:
  #    0: Alive
  #    400: Dead
  - type: HTN
    blackboard:
      VisionRadius: !type:Single # Extremely aggressive
        9
      AggroVisionRadius: !type:Single
        10
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 3
    - id: MaterialGoliathHide1
      amount: 3
    - id: MaterialBones1
      amount: 3
