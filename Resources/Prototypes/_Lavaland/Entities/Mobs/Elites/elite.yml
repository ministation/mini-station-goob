- type: entity
  name: Elite
  id: LavalandEliteBase
  abstract: true
  parent: LavalandMobBase
  description: An elite monster, found in one of the strange tumors on lavaland.
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  # Megafauna AI wiring (works for NPC control; a ghost takeover pauses it)
  - type: InputMover
  - type: Input
    context: "human"
  - type: MobMover
  - type: LagCompensation
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: RequireProjectileTarget
    active: False
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Elites/32x64.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legionnaire
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    animation: WeaponArcBite
    damage:
        types:
          Slash: 10
          Blunt: 10
          Structural: 50
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: CombatPower # Goobstation
    factor: 8 # times more dangerous than a crew-member
  - type: LavalandElite
  - type: StaminaResistance
    worn: false
    meleeResistance: true
    damageCoefficient: 0 # elites cannot be put into stamina crit either
  # Bosses get the HUD from MegafaunaStage, elites are not staged so they declare it here.
  - type: BossHud

- type: entity
  name: Legionnaire
  id: LavalandEliteLegionnaire
  parent: LavalandEliteBase
  description: A towering skeleton, embodying the terrifying power of Legion.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Elites/32x64.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legionnaire
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legionnaire
      Dead:
        Base: legionnaire_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      path: /Audio/Effects/bite.ogg
    animation: WeaponArcBite
    damage:
        types:
          Slash: 25
          Blunt: 10
          Structural: 50
  - type: Tag
    tags:
    - CannotSuicide
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: BossMusic
    soundId: Miniboss
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  # Megafauna AI wiring (works for NPC control; a ghost takeover pauses it)
  - type: InputMover
  - type: Input
    context: "human"
  - type: MobMover
  - type: LagCompensation
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: RequireProjectileTarget
    active: False
  - type: ActionGrant
    actions:
    - ActionEliteLegionnaireDash
    - ActionEliteLegionnaireSummon
    - ActionEliteLegionnaireSkulls
    - ActionEliteLegionnaireTurret
  - type: GPS
    gpsName: Crumbling Signal
    enabled: true
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.7
    selector: !type:NestedMegafaunaSelector
      id: EliteLegionnaire
  - type: Anger
    totalHp: 1000
  - type: MegafaunaBlink
    spawnOnTarget: LavalandLegionChargeBurst
    spawnOnUsed: LavalandLegionChargeBurst
  - type: MegafaunaRejuvenate
  - type: SpawnLootOnDeath
    table: !type:NestedSelector
      tableId: LavalandMaterialRare
    specialTable: !type:AllSelector
      children:
      - id: LavalandLegionnaireSpine
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    deleteOnDeath: false

- type: entity
  id: LavalandElitePandora #Just a hierophant resprite, all of these are templates anyway.
  name: Pandora
  description: A large magic box with similar power and design to the Hierophant. Once it opens, it's not easy to close it.
  components:
  # Basic stuff
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  # Actual boss from here
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hierophant
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Elites/32x64.rsi
    state: pandora
  - type: DamageStateVisuals
    states:
      Alive:
        Base: pandora
      Dead:
        Base: pandora_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Tag
    tags:
    - CannotSuicide
  - type: NoSlip
  - type: Aggressive # also required component for aggro checking
    forgiveRange: 20.0
  - type: BossMusic
    soundId: Hierophant
  - type: Fauna
  # Megafauna AI wiring
  - type: ActionGrant
    actions:
    - ActionElitePandoraBlink
    - ActionElitePandoraBox
    - ActionElitePandoraCrosses
  - type: GPS
    gpsName: Blinking Signal
    enabled: true
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 0.7
    selector: !type:NestedMegafaunaSelector
      id: ElitePandora
  - type: Anger
    totalHp: 1000
  - type: MegafaunaBlink
    spawnOnTarget: HierophantShapeBlink
    spawnOnUsed: HierophantShapeBlink
  - type: MegafaunaRejuvenate
  - type: SpawnLootOnDeath
    table: !type:NestedSelector
      tableId: LavalandMaterialRare
    specialTable: !type:AllSelector
      children:
      - id: LavalandPandoraHope
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
    dropBoth: true
    deleteOnDeath: false
  - type: LavalandElite
  - type: BossHud

