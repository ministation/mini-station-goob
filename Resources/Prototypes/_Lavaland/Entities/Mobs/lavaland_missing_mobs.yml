# SPDX-License-Identifier: AGPL-3.0-or-later
# TG lavaland mobs that were missing from the fork: bileworm, goldgrub and the raptor familia.
# Sprite sheets converted from tgstation icons (CC-BY-SA-3.0).

# Caustic projectile spat by bileworms.
- type: entity
  name: bile glob
  id: LavalandBileGlob
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: A glob of caustic bile.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
      color: "#7fbf2f"
      shader: unshaded
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectOmnilaser
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Caustic: 12

# Immobile acid spitter, TG bileworm.
- type: entity
  name: bileworm
  id: LavalandMobBileworm
  parent: LavalandMobBase
  description: Bileworms are dangerous detritivores that attack with the highly acidic bile they produce from consuming detritus.
  components:
  # Mini: crusher trophy, TG gates it on the killing blow being a crusher hit.
  - type: SpawnLootOnDeath
    specialTable: !type:AllSelector
      children:
      - id: LavalandCrusherTrophyBilewormSpewlet
    weaponWhitelist:
      components:
      - MegafaunaWeaponLooter
  - type: Fauna # Lavaland change
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        10
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Bileworm.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bileworm
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bileworm
      Dead:
        Base: bileworm_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      110: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: BatteryAmmoProvider
    proto: LavalandBileGlob
    fireCost: 50
  - type: BatterySelfRecharger
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    projectileSpeed: 8
    fireRate: 0.5
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: CombatMode
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 2
    - id: GoldOre
      amount: 2
  - type: CombatPower # Goobstation
    factor: 3

# Passive ore eater, TG goldgrub. Doesn't move fast and never attacks, but drops ore when butchered.
- type: entity
  name: goldgrub
  id: LavalandMobGoldgrub
  parent: LavalandMobBase
  description: A worm that grows fat from eating everything in its sight. Seems to enjoy precious metals and other shiny things, hence the name.
  components:
  - type: Fauna # Lavaland change
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.4,0.5,0.4"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Goldgrub.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goldgrub
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goldgrub
      Dead:
        Base: goldgrub_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      175: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.0
  - type: Butcherable
    spawned:
    - id: GoldOre
      amount: 1
      maxAmount: 2
    - id: SilverOre
      amount: 1
      maxAmount: 2
    - id: UraniumOre
      amount: 1
    - id: DiamondOre
      amount: 1

# Common parts of every adult raptor. Colors override sprite, health, speed and damage.
- type: entity
  name: raptor
  id: LavalandMobRaptorAdultBase
  parent: LavalandMobBase
  abstract: true
  description: A trusty, powerful steed. Taming it might prove difficult.
  components:
  - type: Fauna # Lavaland change
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        10
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _Lavaland/Mobs/Raptor.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: raptor_red
  - type: DamageStateVisuals
    states:
      Alive:
        Base: raptor_red
      Dead:
        Base: raptor_red_dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 12
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MobThresholds
    thresholds:
      0: Alive
      220: Dead
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 3
    - id: MaterialBones1
      amount: 2
  - type: CombatPower # Goobstation
    factor: 4

