    canBreed: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: young_red
  - type: DamageStateVisuals
    states:
      Alive:
        Base: young_red
      Dead:
        Base: young_red_dead
  - type: MeleeWeapon
