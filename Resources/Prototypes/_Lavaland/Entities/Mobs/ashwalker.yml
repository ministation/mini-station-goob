# Ashwalkers from TG lavaland: a tribal lizard tribe living around their nest.

# Body shared by every ash walker, both the ghost role one and the job one.
- type: entity
  abstract: true
  name: ash walker
  id: MobAshwalkerBase
  parent: MobReptilian
  description: A mutated creature born from the Necropolis. It is hostile to strangers.
  components:
  # Own species instead of a plain Unathi copy: ashen grey and digitigrade.
  - type: HumanoidAppearance
    species: Ashwalker
    hideLayersOnEquip:
    - Snout
    - HeadSide
  - type: RandomHumanoidAppearance
    randomizeName: false
  # TG ashwalkers have Lavaland lungs and breathe the local air without internals.
  - type: BreathingImmunity
  - type: NightVision # Goobstation - ashwalkers see in the Lavaland night
    color: "#808080"
    activateSound: null
    deactivateSound: null
    isActive: true
  - type: LavaImmunity # Mini: heat damage is nullified, fire does nothing
  - type: StepTriggerImmune # Mini: TG ashwalkers walk over lava without the slow or the ignite
    whitelist:
      types:
      - Lava
  - type: AshwalkerTribeMember # joins the tribe of the nearest nest when it gets a mind
  # NanoTrasen keeps station logic treating them as crew; Ashwalker lets the local fauna know them.
  - type: NpcFactionMember
    factions:
    - NanoTrasen
    - Ashwalker
  # TG remove_language(common): ash walkers understand and speak only Draconic.
  - type: LanguageKnowledge
    speaks:
    - Draconic
    understands:
    - Draconic
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 12

# Ashwalker body of the nest eggs. The ghost role also gives the Ash Walker job,
# so egg born tribe members show up in the crew manifest.
- type: entity
  parent: MobAshwalkerBase
  id: MobAshwalker
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-ashwalker-name
    description: ghost-role-information-ashwalker-description
    rules: ghost-role-information-ashwalker-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    raffle:
      settings: default
    job: AshWalker
  - type: GhostTakeoverAvailable

# Ashwalker body used as the JobEntity of the AshWalker job.
# No ghost role: the job system creates the mind when the player spawns.
- type: entity
  parent: MobAshwalkerBase
  id: MobAshwalkerPlayable

- type: entity
  id: LavalandAshwalkerEgg
  parent: BaseStructure
  name: ash walker egg
  description: A large, veiny egg. Something is stirring inside.
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: PreventChasmFalling
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Objects/Specific/ashwalker_egg.rsi
    state: large_egg
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-ashwalker-name
    description: ghost-role-information-ashwalker-description
    rules: ghost-role-information-ashwalker-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    raffle:
      settings: default
    job: AshWalker
  - type: AshwalkerEgg # one hatch per ckey, yolk when broken
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: LavalandAshwalkerStructure
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 # TG ash walker egg integrity
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      # TG: the broken egg leaves a gibbed half-formed walker, spawned by AshwalkerEggSystem.

# The nest: consumes corpses, hatches eggs.
- type: entity
  id: LavalandAshwalkerNest
  parent: BaseStructure
  name: ash walker nest
  description: A pulsating tendril nest, wreathed in ash. It hungers for corpses.
  components:
  - type: AshwalkerNest
  - type: PreventChasmFalling
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Structures/Specific/ashwalker_nest.rsi
    state: ash_walker_nest
    offset: 0, 0.5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: LavalandAshwalkerStructure
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 # TG ash walker nest integrity
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: LavalandAshwalkerDenSpawner
  parent: MarkerBase
  name: ash walker den spawner
  suffix: Lavaland
  components:
  - type: AshwalkerDenSpawner

# TG parity: the nest and its eggs are fire, lava and freeze proof.
- type: damageModifierSet
  id: LavalandAshwalkerStructure
  coefficients:
    Heat: 0.0
    Cold: 0.0
