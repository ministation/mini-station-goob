# 8 directional spike lash, used by the tendril's melee retaliation.
- type: entity
  parent: MarkerBase
  id: LavalandTendrilLash
  name: tendril lash spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandTendrilSpike
    alignCoords: true
    shape: !type:NestedEntityShape
      id: QueenCross
  - type: ShapeSpawnerCounter
    maxCounter: 5
    spawnPeriod: 0.15
  - type: ExpandingShapeSpawner
    counterSize: 1
