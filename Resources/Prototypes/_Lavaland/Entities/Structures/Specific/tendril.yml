- type: entity
  id: LavalandTendrilBase
  parent: BaseStructure
  name: tendril
  abstract: true
  description: A huge structure.
  components:
  - type: Sprite
    noRot: true
    sprite: _Lavaland/Structures/Specific/tendril.rsi
    state: tendril
    drawdepth: Mobs
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Skeleton
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800 # TG tendril health
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          LavalandCrateNecropolisFilled:
            min: 1
            max: 1
      # TG parity: the chest must not vanish into the hole it sits on. Necropolis chests
      # inherit PreventChasmFalling, so they climb out instead of being deleted by the chasm.
      - !type:SpawnEntityShapeBehavior
        toSpawn: FloorChasmOpeningSpawner
        shape: !type:NestedEntityShape
          id: BoxFilled
          size: 3
      - !type:PopupBehavior
        popup: tendril-destroyed-warning-message
        popupType: LargeCaution
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MobMask
        layer:
        - MobLayer
        density: 200
  - type: GPS
    gpsName: Eerie Signal
    enabled: true
  - type: TriggerOnProximity
    cooldown: 10.0
    requiresAnchored: false
    repeating: true
    triggerSpeed: 0
    shape:
      !type:PhysShapeCircle
      radius: 8
    layer:
    - MobMask
  - type: TriggerCounter
  - type: TriggerCounterLimit
    maxCount: 5
  - type: SpawnTableOnTrigger
  - type: WhitelistTriggerCondition
    userWhitelist:
      components:
      - Actor
  # Combat AI: the tendril fights back with spikes when damaged (port of TG tendril combat)
  - type: Aggressive
    forgiveRange: 12.0
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionTendrilSpikes
    - ActionTendrilChasers
    - ActionTendrilLash
  # TG parity: melee retaliation and infection of the surrounding rock on death.
  # The mob respawn blocking (TG block_mining_mob_respawns) is not ported yet,
  # the fork has no global mining mob respawn loop to block.
  - type: NecropolisTendril
  - type: Regenerator # TG: 20 brute per second after 30 seconds without damage
    regenerationDelay: 30
    brutePerSecond: 20
  - type: MegafaunaAi
    actionDelay: !type:MegafaunaConstantNumberSelector
      value: 1.0
    selector: !type:NestedMegafaunaSelector
      id: Tendril
  - type: Anger
    totalHp: 800 # TG tendril health
  - type: MegafaunaRejuvenate

- type: entity
  parent: LavalandTendrilBase
  id: LavalandTendrilGoliath
  name: tendril
  description: A huge structure.
