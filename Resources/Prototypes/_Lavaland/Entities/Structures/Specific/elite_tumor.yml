# Pulsating tumor from TG lavaland: wake it by hand to release one of the
# four elite monsters and seal the arena.
- type: entity
  id: LavalandEliteTumor
  parent: BaseStructure
  name: pulsating tumor
  description: A repulsive tumor that grows into the rock. It is breathing.
  components:
  - type: EliteTumor
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Structures/Specific/elite_tumor.rsi
    state: tumor
    offset: 0, 0.5
  # TG parity: the tumor itself is indestructible, only the fight outcome changes it.
  - type: Appearance
  - type: PointLight
    color: "#D64C9E"
    radius: 2
    energy: 2

# Abstract template: a boosted tumor clones this ghost role onto the spawned elite.
- type: entity
  id: LavalandEliteTumorGhostRole
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    allowMovement: true
    makeSentient: true
    name: ghost-role-information-elite-tumor-name
    description: ghost-role-information-elite-tumor-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

- type: entity
  id: LavalandEliteTumorSpawner
  parent: MarkerBase
  name: elite tumor spawner
  suffix: Lavaland
  components:
  - type: EliteTumorSpawner
