# Colossus arena landmark and its loot.

- type: entity
  id: LavalandColossusArenaSpawner
  parent: MarkerBase
  name: colossus arena spawner
  suffix: Lavaland
  components:
  - type: ColossusArenaSpawner

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateColossus
  name: colossus chest
  description: A pristine chest guarded by the ancient arms dealer.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LavalandLootColossus

# Crusher trophy
- type: entity
  id: LavalandBlasterTubes
  parent: BaseLavalandCrusherTrophy
  name: blaster tubes
  description: Trophy tubes taken from a colossus.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/trophies.rsi
    state: blaster_tubes
  - type: ItemUpgrade
    name: crusher-trophy-blaster-tubes-name
    uniqueGroup: crusherTrophy
  # shortcut: TG lets the crusher fire during its melee cooldown, this only cuts shot recharge time.
  - type: GunUpgradeFireRate
    coefficient: 2
  - type: CrusherTrophy
