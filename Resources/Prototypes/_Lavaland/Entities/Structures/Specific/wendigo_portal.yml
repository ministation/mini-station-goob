# TG parity: a one-way red portal the wendigo leaves at its arena spawn point on death.
- type: entity
  id: LavalandWendigoExitPortal
  parent: PortalRed
  name: one-way portal
  description: You get the feeling that this might not be the safest thing you've ever done.
  components:
  - type: PointLight
    color: Red
    radius: 6
    energy: 1.5
    netsync: false

# Invisible link target placed outside the arena patch.
- type: entity
  id: LavalandWendigoExitPoint
  parent: MarkerBase
  name: wendigo arena exit
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
