# TG lavaland wave 2: mook village pieces and the sliding puzzle room.

# Planks the mooks trampled flat inside their huts.
- type: entity
  id: LavalandMookWoodFloor
  name: wooden floor
  description: Rough planks beaten flat by generations of feet.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: FloorObjects
    sprite: _Corvax/Objects/Tiles/wood.rsi
    state: wood_dark

# Carved stone marker of mook territory.
- type: entity
  parent: BaseStructure
  id: LavalandMookTotem
  name: mook totem
  description: A stack of carved bone and ashwood. It smells of old mushroom soup.
  suffix: Lavaland
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Structures/Specific/ashwalker_nest.rsi
    state: tombstone

# TG mook material stand: the village share box for ore.
- type: entity
  parent: TableWood
  id: LavalandMookMaterialStand
  name: material stand
  description: Is everyone free to use this thing?
  suffix: Lavaland

# One piece of the sliding puzzle. The nine concrete pillars carry fragments
# of the TG puzzle picture (puzzle_0..8); SlidingPuzzleSystem spawns the right
# one per slot.
- type: entity
  parent: BaseStructure
  id: LavalandPuzzlePillar
  abstract: true
  name: puzzle pillar
  description: A stone pillar with a carved picture on it. It could slide, with some effort.
  suffix: Lavaland
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Lavaland/Structures/Specific/puzzle.rsi
    state: puzzle_0
  - type: InteractionOutline
  # TG: breaking a pillar voids the puzzle reward.
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: LavalandPuzzlePillar
  id: LavalandPuzzlePillar0
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: puzzle_0

- type: entity
  parent: LavalandPuzzlePillar
  id: LavalandPuzzlePillar1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: puzzle_1

- type: entity
  parent: LavalandPuzzlePillar
  id: LavalandPuzzlePillar2
