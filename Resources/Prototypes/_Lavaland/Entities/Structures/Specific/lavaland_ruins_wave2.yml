# TG puzzling chest: the reward of the sliding puzzle.
- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandPuzzleCrate
  name: puzzling chest
  description: A chest that clicks open when the pieces line up.
  suffix: Lavaland
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LavalandLootPuzzle
