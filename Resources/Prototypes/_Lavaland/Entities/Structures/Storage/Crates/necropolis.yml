- type: entity
  parent: CrateGenericSteel
  id: LavalandCrateNecropolis
  name: necropolis chest
  description: Steel and strong.
  components:
  - type: Icon
    sprite: _Lavaland/Structures/Storage/Crates/necropolechest.rsi
  - type: Sprite
    sprite: _Lavaland/Structures/Storage/Crates/necropolechest.rsi
  # TG parity: necropolis chests are lava, fire and acid proof.
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: LavalandNecropolisChest
  # TG parity: the chest must not vanish into a chasm that opens under it.
  - type: PreventChasmFalling

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateNecropolisFilled
  name: necropolis chest
  suffix: Filled
  components:
  - type: AlmanacBladeChestSpawner
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LavalandLootTendril

# Kept as an alias for anything that still points at the old table id.
- type: entityTable
  id: NecropolisChestLoot
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: LavalandLootTendril

- type: entityTable
  id: LavalandMaterialRare
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: MaterialWatcherWing5
      - id: MaterialWatcherMagmaWing5
      - id: MaterialWatcherIceWing5
    - !type:AllSelector
      rolls: 1, 2
      children:
      - id: MaterialLegionSkull1
      - id: MaterialBones1
        rolls: 2, 3

# TG parity: Metallic crate resistances with fire, lava and acid immunity.
- type: damageModifierSet
  id: LavalandNecropolisChest
  coefficients:
    Blunt: 0.7
    Slash: 0.5
    Piercing: 0.7
    Shock: 1.2
    Structural: 0.5
    Heat: 0.0
    Caustic: 0.0
  flatReductions:
    Blunt: 5

