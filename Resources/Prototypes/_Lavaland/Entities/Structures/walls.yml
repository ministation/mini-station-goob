# Temporary wall of the ash drake's lava arena (TG drakewall).
- type: entity
  parent: BaseWall
  id: WallDrakeArenaTemporary
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Effects/fire.rsi
    state: fire
    drawdepth: SmallMobs
  - type: Icon
    sprite: /Textures/Effects/fire.rsi
    state: fire
  - type: TimedDespawn
    lifetime: 9
  - type: PointLight
    color: "#FF6B2B"
    radius: 2
    energy: 3
