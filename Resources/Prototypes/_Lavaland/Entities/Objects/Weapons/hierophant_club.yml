- type: entity
  id: LavalandHierophantClub
  parent: BaseItem
  name: hierophant club
  description: The hierophant's weapon, still humming with violet energy. A slow two-handed club (15 blunt and 5 heat per swing) that grants four abilities - Blink (10 sec cooldown), the Curse of Tile Movement that forces its victim to walk only in whole tiles (30 sec), and two hierophant blast patterns, an Expanding Box and Sequence Crosses (15 sec each), that dig through rock.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
    state: icon
  - type: Clothing
    sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
    slots:
    - back
    - suitStorage
  - type: Item
    size: Normal
    sprite: _Lavaland/Objects/Weapons/hierophant_club-inhands.rsi
  - type: StaticPrice
    price: 5000
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.75
    damage:
      types:
        Blunt: 15
        Heat: 5
  - type: ActionGrant
    actions:
    - ActionHierophantClubTileMovement
    - ActionHierophantClubBlink
    - ActionHierophantClubBox
    - ActionHierophantClubCrosses
    - ActionHierophantClubBeacon
  - type: ItemActionGrant
    actions:
    - ActionHierophantClubTileMovement
    - ActionHierophantClubBlink
    - ActionHierophantClubBox
    - ActionHierophantClubCrosses
    - ActionHierophantClubBeacon
  # TG parity: detach the beacon at your feet, then channel everyone near you to it.
  - type: HierophantClubBeacon
  - type: HeldGrantComponent
    components:
    - type: MegafaunaBlink
      spawnOnTarget: HierophantShapeBlinkSafe
      spawnOnUsed: HierophantShapeBlinkSafe

# Club blast tile: inherits the boss blast and digs through the rock on its own tile.
- type: entity
  parent: LavalandHierophantSquare
  id: LavalandHierophantClubBlast
  name: hierophant club blast
  components:
  - type: HierophantClubDrill

- type: entity
  id: LavalandHierophantMarker
  name: mysterious marker
  description: What even is this?
  placement:
    mode: AlignTileAny
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeCircle
          radius: 0.35
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Lavaland/Structures/Specific/hierophant_telepad.rsi
    state: hierophant_tele_on # TODO hierophant visuals
  - type: SyncSprite
  - type: PointLight
    radius: 5.0
    energy: 1.5
    softness: 1
    castShadows: false

# TG parity: the hierophant club beacon, placed by the club's beacon action.
- type: entity
  id: LavalandHierophantBeacon
  name: hierophant beacon
  description: A strange machine, allowing mass teleportation for those able to use it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeCircle
          radius: 0.35
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: hierophant_tele_off
  - type: PointLight
    color: "#cc6666"
    radius: 3
    energy: 1.5
  - type: HierophantBeacon
