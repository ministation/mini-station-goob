# Colossus chest loot items (port of TG megafauna loot, adapted subset).

# Cain & Abel: twin daggers. TG stats: 15 force, attack speed 6 (about 1.7 hits per
# second) and two tiles of reach. The combo counter, wisps and TG's special throw
# modes need new server systems, so only the weapon itself is ported.
# shortcut: no combo/wisp/special throw mechanics, upgrade when the dagger systems are ported.
- type: entity
  id: LavalandCainDagger
  parent: BaseKnife
  name: Cain
  description: The elder twin. It hungers for its brother's company.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: cain_and_abel
  - type: Item
    size: Small
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    inhandVisuals:
      left:
      - state: cain_and_abel
      right:
      - state: cain_and_abel
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.7
    range: 2
    damage:
      types:
        Slash: 15
  # TG lets you throw the daggers at a target; a thrown dagger hits as hard as a swing.
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15
  - type: StaticPrice
    price: 2000

- type: entity
  id: LavalandAbelDagger
  parent: LavalandCainDagger
  name: Abel
  description: The younger twin. It hungers for its brother's blood.

# Divine vocal cords: a voice that commands obedience.
- type: entity
  id: LavalandVocalCords
  parent: BaseItem
  name: divine vocal cords
  description: The vocal cords of a god. Holding them to your throat lets you speak with authority.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: dustyshard
  - type: StaticPrice
    price: 3000
  - type: ActionGrant
    actions:
    - ActionVoiceOfGod
  - type: ItemActionGrant
    actions:
    - ActionVoiceOfGod

- type: entity
  id: ActionVoiceOfGod
  parent: BaseAction
  name: Voice of God
  description: Speak a word of command. The target is forced to its knees.
  components:
  - type: Action
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: knock
    useDelay: 30
  - type: TargetAction
    range: 10
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:VoiceOfGodActionEvent

# Anomalous crystal of renewal: single-use, revives the dead or fully heals the user.
- type: entity
  id: LavalandRenewalCrystal
  parent: BaseItem
  name: anomalous crystal of renewal
  description: A humming crystal that pulses with life-giving energy. Use it near a corpse to breathe life back into it.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: dustyshard
  - type: PointLight
    color: "#7CFC00"
    radius: 2
    energy: 2
  - type: RenewalCrystal
