# Kinetic accelerator modkits ported from TG. All of them reuse the existing PKA upgrade system.

- type: entity
  id: PKAUpgradeCooldown
  parent: BasePKAUpgrade
  name: PKA modkit (cooldown)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#3bd1ff"
    - state: overlay-2
      color: "#0a67a8"
    - state: overlay-3
      color: "#8be9ff"
  - type: ItemUpgrade
    name: gun-upgrade-cooldown-name
    uniqueGroup: pka-cooldown
  - type: GunUpgradeFireRate
    coefficient: 1.35

- type: entity
  id: PKAUpgradeMiningExplosion
  parent: BasePKAUpgrade
  name: PKA modkit (mining explosion)
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ffb43b"
    - state: overlay-2
      color: "#a85b0a"
    - state: overlay-3
      color: "#ffd98b"
  - type: ItemUpgrade
    name: gun-upgrade-mining-explosion-name
    uniqueGroup: pka-aoe
  - type: GunUpgradeProjectileComponents
    components:
    - type: PkaProjectileExplosion
      turfs: true
  - type: GunUpgradeFireRate
    coefficient: 0.75

- type: entity
