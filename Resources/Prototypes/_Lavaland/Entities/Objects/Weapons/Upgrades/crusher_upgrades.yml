# Important Note!
# Crusher upgrade entities have the exact same ID as their respective TagPrototype.
# Remember to take this into account when adding new upgrades!

# Main Upgrades
- type: entity
  id: BaseCrusherUpgradeMain
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: crusher upgrade capsule
  description: A modkit for the main slot of a crusher weapon. Insert it while holding the upgrade in hand. The slot is unique - a second main modkit will not fit.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - CrusherUpgradeMain

- type: entity
  id: CrusherUpgradeMainMarker
  parent: BaseCrusherUpgradeMain
  name: crusher upgrade capsule (kinetic marker)
  description: A legacy modkit - the kinetic marker is now built into every crusher, so this capsule grants nothing anymore. It is only kept around for old maps and loot tables.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: kinetic-marker
  - type: ItemUpgrade
    name: gun-upgrade-crusher-kinetic-marker-name
    uniqueGroup: mainUpgrade
  # The kinetic marker is built into the base crusher now, so this capsule no longer grants
  # any components. It stays as a legacy loot item for existing maps and boss loot tables.
  - type: Tag
    tags:
    - CrusherUpgradeMain
    - CrusherUpgradeMainMarker

# TODO turn it into an action gun and add auto-targeting
# TODO make it charge when doing hits to an entity, instead of just a cooldown
- type: entity
  id: CrusherUpgradeMainRudeBuster
  parent: BaseCrusherUpgradeMain
  name: crusher upgrade capsule (rude buster)
  description: Main slot modkit. Replaces the built-in kinetic marker shot with a half-magical projectile (8 sec recharge) - fire pure determination straight at the enemy. Ejecting the capsule brings the marker back.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: rude-buster
  - type: ItemUpgrade
    name: gun-upgrade-crusher-rude-buster-name
    uniqueGroup: mainUpgrade
  - type: KineticMarkerUpgrade
  # Only the parts that differ from the built in kinetic marker: AmmoCounter, UseDelayOnShoot,
  # GunRequiresWield, MapRestricted and MapRestrictedGun already sit on the crusher itself.
  # The marker system restores the gun components after this upgrade is ejected.
  - type: GunUpgradeComponents
    components:
    - type: Gun
      projectileSpeed: 12 # Needed for the trail to look good
      soundGunshot: /Audio/Weapons/plasma_cutter.ogg
      fireRate: 10
      useKey: false
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 8
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    - type: BasicEntityAmmoProvider
      proto: ProjectileRudeBuster
      capacity: 1
      count: 1
  - type: Tag
    tags:
    - CrusherUpgradeMain
    - CrusherUpgradeMainRudeBuster

# Blade upgrades
- type: entity
  id: BaseCrusherUpgradeBlade
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: crusher blade upgrade
  description: A modkit for the blade slot of a crusher weapon. Blades add damage and on-hit effects - sharpness (+7 slashing), lava aspect (+5 heat and ignition) or ice frost (+4 cold and a chill). Crafted from five watcher wings.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - CrusherUpgradeBlade

- type: entity
  id: CrusherUpgradeBladeLavaAspect
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (lava aspect)
  description: Blade slot modkit. Adds +5 heat damage, and every hit ignites and heats the target. Crafted from 5 magmawing watcher wings.
  components:
  - type: Sprite
    state: lava-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-lava-aspect
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Heat: 5
  - type: WeaponUpgradeEffects
    effects:
    - !type:Flammable
      multiplier: 2
      multiplierOnExisting: 0.5
    - !type:Ignite
    - !type:AdjustTemperature
      amount: 7500 # thermal energy, not temperature!
  - type: Construction
    graph: CrusherUpgradeLavaCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeLavaAspect

- type: entity
  id: CrusherUpgradeBladeIceFrost
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (ice frost)
  description: Blade slot modkit. Adds +4 cold damage that almost no armor resists, and enough hits freeze and slow the target. Crafted from 5 icewing watcher wings.
  components:
  - type: Sprite
    state: ice-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-ice-frost
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Cold: 4 # Less because no armors protect from it
  - type: WeaponUpgradeEffects
    effects:
    - !type:AdjustTemperature
      amount: -7500 # thermal energy, not temperature! That's not that great actually, but it slows down the target after enough hits
  - type: Construction
    graph: CrusherUpgradeIceCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeIceFrost

- type: entity
  id: CrusherUpgradeBladeSharpness
  parent: BaseCrusherUpgradeBlade
  name: crusher blade upgrade (sharpness)
  description: Blade slot modkit. A simple grindstone that adds +7 slashing damage to every hit. Crafted from 5 watcher wings.
  components:
  - type: Sprite
    state: black-shard
  - type: ItemUpgrade
    name: gun-upgrade-crusher-sharpness
  - type: WeaponUpgradeDamage
    bonusDamage:
      types:
        Slash: 7 # Let's just say crusher hammer becomes extra-sharp on the sides
  - type: Construction
    graph: CrusherUpgradeCrystalConstructionGraph
    node: crystal
  - type: Tag
    tags:
    - CrusherUpgradeBlade
    - CrusherUpgradeBladeSharpness

# Handle upgrades
- type: entity
  id: BaseCrusherUpgradeHandle
  parent: [BaseItem, BaseSecurityCargoContraband]
  name: crusher handle upgrade
  description: A modkit for the handle slot of a crusher weapon. Changes your fighting style - weights knock enemies back, lightweight speeds up attacks by 30%, range extends your reach by 20%. Not craftable - look for one in loot.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Upgrades/crusher.rsi
  - type: Item
    size: Small
  - type: ItemUpgrade
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - CrusherUpgradeHandle

- type: entity
  id: CrusherUpgradeHandleWeights
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (weights)
  description: Handle slot modkit. Weighed loads on the handle - every hit throws the target back 3 tiles.
  components:
  - type: Sprite
    state: handle-weights
  - type: ItemUpgrade
    name: gun-upgrade-crusher-weights
  - type: GunUpgradeComponents
    components:
    - type: FlipOnHit
    - type: MeleeThrowOnHit
      distance: 3
      speed: 3
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleWeights

- type: entity
  id: CrusherUpgradeHandleLight
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (lightweight)
  description: Handle slot modkit. A lightweight handle that speeds up your attacks by 30%. Not craftable - look for one in loot.
  components:
  - type: Sprite
    state: handle-lightweight
  - type: ItemUpgrade
    name: gun-upgrade-crusher-lightweight
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.3 # 30% faster
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleLightweight

- type: entity
  id: CrusherUpgradeHandleRange
  parent: BaseCrusherUpgradeHandle
  name: crusher handle upgrade (range)
  description: Handle slot modkit. An extended handle that increases your attack reach by 20%. Not craftable - look for one in loot.
  components:
  - type: Sprite
    state: handle-spikes # Why spikes improve range? Cuz they're badass.
  - type: ItemUpgrade
    name: gun-upgrade-crusher-range
  - type: WeaponUpgradeRange
    rangeMultiplier: 1.2 # 20% longer
  - type: Tag
    tags:
    - CrusherUpgradeHandle
    - CrusherUpgradeHandleRange

- type: entityTable
  id: CrusherUpgradesMain
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeMainRudeBuster

- type: entityTable
  id: CrusherUpgradesBlade
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeBladeLavaAspect
    - id: CrusherUpgradeBladeIceFrost
    - id: CrusherUpgradeBladeSharpness

- type: entityTable
  id: CrusherUpgradesHandle
  table: !type:GroupSelector
    children:
    - id: CrusherUpgradeHandleWeights
    - id: CrusherUpgradeHandleLight
    - id: CrusherUpgradeHandleRange

- type: entityTable
  id: CrusherUpgrades
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: CrusherUpgradesMain
    - !type:NestedSelector
      tableId: CrusherUpgradesBlade
    - !type:NestedSelector
      tableId: CrusherUpgradesHandle
      weight: 2 # They are uncraftable for now so need more chances
