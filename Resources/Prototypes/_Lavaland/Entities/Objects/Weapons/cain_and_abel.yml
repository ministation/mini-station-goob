# Cain and Abel, the colossus twin daggers (TG port). Combo counter, blood wisps, crystal and
# launch throw modes and the dagger swing ability are implemented in Content.Server/_Lavaland.

- type: entity
  id: LavalandCainDagger
  parent: BaseKnife
  name: Cain
  description: The elder twin. It hungers for its brother's company.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: cain_and_abel
  - type: Item
    size: Small
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    inhandVisuals:
      left:
      - state: cain_and_abel
      right:
      - state: cain_and_abel
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.6667
    range: 2
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: PointLight
    color: "#3db9db"
    radius: 3
    energy: 2
  - type: CainAbel
  - type: ActionGrant
    actions:
    - ActionCainAbelSwing
    - ActionCainAbelReleaseWisps
  - type: ItemActionGrant
    actions:
    - ActionCainAbelSwing
    - ActionCainAbelReleaseWisps
  - type: StaticPrice
    price: 2000

- type: entity
  id: LavalandAbelDagger
  parent: LavalandCainDagger
  name: Abel
  description: The younger twin. It hungers for its brother's blood.

- type: entity
  id: ActionCainAbelSwing
  parent: BaseAction
  name: Dagger swing
  description: Slash everything around you with a flurry of six strikes.
  components:
  - type: Action
    useDelay: 20
    icon:
      sprite: _Lavaland/Objects/Specific/artefacts.rsi
      state: cain_and_abel
  - type: InstantAction
    event: !type:CainAbelSwingActionEvent

- type: entity
  id: ActionCainAbelReleaseWisps
  parent: BaseAction
  name: Release wisps
  description: Fire the stored blood wisps at a target up to nine tiles away.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _Lavaland/Objects/Specific/artefacts.rsi
      state: cain_and_abel
  - type: TargetAction
    range: 9
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CainAbelReleaseWispsActionEvent

# Spaced wisp visual, one per combo point. Parenting is done by the server system.
- type: entity
  id: LavalandCainAbelWisp
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/effects.rsi
    drawdepth: Effects
    layers:
    - state: blood_wisp
      shader: unshaded
  - type: PointLight
    color: "#d74e63"
    radius: 2
    energy: 2
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  parent: BaseBullet
  id: LavalandCainAbelWispProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Slash: 25
    ignoreResistances: true
    impactEffect: LavalandCainAbelWispHit
    soundHit:
      path: /Audio/_Lavaland/Weapons/CainAbel/blood_wisp_explode.ogg
    forceSound: true
  - type: Sprite
    sprite: _Lavaland/Effects/effects.rsi
    layers:
    - state: blood_wisp
      shader: unshaded
  - type: PointLight
    color: "#d74e63"
    radius: 2
    energy: 2
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  id: LavalandCainAbelWispHit
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/effects.rsi
    drawdepth: Effects
    layers:
    - state: wisp_hit
      shader: unshaded
  - type: PointLight
    color: "#d74e63"
    radius: 2
    energy: 2
  - type: TimedDespawn
    lifetime: 0.5
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  parent: BaseBullet
  id: LavalandCainAbelThrowProjectile
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/_Lavaland/Weapons/CainAbel/zipline_hit.ogg
    forceSound: true
  - type: Sprite
    sprite: _Lavaland/Effects/effects.rsi
    layers:
    - state: cain_abel_attack
      shader: unshaded
  - type: PointLight
    color: "#589ac9"
    radius: 2
    energy: 2
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  parent: LavalandCainAbelThrowProjectile
  id: LavalandCainAbelThrowProjectileCrystal
  categories: [ HideSpawnMenu ]
  components:
  - type: CainAbelThrowProjectile
    launch: false

- type: entity
  parent: LavalandCainAbelThrowProjectile
  id: LavalandCainAbelThrowProjectileLaunch
  categories: [ HideSpawnMenu ]
  components:
  - type: CainAbelThrowProjectile
    launch: true

- type: entity
