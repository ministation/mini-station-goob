# Loot of The Thing: the boss chest, the storage room chest, the keycard and the crusher trophy.

# Chest dropped by the boss. TG has no unique Thing loot table, so it rolls the generic
# mining loot the same way a necropolis chest does.
- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateThing
  name: sealed storage crate
  description: A heavy crate, sealed with lab tape. Something inside is still moving.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LavalandLootThing

- type: entityTable
  id: LavalandLootThing
  table: !type:AllSelector
    children:
    - !type:GroupSelector
      children:
      - id: LavalandMiningSoulstone
      - id: LavalandWarpCubeRed
      - id: LavalandEyeOfGod
      - id: LavalandStrangeElixir
      - id: LavalandRodOfAsclepius
      - id: LavalandImmortalityTalisman
    - !type:NestedSelector
      tableId: LavalandLootRarePkaMods
    - !type:GroupSelector
      children:
      - id: LavalandBerserkerArmor
      - id: LavalandBerserkerHelmet
      - id: LavalandVampirismCrystal

# Storage room chest, behind the keycard door. TG puts the AI uplink brain and advanced
# surgery tools in that room.
- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandCrateThingStorage
  name: storage crate
  description: Lab equipment, neatly packed.
  components:
  - type: Transform
    anchored: true
  # Anchoring turns the body static on spawn, declare it so the prototype saves cleanly.
  - type: Physics
    bodyType: Static
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LavalandLootThingStorage

- type: entityTable
  id: LavalandLootThingStorage
  table: !type:AllSelector
    children:
    - id: LavalandAiUplinkBrain
    - id: ScalpelAdvanced
    - id: SawAdvanced
    - !type:GroupSelector
      children:
      - id: MedkitAdvancedFilled
      - id: MedkitCombatFilled

# Keycard dropped by the boss, opens the storage room.
- type: entity
  id: LavalandThingKeycard
  parent: BaseItem
  name: storage room 2 keycard
  description: A pale green keycard. The label reads "Storage Room 2".
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/thing_keycard.rsi
    state: keycard
  - type: Item
    size: Tiny
  - type: IdCard
  - type: Access
    tags:
    - LavalandThingStorage
  - type: StaticPrice
    price: 500

# Crusher trophy: heals the crusher on a melee hit and a little more on a detonation.
- type: entity
  id: LavalandCrusherTrophyFleshGlob
  parent: BaseLavalandCrusherTrophy
  name: flesh glob
  description: A quivering glob of alien flesh. Suitable as a trophy for a kinetic crusher.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/artefacts.rsi
    state: glob
  - type: ItemUpgrade
    name: crusher-trophy-flesh-glob-name
    uniqueGroup: crusherTrophy
  - type: CrusherTrophy
    meleeHeal: 4
    detonationHeal: 10

# AI uplink brain. Insert it into a robotic body to let the station AI take that body over.
- type: entity
  id: LavalandAiUplinkBrain
  parent: BaseItem
  name: AI-uplink brain
  description: A robotic brain with a stubby antenna. A station AI could live in here.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: brain
    color: "#8ef0b0"
  - type: Item
    size: Normal
  - type: Organ
    slotId: posbrain
  - type: AiUplinkBrain
  - type: StaticPrice
    price: 3000