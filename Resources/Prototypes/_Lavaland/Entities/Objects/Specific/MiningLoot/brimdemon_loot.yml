# TG brimdemon loot. The fork has no monster organ framework, so the sac is just butcher loot
# and its organ ability is not ported. Brimdust carries TG reagent and can be composted into
# a hydroponics tray, which is its botanical use.
- type: entity
  id: LavalandBrimdust
  parent: BaseItem
  name: brimdust
  description: Dust from a brimdemon. It is considered valuable for its botanical abilities.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/brimdemon_loot.rsi
    state: brimdust
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 1500
  - type: Produce
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Brimdust
          Quantity: 15

- type: entity
  id: LavalandBrimdustSac
  parent: BaseItem
  components:
  - type: BrimdustSac
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/brimdemon_loot.rsi
    state: brim_sac
  - type: Item
    size: Small
  - type: StaticPrice
    price: 4000
