    Nutriment:
      Min: 1
      Max: 10
      PotencyDivisor: 20
    # TG reagents_add multipliers: mindbreaker 0.04, entpoly 0.08, mushroom hallucinogen 0.04.
    # PotencyDivisor is 1 / multiplier, so the amount matches TG max(round(potency * multiplier), 1).
    MindbreakerToxin:
      Min: 1
      Max: 10
      PotencyDivisor: 25
    Entpoly:
      Min: 1
      Max: 10
      PotencyDivisor: 12
    MushroomHallucinogen:
      Min: 1
      Max: 10
      PotencyDivisor: 25

