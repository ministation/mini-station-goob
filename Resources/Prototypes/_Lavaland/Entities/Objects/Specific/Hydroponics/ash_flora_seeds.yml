# A cache of lavaland seeds, handed out by the seed vault ruin.

- type: entityTable
  id: LavalandSeedCacheLoot
  table: !type:AllSelector
    children:
    - id: LavalandFireBlossomSeeds
    - id: LavalandPolyporeMycelium
    - id: LavalandPodsneyzkaSeeds
    - !type:GroupSelector
      children:
      - id: LavalandCactusSeeds
      - id: LavalandStarCactusSeeds
      - id: LavalandPorciniMycelium
      - id: LavalandInocybeMycelium
      - id: LavalandEmberMycelium
      - id: LavalandSerakaMycelium
      - id: LavalandFonarstolbeSeeds
      - id: LavalandGlowgrowthMycelium
      - id: LavalandVahrezjiaSeeds
      - id: LavalandInozhakustSeeds
      - id: LavalandPlasmaFlowerSeeds

- type: entity
  parent: BaseStorageItem
  id: LavalandSeedCache
  name: lavaland seed cache
  description: A sealed cache of seeds from the ash wastes, kept by the seed vault keepers.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/seeds.rsi
    state: seed
  - type: Item
    size: Small
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: LavalandSeedCacheLoot

# Mushroom bowl, TG crafts it from five mushroom shavings.

- type: constructionGraph
  id: LavalandMushroomBowl
  start: start
  graph:
  - node: start
    edges:
    - to: bowl
      steps:
      - tag: Fungus
        icon:
          sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
          state: mushroom_shavings
        name: construction-graph-tag-fungus
        doAfter: 0.6
      - tag: Fungus
        icon:
          sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
          state: mushroom_shavings
        name: construction-graph-tag-fungus
        doAfter: 0.6
      - tag: Fungus
        icon:
          sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
          state: mushroom_shavings
        name: construction-graph-tag-fungus
        doAfter: 0.6
      - tag: Fungus
        icon:
          sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
          state: mushroom_shavings
        name: construction-graph-tag-fungus
        doAfter: 0.6
      - tag: Fungus
        icon:
          sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
          state: mushroom_shavings
        name: construction-graph-tag-fungus
        doAfter: 0.6
  - node: bowl
    entity: LavalandMushroomBowl

- type: construction
  id: LavalandMushroomBowl
  graph: LavalandMushroomBowl
  startNode: start
  targetNode: bowl
  category: construction-category-misc
  objectType: Item

