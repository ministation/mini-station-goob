# Herald teleshot: the herald teleports to the impact point.
- type: entity
  id: LavalandHeraldTeleshot
  parent: LavalandHeraldBolt
  name: golden bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_yellow
      shader: unshaded
  - type: PointLight
    color: "#FFFF66"
  - type: TeleportShooterOnHit
