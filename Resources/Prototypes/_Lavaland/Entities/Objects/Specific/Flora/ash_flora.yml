# Ash flora ported from TG: code/modules/mining/lavaland/ash_flora.dm
# Sprites are TG icons/obj/mining_zones/ash_flora.dmi converted to RSI, with the
# TG random variant choice kept through RandomSprite.
# Each plant is a Gatherable structure: click with an empty hand to collect the
# produce, with a 10% bonus chance to also get the matching seed pack.

- type: entity
  name: fire blossom
  id: FloraAshFireBlossom
  parent: BaseLavalandFlora
  description: An odd flower that grows commonly near bodies of lava.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
    layers:
    - state: fireblossom1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        fireblossom1: ""
        fireblossom2: ""
  - type: PointLight
    color: "#e8b923"
    radius: 1.5
    energy: 1.2
  - type: Gatherable
    toolWhitelist:
      components:
      - Hands
    loot:
      All: !type:AllSelector
        children:
        - id: FoodAshFireBlossom
          amount: !type:RangeNumberSelector
            range: 1, 3
        - id: LavalandFireBlossomSeeds
          prob: 0.1
  - type: LavalandFloraRegrow

