# Ash flora ported from TG: code/modules/mining/lavaland/ash_flora.dm
# World sprites reuse existing hydroponics plant RSIs (no new binary assets).
# Each plant is a Gatherable structure: click with an empty hand to collect the
# produce, with a 10% bonus chance to also get the matching seed pack.

- type: entity
  name: fire blossom
  id: FloraAshFireBlossom
  parent: BaseLavalandFlora
  description: An odd flower that grows commonly near bodies of lava.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/poppy.rsi
    state: harvest
  - type: PointLight
    color: "#e8b923"
    radius: 1.5
    energy: 1.2
  - type: Gatherable
    toolWhitelist:
      components:
      - Hands
    loot:
      All: !type:AllSelector
        children:
        - id: FoodAshFireBlossom
        - id: LavalandFireBlossomSeeds
          prob: 0.1

