# Drake armour and drake helm, ported from TG. Crafted from ash drake hide.

- type: entity
  parent: [ ClothingOuterBaseToggleable, AllowSuitStorageClothing ]
  id: LavalandEquipmentDrakeArmour
  name: drake armour
  description: A suit of armour crafted from the hide of an ash drake. It is warm to the touch and shrugs off flames.
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/OuterClothing/Armor/drake.rsi
  - type: Clothing
    sprite: _Lavaland/Clothing/OuterClothing/Armor/drake.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: LavalandEquipmentDrakeHelm
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    - Hand
    - Foot
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.85
        Heat: 0
        Caustic: 0
        Radiation: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: FireProtection
    reduction: 0.7
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.05
  - type: Construction
    graph: DrakeArmour
    node: armour

- type: entity
  parent: ClothingHeadBase
  id: LavalandEquipmentDrakeHelm
  name: drake helm
  description: The skull of an ash drake, worn as a helmet. Its empty sockets stare forward.
  components:
  - type: Sprite
    sprite: _Lavaland/Clothing/Head/Helmets/drake.rsi
  - type: Clothing
    sprite: _Lavaland/Clothing/Head/Helmets/drake.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.85
        Heat: 0
        Caustic: 0
  - type: FireProtection
    reduction: 0.5
  - type: Construction
    graph: DrakeHelm
    node: helm
