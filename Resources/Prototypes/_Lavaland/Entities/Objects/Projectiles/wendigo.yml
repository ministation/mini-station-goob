# Wendigo shockwave projectile: TG's colossus bolt variant, armor piercing and slow.
- type: entity
  id: LavalandWendigoShockwave
  parent: LavalandColossusBolt
  categories: [ HideSpawnMenu ]
  name: wendigo shockwave
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 25
    ignoreResistances: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded

# Spiral variant deals less damage, TG gives it its own projectile.
# TG parity: shockwaves bend in flight while they move.
- type: entity
  id: LavalandWendigoSpiralShockwave
  parent: LavalandWendigoShockwave
  name: wendigo shockwave
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 15
    ignoreResistances: true
  - type: WendigoShockwaveCurve
    turnDegrees: 8
