# hierophant damaging thing
- type: entity
  id: LavalandHierophantSquare
  categories: [ DoNotMap ]
  name: hierophant square
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _Lavaland/Effects/mob_effects.rsi
    state: hierophant_blast
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 1
  - type: DamageSquare
    damageDelay: 0.7
    damage:
      types:
        Blunt: 10
        Heat: 10
    damageWhitelist:
      components:
      - MobState
    # TG monster_damage_boost: extra brute damage to megafauna and asteroid fauna, never to players.
    monsterBonusDamage:
      types:
        Blunt: 10
    sound:
      path: /Audio/_Lavaland/Mobs/Bosses/hiero_blast.ogg

# TG blink blasts hit for 30 burn instead of the usual 10.
- type: entity
  parent: LavalandHierophantSquare
  id: LavalandHierophantBlinkSquare
  suffix: Blink
  components:
  - type: DamageSquare
    damageDelay: 0.7
    damage:
      types:
        Heat: 30
    damageWhitelist:
      components:
      - MobState
    sound:
      path: /Audio/_Lavaland/Mobs/Bosses/hiero_blast.ogg

- type: entity
  id: LavalandHierophantChaser
  suffix: DO NOT MAP
  categories: [ DoNotMap ]
  name: hierophant chaser
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: TileChaser
    spawn: LavalandHierophantSquare
  - type: AngerTileChaser
    speedRange: 3.33,10 # TG step 0.3s at zero anger, 0.1s at max anger
    stepsRange: 15,40

- type: entity
  parent: LavalandHierophantSquare
  id: LavalandHierophantSquareSafe
  suffix: Safe
  components:
  - type: DamageSquare
    # The hierophant club blink is a player attack, so it gets no TG monster boost.
    monsterBonusDamage: {}
    damageWhitelist:
      requireAll: true
      components:
      - MobState
      - Fauna # Only damages fauna
