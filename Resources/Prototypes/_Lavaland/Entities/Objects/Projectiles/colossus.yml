# Colossus death bolt: armor-piercing projectile.
- type: entity
  id: LavalandColossusBolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  name: death bolt
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 18
    ignoreResistances: true
  - type: RockBreakingProjectile
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_cyan
      shader: unshaded
  - type: PointLight
    color: "#5FD9F7"
    radius: 1.5
    energy: 3.0

# Colossus boulder: slow and heavy, smashes through rock on the way to the target.
- type: entity
  id: LavalandColossusBoulder
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  name: boulder
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 40
  - type: RockBreakingProjectile
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/meteor.rsi
    layers:
    - state: large
  - type: PointLight
    color: "#B08968"
    radius: 1.5
    energy: 1.5
