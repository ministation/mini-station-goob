# Produce of the TG ash flora (ash_flora.dm). Item sprites reuse the existing
# hydroponics plant RSIs' produce state.

- type: entity
  name: fire blossom
  id: FoodAshFireBlossom
  parent: FoodProduceBase
  description: A flower from a fire blossom.
  components:
  - type: Produce
    seedId: lavalandFireblossom
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/Flora/ash_flora.rsi
    state: fireblossom
  - type: FlavorProfile
    flavors:
    - bitter
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Vitamin
          Quantity: 1

