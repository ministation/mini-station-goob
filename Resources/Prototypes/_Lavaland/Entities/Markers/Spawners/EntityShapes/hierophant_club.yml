# Expanding box
- type: entity
  parent: MarkerBase
  id: HierophantClubShapeExpandingBox
  name: hierophant attack box expanding spawner
  suffix: Hierophant club
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: Sprite
    state: red
  - type: ShapeSpawner
    spawn: LavalandHierophantClubBlast
    alignCoords: true
    shape: !type:AllEntityShape
      children:
      # The aimed tile itself is hit too, the hollow box only covers the ring.
      - id: BoxFilled
        size: 1
      - id: BoxHollow
  - type: ShapeSpawnerCounter
    maxCounter: 3
    spawnPeriod: 0.6
  - type: ExpandingShapeSpawner
    counterSize: 1

# Sequence crosses
- type: entity
  parent: MarkerBase
  id: HierophantClubShapeRandomCross
  name: hierophant attack cross sequence spawner
  suffix: Hierophant club
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: Sprite
    state: red
  - type: ShapeSpawner
    spawn: LavalandHierophantClubBlast
    alignCoords: true
    shape: !type:GroupEntityShape
      children:
      - id: BishopCross
        size: 4
      - id: RookCross
        size: 4
  # Spawns three crosses in a row, then deletes itself. Without a counter it would never delete itself.
  - type: ShapeSpawnerCounter
    maxCounter: 3
    spawnPeriod: 0.4
