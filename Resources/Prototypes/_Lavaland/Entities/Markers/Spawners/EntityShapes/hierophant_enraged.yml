# Enraged hierophant cross blasts: all eight directions at once.
- type: entity
  parent: MarkerBase
  id: HierophantShapeCrossSequenceEnraged
  name: hierophant enraged cross spawner
  suffix: Anger
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: Sprite
    state: red
  - type: ShapeSpawner
    spawn: LavalandHierophantSquare
    shape: !type:NestedEntityShape
      id: QueenCross
      size: 11
    # TG beam_range: 5 tiles at zero anger, 11 at max anger.
    angerSizeRange: 5,11
  - type: ShapeSpawnerCounter
  - type: AngerShapeSpawner
    # TG enraged all-directions blast is a single blasts(target, alldirs) call, cross_counter does not apply.
    counterRange: 1,1
    periodRange: 0.7,1.2
    inversePeriod: true
    # The single wave still locks the boss like the non-enraged cross series.
    pauseAi: true
  - type: ExpandingShapeSpawner
