- type: entityTable
  id: LavalandHeavyMobs
  table: !type:GroupSelector
    children:
    - id: MobLegion
    - !type:GroupSelector
      children:
      - id: MobLavalandGoliath
        weight: 99
      - id: MobLavalandGoliathAncient
        weight: 1
    - id: MobLavalandLobstrosity
      weight: 5
    # TG juvenile lobstrosities are rare; the rest grow up from them.
    - id: MobLavalandLobstrosityJuvenile
      weight: 1
    - id: MobLavalandHivelord
      weight: 5
    - id: LavalandMobBrimdemon
      weight: 5
    # TG biome weights: bileworm 10-35, goldgrub 15-35, raptor 15-20.
    # Scaled to the brimdemon weight above (TG brimdemon is 0-40 per biome).
    - id: LavalandMobBileworm
      weight: 4
    - id: LavalandMobGoldgrub
      weight: 6
    - !type:GroupSelector
      weight: 5
      children:
      - id: LavalandMobRaptorRed
        weight: 25
      - id: LavalandMobRaptorWhite
        weight: 25
      - id: LavalandMobRaptorPurple
        weight: 25
      - id: LavalandMobRaptorGreen
        weight: 25
      - id: LavalandMobRaptorYellow
        weight: 25
      - id: LavalandMobRaptorBlue
        weight: 25
      - id: LavalandMobRaptorBlack
        weight: 1

- type: entityTable
  id: LavalandLightMobs
  table: !type:GroupSelector
    children:
    - id: MobCarpDungeon
    - !type:GroupSelector
      children:
      - id: MobWatcherLavaland
      - id: MobWatcherMagmawing
      - id: MobWatcherIcewing
    - id: MobLavalandBasilisk
      weight: 2
    # TG gutlunch herds are mostly hens (gubbucks) with a few warriors.
    - !type:GroupSelector
      weight: 2
      children:
      - id: MobLavalandGutlunch
        weight: 50
      - id: MobLavalandGutlunchMilk
        weight: 25
      - id: MobLavalandGutlunchWarrior
        weight: 25
    # TG young raptors are spawned by breeding, not by the biome spawner.
    # Keep a small chance so the young variants are reachable in the world.
    - !type:GroupSelector
      weight: 2
      children:
      - id: LavalandMobRaptorYoungRed
        weight: 25
      - id: LavalandMobRaptorYoungWhite
        weight: 25
      - id: LavalandMobRaptorYoungPurple
        weight: 25
      - id: LavalandMobRaptorYoungGreen
        weight: 25
      - id: LavalandMobRaptorYoungYellow
        weight: 25
      - id: LavalandMobRaptorYoungBlue
        weight: 25
      - id: LavalandMobRaptorYoungBlack
        weight: 1

- type: entity
  name: lavaland heavy mob spawner
  id: SpawnerRandomMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandHeavyMobs

- type: entity
  name: lavaland light mob spawner
  id: SpawnerRandomLightMobLavaland
  parent: ProximitySpawnerBase
  suffix: Lavaland, Proximity
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath
  - type: SpawnTableOnTrigger
    table: !type:NestedSelector
      tableId: LavalandLightMobs
