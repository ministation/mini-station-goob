# Entity Shape Attacks
- type: entity
  id: ActionBaseHierophant
  parent: BaseAction
  name: hierophant action
  abstract: true
  components:
  - type: Action
    priority: -21
    useDelay: 2
    icon:
      sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
      state: icon
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction

- type: entity
  id: ActionHierophantBox
  parent: ActionBaseHierophant
  name: Expanding Box
  description: Spawns an expanding box on the target position.
  components:
  - type: AngerDelayAction
    minDelay: 1.5
    maxDelay: 4.0
    inverse: true
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantShapeBoxExpanding

- type: entity
  id: ActionHierophantCrosses
  parent: ActionBaseHierophant
  name: Sequence Crosses
  description: Spawns a sequence of crosses on the target position.
  components:
  - type: AngerDelayAction
    minDelay: 1.5
    maxDelay: 4.0
    inverse: true
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantShapeCrossSequence
      attachToTarget: true

- type: entity
  id: ActionHierophantChasers
  parent: ActionBaseHierophant
  name: Spawn Chasers
  description: Spawns hierophant tile chasers that move towards the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: AngerDelayAction
    minDelay: 7.0
    maxDelay: 20.0
    inverse: true
  - type: EntityTargetAction # Without a target it's pretty much useless?
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandHierophantChaser
      spawnAtUser: true

# TG chaser swarm: four chasers released at once when the swarm attack rolls.
- type: entity
  id: ActionHierophantChaserSwarm
  parent: ActionHierophantChasers
  name: Chaser Swarm
  description: Releases four hierophant tile chasers at once.
  categories: [ HideSpawnMenu ]
  components:
  - type: AngerDelayAction
    minDelay: 12.0
    maxDelay: 25.0
    inverse: true
  - type: EntityTargetAction # Without a target it's pretty much useless?
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandHierophantChaser
      spawnAtUser: true
      amount: 4

- type: entity
  id: ActionHierophantBlink
  parent: ActionBaseHierophant
  name: Blink
  description: Teleports you to the target position.
  components:
  - type: AngerDelayAction
    minDelay: 3.0
    maxDelay: 10.0
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

# Blink slam: lands on a random spot near the target, then blasts the landing area.
- type: entity
  id: ActionHierophantBlinkSlam
  parent: ActionBaseHierophant
  name: Blink Slam
  description: Blinks to a spot near the target and slams the area on arrival.
  components:
  - type: AngerDelayAction
    minDelay: 4.0
    maxDelay: 9.0
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

# Blink slam spawner: wide blast that follows the hierophant's blink.
- type: entity
  parent: BaseHierophantShape
  id: HierophantShapeBlinkSlam
  name: hierophant attack blink slam spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    alignCoords: true
    spawn: LavalandHierophantBlinkSlamSquare
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 5
  - type: TimedDespawn
    lifetime: 1

# Stronger blast used by the blink slam action.
- type: entity
  id: LavalandHierophantBlinkSlamSquare
  categories: [ DoNotMap ]
  name: hierophant blink slam
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Lavaland/Effects/mob_effects.rsi
    state: hierophant_blast
  - type: TimedDespawn
    lifetime: 1
  - type: DamageSquare
    damageDelay: 0.4
    damage:
      types:
        Blunt: 15
        Heat: 15
    damageWhitelist:
      components:
      - MobState
