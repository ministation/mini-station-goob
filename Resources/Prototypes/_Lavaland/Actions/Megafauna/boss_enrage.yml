# Enrage moves for the colossus and the hierophant, unlocked by MobPhases.

# Colossus below 10% HP: TG's Titan's Finale, a one-shot barrage of death bolts.
- type: entity
  id: ActionColossusFinale
  parent: BaseAction
  name: Final Judgement
  description: Unleashes a barrage of shotgun blasts, random bolts and rings of death bolts.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 1800 # TG: once per fight, longer than any colossus fight
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaVolleyActionEvent
      projectile: LavalandColossusBolt
      speed: 14
      volleys: 24
      interval: 1.5
      randomSpread: 180
      countPerAngle: 10
      patterns:
      # Six shotgun waves of six bolts.
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      - [12.5, 7.5, 2.5, -2.5, -7.5, -12.5]
      # Twelve waves of random bolts all over the arena.
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      - []
      # Three random_aoe rings: 32 bolts in every direction.
      - [0, 11.25, 22.5, 33.75, 45, 56.25, 67.5, 78.75, 90, 101.25, 112.5, 123.75, 135, 146.25, 157.5, 168.75, 180, 191.25, 202.5, 213.75, 225, 236.25, 247.5, 258.75, 270, 281.25, 292.5, 303.75, 315, 326.25, 337.5, 348.75]
      - [0, 11.25, 22.5, 33.75, 45, 56.25, 67.5, 78.75, 90, 101.25, 112.5, 123.75, 135, 146.25, 157.5, 168.75, 180, 191.25, 202.5, 213.75, 225, 236.25, 247.5, 258.75, 270, 281.25, 292.5, 303.75, 315, 326.25, 337.5, 348.75]
      - [0, 11.25, 22.5, 33.75, 45, 56.25, 67.5, 78.75, 90, 101.25, 112.5, 123.75, 135, 146.25, 157.5, 168.75, 180, 191.25, 202.5, 213.75, 225, 236.25, 247.5, 258.75, 270, 281.25, 292.5, 303.75, 315, 326.25, 337.5, 348.75]
      # Three dir_shots waves: one bolt along each of the eight directions.
      - [0, 45, 90, 135, 180, -135, -90, -45]
      - [0, 45, 90, 135, 180, -135, -90, -45]
      - [0, 45, 90, 135, 180, -135, -90, -45]

# Hierophant below 50% HP: cross blasts in all directions.
- type: entity
  id: ActionHierophantCrossesEnraged
  parent: ActionBaseHierophant
  name: Enraged Crosses
  description: Spawns cross blasts in all eight directions on the target position.
  components:
  - type: AngerDelayAction
    minDelay: 0.4
    maxDelay: 1.15
    inverse: true
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantShapeCrossSequenceEnraged
      attachToTarget: true

# Hierophant below 50% HP: blinks on a much shorter cooldown.
- type: entity
  id: ActionHierophantBlinkSpam
  parent: ActionBaseHierophant
  name: Blink Spam
  description: Teleports you to the target position with almost no delay.
  components:
  - type: Action
    useDelay: 0.75
  - type: AngerDelayAction
    minDelay: 0.4
    maxDelay: 1.5
    inverse: true
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent
