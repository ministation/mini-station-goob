- type: entity
  id: ActionBdhKineticBurst
  parent: BaseAction
  name: Kinetic Burst
  description: Fires a burst of kinetic bolts at the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaShotActionEvent
      projectile: RapidBulletKinetic
      count: 3
      spread: 24
      speed: 20
      pattern: Cone
