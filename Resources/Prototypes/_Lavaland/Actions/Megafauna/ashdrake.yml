- type: entity
  id: ActionDrakeFireCone
  parent: BaseAction
  name: Fire Breath
  description: Breathes a cone of fire towards the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaShotActionEvent
      projectile: LavalandDrakeFlame
      count: 9
      spread: 85
      speed: 15
      pattern: Cone

# Firestorm: two counter-rotating spirals of flame. The selector only rolls it
# in the second phase, so the fight escalates once the drake is below half health.
- type: entity
  id: ActionDrakeFirestorm
  parent: BaseAction
  name: Firestorm
  description: Spins two counter-rotating spirals of flame around itself.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaShotActionEvent
      projectile: LavalandDrakeFlame
      pattern: Spiral
      duration: 3
      interval: 0.15
      spinSpeed: 150
      speed: 12
      spiralCount: 2

- type: entity
  id: ActionDrakeLavaPools
  parent: BaseAction
  name: Lava Pools
  description: Causes lava to pool around the target position.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandLavaPoolBurst
      attachToTarget: true

- type: entity
  id: ActionDrakeSlam
  parent: BaseAction
  name: Swoop Slam
  description: Swoops at the target position and slams the ground.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

# Meteor shower: a 7x7 volley of meteors slams down around the target position.
- type: entity
  id: ActionDrakeMeteors
  parent: BaseAction
  name: Meteor Shower
  description: Calls down a shower of burning meteors on the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandDrakeMeteorBurst

# Mass fire: a wide carpet of fire around the target position.
- type: entity
  id: ActionDrakeMassFire
  parent: BaseAction
  name: Mass Fire
  description: Sets the ground around the target ablaze.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandDrakeMassFireBurst

# Eruption: a spreading blast of lava that erupts out of the target tile.
- type: entity
  id: ActionDrakeEruption
  parent: BaseAction
  name: Lava Eruption
  description: Erupts a spreading blast of lava out of the target tile.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandDrakeEruptionBurst

# Effect prototypes used by the actions above.

# Meteor called down by the drake: burns up while falling, then leaves a slam crater.
- type: entity
  id: LavalandDrakeMeteor
  name: meteor
  description: A falling meteor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: Objects/Misc/meteor.rsi
    layers:
    - state: medium
      shader: unshaded
      offset: 0,1.5
  - type: PointLight
    color: "#FF6B2B"
    radius: 2.5
    energy: 3
  - type: TimedDespawn
    lifetime: 0.5
  - type: SpawnOnDespawn
    prototype: LavalandDrakeMeteorDamage

- type: entity
  parent: MarkerBase
  id: LavalandDrakeMeteorBurst
  name: drake meteor burst spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandDrakeMeteor
    alignCoords: true
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 7
  - type: TimedDespawn
    lifetime: 1

# Meteor impact: TG's meteors deal fire loss, unlike the swoop slam.
- type: entity
  id: LavalandDrakeMeteorDamage
  categories: [ DoNotMap ]
  name: meteor impact
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 1
  - type: DamageSquare
    damageDelay: 0.2
    damage:
      types:
        Heat: 55
    damageWhitelist:
      components:
      - MobState
    sound:
      path: /Audio/_Lavaland/Effects/meteorimpact.ogg

- type: entity
  parent: MarkerBase
  id: LavalandDrakeMassFireBurst
  name: drake mass fire spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandLavaPool
    alignCoords: true
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 5
  - type: ShapeSpawnerCounter
    maxCounter: 3
    spawnPeriod: 1.5
  - type: TimedDespawn
    lifetime: 5

# Lava eruption spawner: expanding blasts of burning ground around the target.
- type: entity
  parent: MarkerBase
  id: LavalandDrakeEruptionBurst
  name: drake lava eruption spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandDrakeEruptionTile
    alignCoords: true
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 3
  - type: ShapeSpawnerCounter
    maxCounter: 4
    spawnPeriod: 0.6
  - type: ExpandingShapeSpawner
    counterSize: 1
  - type: TimedDespawn
    lifetime: 3

# Eruption tile: fire thrown up by the eruption, stronger than the mass fire pools.
- type: entity
  id: LavalandDrakeEruptionTile
  categories: [ DoNotMap ]
  name: lava eruption
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: /Textures/Effects/fire.rsi
    state: fire
    drawdepth: SmallMobs
  - type: PointLight
    color: "#FF6B2B"
    radius: 1.5
    energy: 2.5
  - type: TimedDespawn
    lifetime: 3
  - type: DamageSquare
    damageDelay: 0.3
    damage:
      types:
        Heat: 35
    damageWhitelist:
      components:
      - MobState

# Fire trail tile: left behind by the drake's dash, burns for a few seconds.
- type: entity
  id: LavalandDrakeFireTrail
  categories: [ DoNotMap ]
  name: drake fire trail
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: /Textures/Effects/fire.rsi
    state: fire
    drawdepth: SmallMobs
  - type: PointLight
    color: "#E25822"
    radius: 1.5
    energy: 2.5
  - type: TimedDespawn
    lifetime: 4
  - type: DamageSquare
    damageDelay: 0.3
    damage:
      types:
        Heat: 20
    damageWhitelist:
      components:
      - MobState

# Lava arena: the enraged drake encases its target in a ring of fire walls
# flooded with lava waves. Escaping enrages the drake (TG lava swoop arena).
- type: entity
  id: ActionDrakeLavaArena
  parent: BaseAction
  name: Lava Arena
  description: Encases the target in an arena of fire.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaLavaArenaActionEvent
