- type: entity
  id: ActionDrakeFireCone
  parent: BaseAction
  name: Fire Breath
  description: Breathes a cone of fire towards the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaShotActionEvent
      projectile: LavalandDrakeFlame
      count: 7
      spread: 70
      speed: 12
      pattern: Cone

- type: entity
  id: ActionDrakeLavaPools
  parent: BaseAction
  name: Lava Pools
  description: Causes lava to pool around the target position.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandLavaPoolBurst
      attachToTarget: true

- type: entity
  id: ActionDrakeSlam
  parent: BaseAction
  name: Swoop Slam
  description: Swoops at the target position and slams the ground.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

# Meteor shower: a 5x5 volley of meteors slams down around the target position.
- type: entity
  id: ActionDrakeMeteors
  parent: BaseAction
  name: Meteor Shower
  description: Calls down a shower of burning meteors on the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandDrakeMeteorBurst

# Mass fire: a wide carpet of fire around the target position.
- type: entity
  id: ActionDrakeMassFire
  parent: BaseAction
  name: Mass Fire
  description: Sets the ground around the target ablaze.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: LavalandDrakeMassFireBurst

# Effect prototypes used by the two actions above.

# Meteor called down by the drake: burns up while falling, then leaves a slam crater.
- type: entity
  id: LavalandDrakeMeteor
  name: meteor
  description: A falling meteor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: Objects/Misc/meteor.rsi
    layers:
    - state: medium
      shader: unshaded
      offset: 0,1.5
  - type: PointLight
    color: "#FF6B2B"
    radius: 2.5
    energy: 3
  - type: TimedDespawn
    lifetime: 0.5
  - type: SpawnOnDespawn
    prototype: LavalandDrakeMeteorDamage

- type: entity
  parent: MarkerBase
  id: LavalandDrakeMeteorBurst
  name: drake meteor burst spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandDrakeMeteor
    alignCoords: true
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 5
  - type: TimedDespawn
    lifetime: 1

# Meteor impact: TG's meteors deal fire loss, unlike the swoop slam.
- type: entity
  id: LavalandDrakeMeteorDamage
  categories: [ DoNotMap ]
  name: meteor impact
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 1
  - type: DamageSquare
    damageDelay: 0.2
    damage:
      types:
        Heat: 40
    damageWhitelist:
      components:
      - MobState
    sound:
      path: /Audio/_Lavaland/Effects/meteorimpact.ogg

- type: entity
  parent: MarkerBase
  id: LavalandDrakeMassFireBurst
  name: drake mass fire spawner
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: ShapeSpawner
    spawn: LavalandLavaPool
    alignCoords: true
    shape: !type:NestedEntityShape
      id: BoxFilled
      size: 5
  - type: ShapeSpawnerCounter
    maxCounter: 3
    spawnPeriod: 1.5
  - type: TimedDespawn
    lifetime: 5
