- type: entity
  id: ActionColossusBoltsSpread
  parent: BaseAction
  name: Bolt Spread
  description: Fires a spread of armor-piercing bolts at the target.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaShotActionEvent
      projectile: LavalandColossusBolt
      count: 5
      spread: 35
      speed: 18
      pattern: Cone

