- type: entity
  id: ActionEliteLegionnaireDash
  parent: BaseAction
  name: Legionnaire Charge
  description: Charges at the target position.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

- type: entity
  id: ActionEliteLegionnaireSummon
  parent: BaseAction
  name: Call Legion
  description: Summons a roaming legion.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -21
    useDelay: 2
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: MobLegion
      spawnAtUser: true

