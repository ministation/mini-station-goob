# Hierophant club
- type: entity
  id: ActionHierophantClubTileMovement
  name: Curse of Tile Movement
  description: Makes the target move only by tiles.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    priority: -23
    useDelay: 30
    icon:
      sprite: /Textures/_Lavaland/Interface/Alerts/hierophantbeat.rsi
      state: hierophant
    itemIconStyle: NoItem
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    event: !type:ToggleTileMovementActionEvent

- type: entity
  id: ActionHierophantClubBlink
  parent: ActionBaseHierophant
  name: Blink
  description: Teleports you to any position you can physically reach.
  components:
  - type: Action
    raiseOnUser: true
    priority: -24
    useDelay: 10
    icon:
      sprite: _Lavaland/Objects/Weapons/hierophant_club.rsi
      state: icon
  - type: TargetAction
    checkCanAccess: true
    range: 10
  - type: WorldTargetAction
    event: !type:MegafaunaBlinkActionEvent

# Club attacks: the same entity shapes the hierophant itself uses, but digging through rock.
- type: entity
  id: ActionHierophantClubBox
  parent: ActionBaseHierophant
  name: Expanding Box
  description: Spawns an expanding box of hierophant blasts on the target position, digging through rock.
  components:
  - type: Action
    raiseOnUser: true
    priority: -25
    useDelay: 15
  - type: TargetAction
    checkCanAccess: false
    range: 6
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantClubShapeExpandingBox

- type: entity
  id: ActionHierophantClubCrosses
  parent: ActionBaseHierophant
  name: Sequence Crosses
  description: Spawns a sequence of hierophant crosses on the target position, digging through rock.
  components:
  - type: Action
    raiseOnUser: true
    priority: -26
    useDelay: 15
  - type: TargetAction
    checkCanAccess: false
    range: 6
  - type: WorldTargetAction
    event: !type:SpawnEntityActionEvent
      spawn: HierophantClubShapeRandomCross

# TG parity: deploy the beacon at your feet, then channel everyone near you to it.
- type: entity
  id: ActionHierophantClubBeacon
  parent: BaseAction
  name: Hierophant Beacon
  description: Detaches the beacon at your feet. With a beacon placed, channels everyone near you to it.
  components:
  - type: Action
    raiseOnUser: true
    priority: -24
    useDelay: 5
    icon:
      sprite: _Lavaland/Objects/Specific/artefacts.rsi
      state: hierophant_beacon
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:HierophantClubBeaconActionEvent
