# Root selector
- type: megafaunaSelector
  id: AshDrake
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: AshDrakeActions

# Actions
- type: megafaunaSelector
  id: AshDrakeActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionDrakeFireCone
    - id: ActionDrakeLavaPools
    - id: ActionDrakeSlam
    - id: ActionDrakeMeteors
    - id: ActionDrakeMassFire
    - id: ActionDrakeEruption
    - id: ActionDrakeFirestorm

- type: megafaunaSelector
  id: ActionDrakeFireCone
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,4.0
      inverse: true
    actionId: ActionDrakeFireCone
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeFireCone

- type: megafaunaSelector
  id: ActionDrakeLavaPools
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 5.0,10.0
      inverse: true
    actionId: ActionDrakeLavaPools
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeLavaPools

- type: megafaunaSelector
  id: ActionDrakeSlam
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.5,2.5
      inverse: true
    actionId: ActionDrakeSlam
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeSlam

- type: megafaunaSelector
  id: ActionDrakeMeteors
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 4.0,8.0
      inverse: true
    actionId: ActionDrakeMeteors
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeMeteors

- type: megafaunaSelector
  id: ActionDrakeMassFire
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 8.0,14.0
      inverse: true
    actionId: ActionDrakeMassFire
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeMassFire

- type: megafaunaSelector
  id: ActionDrakeEruption
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 6.0,11.0
      inverse: true
    actionId: ActionDrakeEruption
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeEruption

# Below half health only: the firestorm spins two flame spirals in opposite directions.
- type: megafaunaSelector
  id: ActionDrakeFirestorm
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 9.0,15.0
      inverse: true
    actionId: ActionDrakeFirestorm
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionDrakeFirestorm
    - !type:PhaseMegafaunaCondition
      phases:
      - 2
