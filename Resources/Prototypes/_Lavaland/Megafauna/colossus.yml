# Root selector
- type: megafaunaSelector
  id: Colossus
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: ColossusActions

# Actions
- type: megafaunaSelector
  id: ColossusActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionColossusBoltsSpread
    - id: ActionColossusBoltsRing
    - id: ActionColossusBoltsSpiral
    - id: ActionColossusCounterSpiral
    - id: ActionColossusFinale
    - id: ActionColossusBoltRain
    - id: ActionColossusBoulderToss

- type: megafaunaSelector
  id: ActionColossusBoltsSpread
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.5,4.0
      inverse: true
    actionId: ActionColossusBoltsSpread
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusBoltsSpread

- type: megafaunaSelector
  id: ActionColossusBoltsRing
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 3.0,6.0
      inverse: true
    actionId: ActionColossusBoltsRing
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusBoltsRing

- type: megafaunaSelector
  id: ActionColossusBoltsSpiral
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 5.0,9.0
      inverse: true
    actionId: ActionColossusBoltsSpiral
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusBoltsSpiral

- type: megafaunaSelector
  id: ActionColossusBoltRain
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 4.0,7.0
      inverse: true
    actionId: ActionColossusBoltRain
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusBoltRain

- type: megafaunaSelector
  id: ActionColossusBoulderToss
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 3.5,6.5
      inverse: true
    actionId: ActionColossusBoulderToss
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusBoulderToss

# Below 10% HP only: TG's final attack.
- type: megafaunaSelector
  id: ActionColossusFinale
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 2.0,5.0
      inverse: true
    actionId: ActionColossusFinale
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusFinale
    - !type:PhaseMegafaunaCondition
      phases:
      - 3

# Below 33% HP only: TG's double counter-spiral.
- type: megafaunaSelector
  id: ActionColossusCounterSpiral
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 4.0,8.0
      inverse: true
    actionId: ActionColossusCounterSpiral
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionColossusCounterSpiral
    - !type:PhaseMegafaunaCondition
      phases:
      - 2
