# Legionnaire: charge, summon legions, skull volley
- type: megafaunaSelector
  id: EliteLegionnaire
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: EliteLegionnaireActions

- type: megafaunaSelector
  id: EliteLegionnaireActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionEliteLegionnaireDash
    - id: ActionEliteLegionnaireSummon
    - id: ActionEliteLegionnaireSkulls
    - id: ActionEliteLegionnaireTurret

- type: megafaunaSelector
  id: ActionEliteLegionnaireDash
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,3.0
      inverse: true
    actionId: ActionEliteLegionnaireDash
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionEliteLegionnaireDash

- type: megafaunaSelector
  id: ActionEliteLegionnaireSummon
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 8.0,15.0
      inverse: true
    actionId: ActionEliteLegionnaireSummon
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionEliteLegionnaireSummon

- type: megafaunaSelector
  id: ActionEliteLegionnaireSkulls
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 3.0,6.0
      inverse: true
    actionId: ActionEliteLegionnaireSkulls
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionEliteLegionnaireSkulls

- type: megafaunaSelector
  id: ActionEliteLegionnaireTurret
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 6.0,12.0
      inverse: true
    actionId: ActionEliteLegionnaireTurret
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionEliteLegionnaireTurret

