# Root selector
- type: megafaunaSelector
  id: Hierophant
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: HierophantActions

# Target selector
- type: megafaunaSelector
  id: PickTargetSimple
  selector: !type:AggressivePickTargetSelector
    delay: !type:MegafaunaConstantNumberSelector
      value: 0
    priority: 10
    targetConditions:
    # Hit closer aggressors more often.
    - !type:RangeCondition
      maxRange: 3.0
    - !type:RangeCondition
      maxRange: 6.0
    - !type:RangeCondition
      maxRange: 9.0

# Actions
- type: megafaunaSelector
  id: HierophantActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionHierophantBox
    - id: ActionHierophantCrosses
    - id: ActionHierophantChasers
    - id: ActionHierophantChaserSwarm
    - id: ActionHierophantBlink
    - id: ActionHierophantCrossesEnraged
    - id: ActionHierophantBlinkSpam
    - id: ActionHierophantBlinkSlam

# Anger delays are needed so hierophant doesn't wait for 4 seconds and then uses all actions at once.
# TODO: add support for actions to have a shared delay so we can remove AngerNumberSelector
- type: megafaunaSelector
  id: ActionHierophantBox
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,4.0
      inverse: true
    actionId: ActionHierophantBox
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantBox

- type: megafaunaSelector
  id: ActionHierophantCrosses
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,3.0
      inverse: true
    actionId: ActionHierophantCrosses
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantCrosses

- type: megafaunaSelector
  id: ActionHierophantChasers
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.1,0.5
      inverse: true
    actionId: ActionHierophantChasers
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantChasers

- type: megafaunaSelector
  id: ActionHierophantChaserSwarm
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 4.0,10.0
      inverse: true
    actionId: ActionHierophantChaserSwarm
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantChaserSwarm

- type: megafaunaSelector
  id: ActionHierophantBlink
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.2,1.0
      inverse: true
    actionId: ActionHierophantBlink
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantBlink

- type: megafaunaSelector
  id: ActionHierophantBlinkSlam
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,3.0
      inverse: true
    actionId: ActionHierophantBlinkSlam
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantBlinkSlam

# Below 50% HP only: all-direction cross blasts and blink spam.
- type: megafaunaSelector
  id: ActionHierophantCrossesEnraged
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.5,1.5
      inverse: true
    actionId: ActionHierophantCrossesEnraged
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantCrossesEnraged
    - !type:PhaseMegafaunaCondition
      phases:
      - 2
      - 3

- type: megafaunaSelector
  id: ActionHierophantBlinkSpam
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.2,1.0
      inverse: true
    actionId: ActionHierophantBlinkSpam
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionHierophantBlinkSpam
    - !type:PhaseMegafaunaCondition
      phases:
      - 2
      - 3
