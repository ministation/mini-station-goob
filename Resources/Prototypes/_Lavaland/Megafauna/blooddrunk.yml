# Base/Guidance selector: melee saw and an occasional kinetic burst.
# The boss fights with two attacks, like TG's blood-drunk miner: the saw and the
# kinetic accelerator. It has no teleport, it walks at the target.
- type: megafaunaSelector
  id: BloodDrunk
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: BloodDrunkActions

- type: megafaunaSelector
  id: BloodDrunkActions
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 4.0,8.0
      inverse: true
    actionId: ActionBdhKineticBurst
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionBdhKineticBurst
