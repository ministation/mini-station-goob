- type: gameMap
  id: CentComm
  isGrid: true
  mapName: 'Центральное Командование'
  mapPath: /Maps/_Mini/centcomm.yml
  minPlayers: 10 # Minimum player to create CentComm station
  stations:
    centcomm:
      stationProto: CentralCommandStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Центральное Командование'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'CC'
      - type: StationJobs
        availableJobs:
          # Head Command (3)
          ChiefCentcom: [ 1, 1 ]
          SpecialOfficer: [ 1, 1 ]
          Magistrate: [ 1, 1 ]
          # Centcomm Officers (3)
          HeadOfSecurityCentcom: [ 1, 1 ]
          OperatorCentcom: [ 1, 1 ]
          RepresentativeCentcom: [ 1, 1 ]
          CentralCommandAssistant: [ 1, 1 ]
          # Centcomm Personnel (13)
          EngineerCentcom: [ 3, 3 ]
          MedicCentcom: [ 3, 3 ]
          SecurityOfficerCentcom: [ 3, 3 ]
          WorkerCentcom: [ 3, 3 ]
          BlueshieldOfficer: [ 3, 3 ]
          # Non-Centcomm Personnel (5)
          OfficerSpecialAssignments: [ 1, 1 ]
          Logist: [ 3, 3 ]
          Accountant: [ 1, 1 ]
          # Total: 27 roles
