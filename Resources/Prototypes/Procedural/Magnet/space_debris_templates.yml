# Asteroid
- type: biomeTemplate
  id: SpaceDebris
  layers:
  - !type:BiomeEntityLayer
    threshold: 0.20
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: Ridged
      octaves: 4
      frequency: 0.065
      gain: 5
      lacunarity: 1.5
    allowedTiles:
    - Plating
    - FloorSteel
    entities:
    - WallSolid
    - AirlockMaintLocked
    - Girder
    - Girder
    - WallReinforced
    - WallSolid
    - WallSolid
  - !type:BiomeEntityLayer
    threshold: 0.5
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: Ridged
      octaves: 4
      frequency: 0.065
      gain: 2
      lacunarity: 1.5
    allowedTiles:
    - Plating
    - Lattice
    entities:
    - Grille
    - Grille
    - Grille
    - GrilleBroken
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSteel
    threshold: -0.5
    divisions: 1
    noise:
      seed: 1
      frequency: 1
    decals:
    - DirtHeavy
    - DirtHeavy
    - DirtHeavy
    - DirtMedium
    - DirtMedium
    - DirtLight
  - !type:BiomeEntityLayer
    threshold: 0.45
    noise:
      seed: 1
      noiseType: OpenSimplex2
      fractalType: Ridged
      octaves: 4
      frequency: 0.065
      gain: 2
      lacunarity: 1.5
    allowedTiles:
    - Plating
    - FloorSteel
    entities:
    - SalvageSpawnerStructuresVarious
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSteel
    - Plating
    threshold: 0.2
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerScrapValuable
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon75
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSteel
    - Plating
    threshold: 0.7
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerTreasure
    - SalvageSpawnerTreasure
    - SalvageSpawnerTreasureValuable
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSteel
    - Plating
    threshold: 0.925
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerMobMagnet75
  # Deca-Code crate. Deliberately the last layer and with a much higher threshold,
  # so it only gets tiles that no other layer (including the decal pass) claimed.
  # The marker itself rolls a crate only 33% of the time, so this stays the rarest
  # find in a debris field. Raise/lower the threshold to tune the frequency.
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSteel
    - Plating
    threshold: 0.95
    noise:
      seed: 2
      frequency: 1
    entities:
    - SalvageDecaCrateSpawner