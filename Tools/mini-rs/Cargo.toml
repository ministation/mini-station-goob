# Мелкие CLI-инструменты CI мини-станции, переписанные с Python на Rust.
# Каждый крейт — одна утилита с тем же контрактом (аргументы, коды выхода,
# формат ::error-аннотаций), что и у исходного скрипта.

[workspace]
resolver = "2"
members = [
    "crates/check-crlf",
    "crates/validate-rsi",
    "crates/validate-yamale",
    "crates/ru-sync",
    "crates/publish-cdn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[profile.release]
# Быстрая сборка важнее размера бинарника для CI-утилит.
opt-level = 1
